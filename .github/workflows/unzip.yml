name: Unzip
on: [push]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o Pusula_Tek_Parca.zip
          rm Pusula_Tek_Parca.zip
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add .
          git commit -m "extract" || true
          git push
