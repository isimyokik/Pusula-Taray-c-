          cat > app/src/main/java/com/pusula/browser/PlaybackService.kt <<'EOF'
          package com.pusula.browser
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.media.MediaMetadata
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.ServiceCompat
          import androidx.core.content.ContextCompat
          class PlaybackService : Service() {
              private var session: MediaSession? = null
              private var playing = false
              private var title = ""
              private var artist = ""
              private var foregroundStarted = false
              override fun onCreate() {
                  super.onCreate()
                  running = true
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) nm.createNotificationChannel(NotificationChannel(CHANNEL, "Medya oynatıcı", NotificationManager.IMPORTANCE_LOW))
                  val s = MediaSession(this, "Rota")
                  s.setCallback(object : MediaSession.Callback() {
                      override fun onPlay() { send(ACTION_PLAY) }
                      override fun onPause() { send(ACTION_PAUSE) }
                      override fun onSkipToNext() { send(ACTION_NEXT) }
                      override fun onSkipToPrevious() { send(ACTION_PREVIOUS) }
                  })
                  s.isActive = true; session = s
              }
              private fun send(action: String) { sendBroadcast(Intent(action).setPackage(packageName)) }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_UPDATE -> { playing = intent.getBooleanExtra("playing", false); title = intent.getStringExtra("title") ?: ""; artist = intent.getStringExtra("artist") ?: "" }
                      ACTION_PLAY, ACTION_TOGGLE, ACTION_PAUSE, ACTION_PREVIOUS, ACTION_NEXT -> send(intent.action!!)
                  }
                  refresh(); return START_NOT_STICKY
              }
              private fun pi(code: Int, action: String): PendingIntent = PendingIntent.getBroadcast(this, code, Intent(action).setPackage(packageName), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
              private fun act(res: Int, label: String, p: PendingIntent): Notification.Action = Notification.Action.Builder(Icon.createWithResource(this, res), label, p).build()
              private fun refresh() {
                  val s = session ?: return
                  val shownTitle = if (title.isBlank()) "Rota" else title
                  s.setMetadata(MediaMetadata.Builder().putString(MediaMetadata.METADATA_KEY_TITLE, shownTitle).putString(MediaMetadata.METADATA_KEY_ARTIST, artist).build())
                  val actions = PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or PlaybackState.ACTION_PLAY_PAUSE or PlaybackState.ACTION_SKIP_TO_NEXT or PlaybackState.ACTION_SKIP_TO_PREVIOUS
                  s.setPlaybackState(PlaybackState.Builder().setActions(actions).setState(if (playing) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED, PlaybackState.PLAYBACK_POSITION_UNKNOWN, 1f).build())
                  val open = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, CHANNEL) else @Suppress("DEPRECATION") Notification.Builder(this)
                  b.setSmallIcon(R.drawable.ic_notif); b.setContentTitle(shownTitle); b.setContentText(if (artist.isBlank()) "Rota" else artist); b.setContentIntent(open); b.setOngoing(playing); b.setVisibility(Notification.VISIBILITY_PUBLIC)
                  b.addAction(act(android.R.drawable.ic_media_previous, "Önceki", pi(1, ACTION_PREVIOUS)))
                  if (playing) b.addAction(act(android.R.drawable.ic_media_pause, "Duraklat", pi(2, ACTION_PAUSE))) else b.addAction(act(android.R.drawable.ic_media_play, "Oynat", pi(3, ACTION_PLAY)))
                  b.addAction(act(android.R.drawable.ic_media_next, "Sonraki", pi(4, ACTION_NEXT)))
                  b.setStyle(Notification.MediaStyle().setMediaSession(s.sessionToken).setShowActionsInCompactView(0, 1, 2))
                  val n = b.build()
                  try {
                      if (!foregroundStarted) { if (Build.VERSION.SDK_INT >= 29) ServiceCompat.startForeground(this, NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK) else startForeground(NOTIF_ID, n); foregroundStarted = true } else { (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).notify(NOTIF_ID, n) }
                      if (!playing) { stopForeground(Service.STOP_FOREGROUND_DETACH); foregroundStarted = false }
                  } catch (_: Exception) { stopSelf() }
              }
              override fun onDestroy() { running = false; try { session?.release() } catch (_: Exception) { }; session = null; super.onDestroy() }
              override fun onBind(intent: Intent?): IBinder? = null
              companion object {
                  const val CHANNEL = "playback"
                  const val NOTIF_ID = 1002
                  const val ACTION_UPDATE = "com.pusula.browser.MEDIA_UPDATE"
                  const val ACTION_PLAY = "com.pusula.browser.MEDIA_PLAY"
                  const val ACTION_TOGGLE = "com.pusula.browser.MEDIA_TOGGLE"
                  const val ACTION_PAUSE = "com.pusula.browser.MEDIA_PAUSE"
                  const val ACTION_PREVIOUS = "com.pusula.browser.MEDIA_PREVIOUS"
                  const val ACTION_NEXT = "com.pusula.browser.MEDIA_NEXT"
                  @Volatile var running = false
                  fun update(ctx: Context, playing: Boolean, title: String, artist: String) { val i = Intent(ctx, PlaybackService::class.java).setAction(ACTION_UPDATE).putExtra("playing", playing).putExtra("title", title).putExtra("artist", artist); try { ContextCompat.startForegroundService(ctx, i) } catch (_: Exception) { } }
                  fun stop(ctx: Context) { try { ctx.stopService(Intent(ctx, PlaybackService::class.java)) } catch (_: Exception) { } }
              }
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/Prefs.kt <<'EOF'
          package com.pusula.browser
          import android.content.Context
          import android.net.Uri
          import org.json.JSONArray
          import org.json.JSONObject
          object Engines {
              class E(val id: String, val name: String, val search: String, val home: String)
              val all = listOf(E("google", "Google", "https://www.google.com/search?q=%s", "https://www.google.com/"), E("ddg", "DuckDuckGo", "https://duckduckgo.com/?q=%s", "https://duckduckgo.com/"), E("bing", "Bing", "https://www.bing.com/search?q=%s", "https://www.bing.com/"))
              fun get(id: String): E = all.firstOrNull { it.id == id } ?: all[0]
          }
          val HOST_LIKE = Regex("^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}([:/?#].*)?$|^(\d{1,3}\.){3}\d{1,3}([:/?#].*)?$|^localhost([:/?#].*)?$")
          fun resolveInput(raw: String, engine: Engines.E): String { val t = raw.trim(); if (t.isEmpty()) return engine.home; if (t.startsWith("http://", true) || t.startsWith("https://", true)) return t; if (!t.contains(' ') && HOST_LIKE.matches(t)) return "https://" + t; return engine.search.replace("%s", Uri.encode(t)) }
          class Prefs(context: Context) {
              class Entry(val title: String, val url: String)
              private val sp = context.getSharedPreferences("pusula", Context.MODE_PRIVATE)
              var engine: String get() = sp.getString("engine", "google") ?: "google"; set(v) { sp.edit().putString("engine", v).apply() }
              var bgPlay: Boolean get() = sp.getBoolean("bgPlay", true); set(v) { sp.edit().putBoolean("bgPlay", v).apply() }
              var theme: String get() = sp.getString("theme", "gece") ?: "gece"; set(v) { sp.edit().putString("theme", v).apply() }
              var barBottom: Boolean get() = sp.getBoolean("barBottom", false); set(v) { sp.edit().putBoolean("barBottom", v).apply() }
              var pins: String get() = sp.getString("pins", "") ?: ""; set(v) { sp.edit().putString("pins", v).apply() }
              var askedNotif: Boolean get() = sp.getBoolean("askedNotif", false); set(v) { sp.edit().putBoolean("askedNotif", v).apply() }
              var adBlock: Boolean get() = sp.getBoolean("adBlock", true); set(v) { sp.edit().putBoolean("adBlock", v).apply() }
              private fun readList(key: String): MutableList<Entry> { val out = ArrayList<Entry>(); try { val arr = JSONArray(sp.getString(key, "[]") ?: "[]"); for (i in 0 until arr.length()) { val o = arr.getJSONObject(i); out.add(Entry(o.optString("t"), o.optString("u"))) } } catch (_: Exception) {}; return out }
              private fun writeList(key: String, list: List<Entry>) { val arr = JSONArray(); for (e in list) arr.put(JSONObject().put("t", e.title).put("u", e.url)); sp.edit().putString(key, arr.toString()).apply() }
              fun bookmarks(): List<Entry> = readList("bookmarks")
              fun isBookmarked(url: String): Boolean = bookmarks().any { it.url == url }
              fun toggleBookmark(title: String, url: String): Boolean { val list = readList("bookmarks"); val had = list.removeAll { it.url == url }; if (!had) list.add(0, Entry(title, url)); writeList("bookmarks", list); return !had }
              fun removeBookmark(url: String) { val l = readList("bookmarks"); l.removeAll { it.url == url }; writeList("bookmarks", l) }
              fun history(): List<Entry> = readList("history")
              fun addHistory(title: String, url: String) { val l = readList("history"); if (l.isNotEmpty() && l[0].url == url) return; l.add(0, Entry(title, url)); while (l.size > 300) l.removeAt(l.size - 1); writeList("history", l) }
              fun removeHistory(url: String) { val l = readList("history"); l.removeAll { it.url == url }; writeList("history", l) }
              fun clearHistory() { sp.edit().putString("history", "[]").apply() }
              fun saveTabs(urls: List<String>, current: Int) { val arr = JSONArray(); for (u in urls) arr.put(u); sp.edit().putString("tabs", arr.toString()).putInt("tabCur", current).apply() }
              fun savedTabs(): List<String> { val out = ArrayList<String>(); try { val arr = JSONArray(sp.getString("tabs", "[]") ?: "[]"); for (i in 0 until arr.length()) out.add(arr.getString(i)) } catch (_: Exception) {}; return out }
              fun savedCurrent(): Int = sp.getInt("tabCur", 0)
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/PusulaBridge.kt <<'EOF'
          package com.pusula.browser
          import android.webkit.JavascriptInterface
          import org.json.JSONArray
          import org.json.JSONObject
          class PusulaBridge(private val prefs: Prefs) {
              @Volatile var trusted = false
              private fun hex(v: Int): String = "#%06X".format(0xFFFFFF and v)
              private fun pinsJson(): Any { val raw = prefs.pins; if (raw.isEmpty()) return JSONObject.NULL; return try { JSONArray(raw) } catch (e: Exception) { JSONObject.NULL } }
              @JavascriptInterface fun savePins(json: String) { if (!trusted) return; try { prefs.pins = JSONArray(json).toString() } catch (e: Exception) { } }
              @JavascriptInterface fun config(): String {
                  if (!trusted) return "{}"
                  val e = Engines.get(prefs.engine); val th = Themes.get(prefs.theme)
                  val bm = JSONArray(); for (b in prefs.bookmarks().take(8)) bm.put(JSONObject().put("t", b.title).put("u", b.url))
                  val hs = JSONArray(); for (h in prefs.history().take(6)) hs.put(JSONObject().put("t", h.title).put("u", h.url))
                  return JSONObject().put("engine", e.name).put("search", e.search).put("bookmarks", bm).put("history", hs).put("pins", pinsJson()).put("dark", th.dark).put("bg", hex(th.bg)).put("surface", hex(th.surface)).put("field", hex(th.field)).put("text", hex(th.text)).put("sub", hex(th.sub)).put("accent", hex(th.accent)).put("accent2", hex(th.accent2)).toString()
              }
          }
          EOF
