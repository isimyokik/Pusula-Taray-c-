                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> { sy = e.rawY; sx = e.rawX; fired = false }
                              MotionEvent.ACTION_MOVE -> if (!fired) {
                                  val dy = e.rawY - sy
                                  val dx = e.rawX - sx
                                  // Alttaysa yukarı çek = aç, üstteyse aşağı çek = aç
