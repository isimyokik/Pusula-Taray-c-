name: Pusula APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Projeyi Olustur
        run: |
          rm -rf app build settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app app/src/main app/src/main/java/com/pusula/player app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "Pusula"
          include(":app")
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.pusula.player"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.pusula.player"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 35
                  versionName = "3.5-Stable"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              
              implementation("androidx.media3:media3-exoplayer:1.5.0")
              implementation("androidx.media3:media3-ui:1.5.0")
              
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.json:json:20240303")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Pusula Medya"
                  android:theme="@style/Theme.Pusula"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|uiMode"
                      android:supportsPictureInPicture="true"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="VERTICAL"
              android:background="#0F1115">

              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="220dp"
                  android:background="#000000"
                  app:resize_mode="fit"
                  app:use_controller="true"
                  app:show_buffering="always" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="10dp">

                  <EditText
                      android:id="@+id/searchEditText"
                      android:layout_width="0dp"
                      android:layout_height="46dp"
                      android:layout_weight="1"
                      android:background="@drawable/bg_search"
                      android:hint="Video ara veya bağlantı yapıştır..."
                      android:textColorHint="#7A7E85"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp"
                      android:inputType="text"
                      android:imeOptions="actionSearch"/>

                  <ImageButton
                      android:id="@+id/searchBtn"
                      android:layout_width="46dp"
                      android:layout_height="46dp"
                      android:layout_marginStart="8dp"
                      android:background="@drawable/bg_btn"
                      android:src="@android:drawable/ic_menu_search"
                      app:tint="#FFFFFF" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/loadingBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="4dp"
                  android:indeterminate="true"
                  android:visibility="gone" />

              <ListView
                  android:id="@+id/resultsListView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:divider="#1F232B"
                  android:dividerHeight="1dp" />

          </LinearLayout>
          EOF

          cat > app/src/main/res/drawable/bg_search.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1A1D24" />
              <corners android:radius="20dp" />
              <stroke android:width="1dp" android:color="#2A2E38" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/bg_btn.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#2F6BFF" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp"
              android:viewportWidth="96" android:viewportHeight="96">
              <path android:fillColor="#2F6BFF" android:pathData="M16,0 H80 A16,16 0 0 1 96,16 V80 A16,16 0 0 1 80,96 H16 A16,16 0 0 1 0,80 V16 A16,16 0 0 1 16,0 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M36,28 L68,48 L36,68 Z"/>
          </vector>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Pusula" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0F1115</item>
                  <item name="android:navigationBarColor">#0F1115</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/pusula/player/MainActivity.kt <<'EOF'
          package com.pusula.player

          import android.app.PictureInPictureParams
          import android.content.res.Configuration
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Rational
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.ArrayAdapter
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import com.pusula.player.databinding.ActivityMainBinding
          import okhttp3.Call
          import okhttp3.Callback
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.Response
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.regex.Pattern

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private var player: ExoPlayer? = null
              private val httpClient = OkHttpClient()
              private val mainHandler = Handler(Looper.getMainLooper())
              
              private val videoList = ArrayList<VideoItem>()
              private lateinit var adapter: ArrayAdapter<String>

              data class VideoItem(val id: String, val title: String, val uploader: String)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, ArrayList())
                  binding.resultsListView.adapter = adapter

                  initPlayer()

                  binding.searchBtn.setOnClickListener { performSearch() }
                  binding.searchEditText.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEARCH) {
                          performSearch()
                          true
                      } else false
                  }

                  binding.resultsListView.setOnItemClickListener { _, _, position, _ ->
                      if (position in videoList.indices) {
                          val item = videoList[position]
                          fetchAndPlay(item.id, item.title)
                      }
                  }

                  // Açılışta trend videoları getir
                  performSearch("Trend Müzikler")
              }

              private fun initPlayer() {
                  if (player == null) {
                      player = ExoPlayer.Builder(this).build().apply {
                          addListener(object : Player.Listener {
                              override fun onPlayerError(error: PlaybackException) {
                                  toast("Oynatma hatası oluştu.")
                                  binding.loadingBar.visibility = View.GONE
                              }
                              override fun onPlaybackStateChanged(state: Int) {
                                  if (state == Player.STATE_READY) {
                                      binding.loadingBar.visibility = View.GONE
                                  }
                              }
                          })
                      }
                      binding.playerView.player = player
                  }
              }

              private fun performSearch(defaultQuery: String? = null) {
                  val query = defaultQuery ?: binding.searchEditText.text.toString().trim()
                  if (query.isEmpty()) return

                  val videoId = extractVideoId(query)
                  if (videoId != null) {
                      fetchAndPlay(videoId, "Oynatılıyor...")
                      return
                  }

                  binding.loadingBar.visibility = View.VISIBLE
                  val searchUrl = "https://invidious.nerdvpn.de/api/v1/search?q=${Uri.encode(query)}&type=video"
                  val request = Request.Builder().url(searchUrl).build()

                  httpClient.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          mainHandler.post {
                              binding.loadingBar.visibility = View.GONE
                              toast("Arama başarısız.")
                          }
                      }

                      override fun onResponse(call: Call, response: Response) {
                          val json = response.body?.string()
                          if (response.isSuccessful && !json.isNullOrEmpty()) {
                              try {
                                  val arr = JSONArray(json)
                                  videoList.clear()
                                  val displayNames = ArrayList<String>()

                                  for (i in 0 until minOf(arr.length(), 20)) {
                                      val obj = arr.getJSONObject(i)
                                      val id = obj.optString("videoId")
                                      val title = obj.optString("title")
                                      val author = obj.optString("author")
                                      if (id.isNotEmpty()) {
                                          videoList.add(VideoItem(id, title, author))
                                          displayNames.add("$title\n($author)")
                                      }
                                  }

                                  mainHandler.post {
                                      binding.loadingBar.visibility = View.GONE
                                      adapter.clear()
                                      adapter.addAll(displayNames)
                                      adapter.notifyDataSetChanged()
                                  }
                              } catch (_: Exception) {
                                  mainHandler.post { binding.loadingBar.visibility = View.GONE }
                              }
                          } else {
                              mainHandler.post { binding.loadingBar.visibility = View.GONE }
                          }
                      }
                  })
              }

              private fun extractVideoId(text: String): String? {
                  val p = Pattern.compile("(?<=watch\\?v=|/videos/|embed/|youtu.be/|/v/|/e/|watch\\?v%3D|watch\\?feature=player_embedded&v=|%2Fvideos%2F|embed%2F|youtu.be%2F|%2Fv%2F)[^#&?]*")
                  val m = p.matcher(text)
                  return if (m.find()) m.group() else if (text.length == 11 && !text.contains(" ")) text else null
              }

              private fun fetchAndPlay(videoId: String, title: String) {
                  binding.loadingBar.visibility = View.VISIBLE
                  val apiUrl = "https://invidious.nerdvpn.de/api/v1/videos/$videoId"
                  val request = Request.Builder().url(apiUrl).build()

                  httpClient.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          mainHandler.post {
                              binding.loadingBar.visibility = View.GONE
                              toast("Video yüklenemedi.")
                          }
                      }

                      override fun onResponse(call: Call, response: Response) {
                          val json = response.body?.string()
                          if (response.isSuccessful && !json.isNullOrEmpty()) {
                              try {
                                  val obj = JSONObject(json)
                                  val formatArray = obj.optJSONArray("formatStreams")
                                  var streamUrl: String? = null
                                  if (formatArray != null && formatArray.length() > 0) {
                                      streamUrl = formatArray.getJSONObject(formatArray.length() - 1).optString("url")
                                  }

                                  mainHandler.post {
                                      if (!streamUrl.isNullOrEmpty()) {
                                          initPlayer()
                                          val item = MediaItem.fromUri(Uri.parse(streamUrl))
                                          player?.setMediaItem(item)
                                          player?.prepare()
                                          player?.play()
                                      } else {
                                          binding.loadingBar.visibility = View.GONE
                                          toast("Akış adresi alınamadı.")
                                      }
                                  }
                              } catch (_: Exception) {
                                  mainHandler.post { binding.loadingBar.visibility = View.GONE }
                              }
                          } else {
                              mainHandler.post { binding.loadingBar.visibility = View.GONE }
                          }
                      }
                  })
              }

              private fun toast(msg: String) { Toast.makeText(this, msg, Toast.LENGTH_SHORT).show() }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && player?.isPlaying == true) {
                      val params = PictureInPictureParams.Builder()
                          .setAspectRatio(Rational(16, 9))
                          .build()
                      enterPictureInPictureMode(params)
                  }
              }

              override fun onPictureInPictureModeChanged(isInPip: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPip, newConfig)
                  val visibility = if (isInPip) View.GONE else View.VISIBLE
                  binding.resultsListView.visibility = visibility
              }

              override fun onStart() { super.onStart(); initPlayer() }
              override fun onStop() {
                  super.onStop()
                  if (!isInPictureInPictureMode) player?.pause()
              }
              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  player = null
              }
          }
          EOF

      - name: Gradle 8.9 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: APK Derle
        run: gradle assembleDebug --no-daemon

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Pusula-Media-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
