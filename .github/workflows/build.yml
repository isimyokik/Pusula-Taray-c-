          object Engines{ val all=listOf(Engine("google","Google","https://www.google.com","https://www.google.com/search?q=%s"),Engine("duck","DuckDuckGo","https://duckduckgo.com","https://duckduckgo.com/?q=%s"),Engine("bing","Bing","https://www.bing.com","https://www.bing.com/search?q=%s")); fun get(id:String)=all.firstOrNull{it.id==id}?:all[0] }
          fun resolveInput(input:String, engine:Engine):String{ val t=input.trim(); if(t.isEmpty()) return engine.home; if(t.startsWith("http://")||t.startsWith("https://")) return t; if(t.contains(".")&&!t.contains(" ")&&!t.contains("://")) return "https://"+t; return engine.search.replace("%s", java.net.URLEncoder.encode(t,"UTF-8")) }
