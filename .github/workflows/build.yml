    private fun fillTabs(grid: LinearLayout, title: TextView, d: Dialog) { grid.removeAllViews(); title.text = "Sekmeler - " + tabs.size; for (rowStart in 0 until tabs.size step 2) { val row = LinearLayout(this); row.orientation = LinearLayout.HORIZONTAL; for (i in rowStart until minOf(rowStart+2,tabs.size)) { val lp = LinearLayout.LayoutParams(0,ViewGroup.LayoutParams.WRAP_CONTENT,1f); lp.setMargins(dp(5),dp(5),dp(5),dp(5)); row.addView(tabCard(i,grid,title,d),lp) }; if (rowStart+1 >= tabs.size) row.addView(View(this),LinearLayout.LayoutParams(0,1,1f)); grid.addView(row,LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT)) } }
