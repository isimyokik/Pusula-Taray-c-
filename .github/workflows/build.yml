          package com.pusula.browser

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat
                    import android.support.v4.media.session.MediaSessionCompat
          import android.support.v4.media.session.PlaybackStateCompat

          /**
           * Uygulama arka plana geçince çalışır. Bildirim göstererek Android'in uygulamayı kapatmasını
           * önler; böylece sayfadaki müzik/video sesi devam eder. Uygulamaya dönünce durdurulur.
           */
          class PlaybackService : Service() {

              private lateinit var mediaSession: MediaSessionCompat

              override fun onCreate() {
                  super.onCreate()
                  mediaSession = MediaSessionCompat(this, "PusulaPlayback").apply {
                      setFlags(MediaSessionCompat.FLAG_HANDLES_MEDIA_BUTTONS or MediaSessionCompat.FLAG_HANDLES_TRANSPORT_CONTROLS)
                      setCallback(object : MediaSessionCompat.Callback() {
                          override fun onPlay() { sendBroadcast(Intent(ACTION_PLAY).setPackage(packageName)) }
                          override fun onPause() { sendBroadcast(Intent(ACTION_PAUSE).setPackage(packageName)) }
                          override fun onSkipToPrevious() { sendBroadcast(Intent(ACTION_PREVIOUS).setPackage(packageName)) }
                          override fun onSkipToNext() { sendBroadcast(Intent(ACTION_NEXT).setPackage(packageName)) }
                      })
                      setPlaybackState(PlaybackStateCompat.Builder()
                          .setActions(PlaybackStateCompat.ACTION_PLAY or PlaybackStateCompat.ACTION_PAUSE or PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS or PlaybackStateCompat.ACTION_SKIP_TO_NEXT)
                          .setState(PlaybackStateCompat.STATE_PLAYING, PlaybackStateCompat.PLAYBACK_POSITION_UNKNOWN, 1f)
                          .build())
                      isActive = true
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_PLAY, ACTION_TOGGLE, ACTION_PAUSE, ACTION_PREVIOUS, ACTION_NEXT -> {
                          sendBroadcast(Intent(intent.action).setPackage(packageName))
                      }
                  }
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel(CHANNEL, "Arka planda çalma", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  fun mediaAction(action: String, title: String, request: Int): NotificationCompat.Action {
                      val pi = PendingIntent.getService(
                          this, request, Intent(this, PlaybackService::class.java).setAction(action),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      val icon = when (action) {
                          ACTION_PREVIOUS -> android.R.drawable.ic_media_previous
                          ACTION_NEXT -> android.R.drawable.ic_media_next
                          ACTION_PLAY, ACTION_TOGGLE -> android.R.drawable.ic_media_play
                          else -> android.R.drawable.ic_media_pause
                      }
                      return NotificationCompat.Action.Builder(icon, title, pi).build()
                  }
                  val n: Notification = NotificationCompat.Builder(this, CHANNEL)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("Pusula medya oynatımı")
                      .setContentText("YouTube ve sayfa medyası")
                      .setContentIntent(open)
                      .addAction(mediaAction(ACTION_PREVIOUS, "Önceki", 11))
                      .addAction(mediaAction(ACTION_TOGGLE, "Oynat / duraklat", 12))
                      .addAction(mediaAction(ACTION_NEXT, "Sonraki", 14))
                      .setStyle(androidx.media.app.NotificationCompat.MediaStyle()
                          .setMediaSession(mediaSession.sessionToken)
                          .setShowActionsInCompactView(0, 1, 2))
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .build()
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          ServiceCompat.startForeground(this, 1002, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                      } else {
                          startForeground(1002, n)
                      }
                  } catch (e: Exception) {
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  if (::mediaSession.isInitialized) {
                      mediaSession.isActive = false
                      mediaSession.release()
                  }
                  super.onDestroy()
              }

              companion object {
                  const val CHANNEL = "playback"
                  const val ACTION_PLAY = "com.pusula.browser.MEDIA_PLAY"
                  const val ACTION_TOGGLE = "com.pusula.browser.MEDIA_TOGGLE"
                  const val ACTION_PAUSE = "com.pusula.browser.MEDIA_PAUSE"
                  const val ACTION_PREVIOUS = "com.pusula.browser.MEDIA_PREVIOUS"
                  const val ACTION_NEXT = "com.pusula.browser.MEDIA_NEXT"
              }
          }
