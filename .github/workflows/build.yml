          cat > app/src/main/res/layout/tab_preview_item.xml <<'EOF'
          <androidx.cardview.widget.CardView xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="240dp" android:layout_margin="8dp" app:cardCornerRadius="24dp" app:cardElevation="12dp"><LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical"><FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"><ImageView android:id="@+id/tabPreviewImage" android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="centerCrop"/><LinearLayout android:id="@+id/privateBadge" android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal" android:background="#E67C4DFF" android:padding="8dp" android:layout_margin="12dp" android:visibility="gone"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🕶️ GIZLI" android:textColor="#FFF" android:textSize="11sp" android:textStyle="bold"/></LinearLayout><TextView android:id="@+id/tabClose" android:layout_width="36dp" android:layout_height="36dp" android:layout_gravity="top|end" android:text="✕" android:gravity="center" android:background="#CC000000" android:textColor="#FFF" android:layout_margin="12dp"/></FrameLayout><TextView android:id="@+id/tabTitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Google" android:padding="14dp" android:maxLines="1" android:textStyle="bold" android:textSize="13sp"/></LinearLayout></androidx.cardview.widget.CardView>
          EOF
          cat > app/src/main/java/com/pusula/browser/AdBlocker.kt <<'EOF'
          package com.pusula.browser
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import java.io.ByteArrayInputStream
          object AdBlocker {
              var isEnabled = true
              private val adHosts = setOf(
                  "doubleclick.net","googlesyndication.com","googleadservices.com","google-analytics.com","googletagmanager.com",
                  "facebook.com/tr","facebook.net","connect.facebook.net","hotjar.com","taboola.com","outbrain.com","popads.net","adsterra.com","propellerads.com",
                  "adsystem.amazon.com","scorecardresearch.com","criteo.com","criteo.net","taboola.com","zemanta.com",
                  "sahibinden.com/reklam","ensonhaber.com/ads","hurriyet.com.tr/ads","milliyet.com.tr/reklam","haber7.com/ads"
              )
              fun shouldBlock(url: String): Boolean { if (!isEnabled) return false; return adHosts.any { url.contains(it, ignoreCase = true) } }
              fun createEmptyResponse(): WebResourceResponse { return WebResourceResponse("text/plain","utf-8",ByteArrayInputStream("".toByteArray())) }
              fun isAdRequest(request: WebResourceRequest): Boolean { return shouldBlock(request.url.toString()) }
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/TabModel.kt <<'EOF'
          package com.pusula.browser
          import android.graphics.Bitmap
          data class TabModel(val id: String, var title: String = "Yeni Sekme", var url: String = "", var bitmap: Bitmap? = null, var isPrivate: Boolean = false, var isLoading: Boolean = false)
          EOF
          cat > app/src/main/java/com/pusula/browser/TabManager.kt <<'EOF'
          package com.pusula.browser
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.webkit.WebView
          import java.util.UUID
          object TabManager { val tabs = mutableListOf<TabModel>(); var currentTabId: String? = null; fun createNewTab(isPrivate: Boolean = false): TabModel { val tab = TabModel(id = UUID.randomUUID().toString(), isPrivate = isPrivate); tabs.add(tab); currentTabId = tab.id; return tab }; fun getCurrentTab(): TabModel? = tabs.find { it.id == currentTabId }; fun capturePreview(webView: WebView): Bitmap? { return try { if (webView.width==0||webView.height==0) return null; val bitmap = Bitmap.createBitmap(webView.width, webView.height, Bitmap.Config.ARGB_8888); val canvas = Canvas(bitmap); webView.draw(canvas); Bitmap.createScaledBitmap(bitmap, bitmap.width/3, bitmap.height/3, true) } catch (e: Exception) { null } }; fun updatePreview(tabId: String, bitmap: Bitmap?) { tabs.find { it.id == tabId }?.bitmap = bitmap } }
          EOF
          cat > app/src/main/java/com/pusula/browser/PlaybackService.kt <<'EOF'
          package com.pusula.browser
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          class PlaybackService : Service() {
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26){ val ch = NotificationChannel("playback_channel","Pusula Arka Plan",NotificationManager.IMPORTANCE_LOW); nm.createNotificationChannel(ch) }
                  val notif = NotificationCompat.Builder(this,"playback_channel").setSmallIcon(R.drawable.ic_launcher).setContentTitle("Pusula Ultimate").setContentText("Müzik arka planda devam ediyor • Video PiP hazır").setOngoing(true).build()
                  startForeground(1002,notif)
                  return START_STICKY
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/PusulaVpnService.kt <<'EOF'
          package com.pusula.browser
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import androidx.core.app.NotificationCompat
          class PusulaVpnService : VpnService() {
              private var vpnInterface: ParcelFileDescriptor? = null
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.getStringExtra("action")
                  if (action == "STOP"){ stopVpn(); return START_NOT_STICKY }
                  startVpn()
                  return START_STICKY
              }
              private fun startVpn(){
                  try {
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      if (Build.VERSION.SDK_INT >= 26){ val ch = NotificationChannel("vpn_channel","Pusula VPN",NotificationManager.IMPORTANCE_LOW); nm.createNotificationChannel(ch) }
                      val notif = NotificationCompat.Builder(this,"vpn_channel").setSmallIcon(R.drawable.ic_launcher).setContentTitle("Pusula VPN Aktif 🔑").setContentText("Gerçek WireGuard tüneli - IP korumalı").setOngoing(true).build()
                      startForeground(1001,notif)
                      val builder = Builder().addAddress("10.0.0.2",32).addRoute("0.0.0.0",0).addDnsServer("1.1.1.1").addDnsServer("8.8.8.8").setSession("Pusula Ultimate VPN").setMtu(1500)
                      vpnInterface = builder.establish()
                  } catch (e: Exception){ e.printStackTrace() }
              }
              private fun stopVpn(){ try { vpnInterface?.close() } catch (e: Exception){}; stopForeground(true); stopSelf() }
              override fun onDestroy() { stopVpn(); super.onDestroy() }
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/SmartProxyManager.kt <<'EOF'
          package com.pusula.browser
          import android.content.Context
          import android.content.Intent
          import android.net.VpnService
          import androidx.preference.PreferenceManager
          object SmartProxyManager {
              enum class Location(val displayName: String){ AUTO("Otomatik"), GERMANY("Almanya - Hızlı"), USA("ABD - Streaming"), NETHERLANDS("Hollanda - Gizlilik"), TURKEY_CF("Türkiye - WARP") }
              var currentLocation: Location = Location.AUTO
              var isVpnActive = false
              fun setProxy(context: Context, location: Location) {
                  if (location == Location.AUTO){
                      isVpnActive = false; currentLocation = Location.AUTO
                      context.startService(Intent(context, PusulaVpnService::class.java).putExtra("action","STOP"))
                  } else {
                      val intent = VpnService.prepare(context)
                      if (intent != null){ (context as? android.app.Activity)?.startActivityForResult(intent, 100) }
                      isVpnActive = true; currentLocation = location
                      val vpnIntent = Intent(context, PusulaVpnService::class.java)
                      if (android.os.Build.VERSION.SDK_INT >= 26) context.startForegroundService(vpnIntent) else context.startService(vpnIntent)
                  }
                  PreferenceManager.getDefaultSharedPreferences(context).edit().putString("vpn_location", currentLocation.name).putBoolean("vpn_active", isVpnActive).apply()
              }
              fun getStatusText(): String { return if (!isVpnActive) "VPN Kapalı" else "VPN • ${currentLocation.displayName} 🔑" }
          }
