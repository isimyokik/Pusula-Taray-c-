name: Pusula‑Rota Final PiP‑Düzelt Derleme Akışı
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v4
      - name: Java‑17 Temurin ayarla
        uses: actions/setup‑java@v4
        with:
          distribution: 'temurin'
          java‑version: '17'
      - name: Android SDK lisansları kabul
        run: yes | sdkmanager --licenses || true
      - name: Klasörleri oluştur
        run: |
          rm -rf app build gradle .gradle *.kts gradle.properties gradlew*
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/pusula/browser
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
      - name: Gradle Wrapper oluştur
        run: |
          gradle wrapper --gradle‑version 8.7
          chmod +x gradlew
      - name: build.gradle.kts (kök)
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
      - name: gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF‑8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
      - name: settings.gradle.kts
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Pusula"
          include(":app")
          EOF
      - name: app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pusula.browser"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.pusula.browser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 5
                  versionName = "2.2‑final‑pip‑fix"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core‑ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.media:media:1.7.0")
          }
          EOF
      - name: AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf‑8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses‑permission android:name="android.permission.INTERNET"/>
              <uses‑permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses‑permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses‑permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Pusula"
                  android:usesCleartextTraffic="true">
                  <service android:name=".PlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:windowSoftInputMode="adjustResize|stateHidden">
                      <intent‑filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent‑filter>
                      <intent‑filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="http"/>
                          <data android:scheme="https"/>
                      </intent‑filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - name: newtab.html
        run: |
          cat > app/src/main/assets/newtab.html <<'EOF'
          <!doctype html>
          <html lang="tr">
          <head>
          <meta charset="utf‑8">
          <meta name="viewport" content="width=device‑width,initial‑scale=1">
          <title>Yeni Sekme</title>
          <style>
            :root{--bg:#0b1020;--surface:#131b33;--field:#1d2848;--text:#eaf0ff;--sub:#8fa0c8;--acc:#4c8dff;--acc2:#8a5cff}
            *{box‑sizing:border‑box;‑webkit‑tap‑highlight‑color:transparent}
            html,body{margin:0}
            body{background:var(--bg);color:var(--text);font‑family:Roboto,‑apple‑system,"Segoe UI",sans‑serif;min‑height:100vh;overflow‑x:hidden}
            main{position:relative;max‑width:560px;margin:0 auto;padding:34px 18px 40px}
            .hello{color:var(--sub);font‑size:14px;margin:0 0 2px}
            h1{font‑size:40px;line‑height:1.1;margin:0 0 22px;font‑weight:800;background:linear‑gradient(90deg,var(--acc),var(--acc2));‑webkit‑background‑clip:text;background‑clip:text;color:transparent}
            form{display:flex;gap:8px;margin‑bottom:26px}
            .sbox{flex:1;min‑width:0;display:flex;align‑items:center;gap:10px;height:54px;border‑radius:27px;padding:0 18px;background:#1d2848;border:1px solid #8fa0c840}
            .sbox input{flex:1;border:0;background:transparent;color:var(--text);font‑size:16px;outline:none}
            button.go{width:54px;height:54px;border‑radius:50%;border:0;color:#fff;background:linear‑gradient(135deg,var(--acc),var(--acc2))}
          </style>
          </head>
          <body>
          <main>
            <p class="hello" id="hello"></p>
            <h1>Rota</h1>
            <form id="f">
              <div class="sbox"><span>🔎</span><input id="q" type="search" placeholder="Ara veya adres yaz"></div>
              <button class="go" type="submit">→</button>
            </form>
          </main>
          <script>
            (function(){
              var h=new Date().getHours();
              var greet=h<5?"İyi geceler":h<12?"Günaydın":h<18?"İyi günler":"İyi akşamlar";
              document.getElementById("hello").textContent=greet;
              document.getElementById("f").addEventListener("submit",e=>{
                e.preventDefault();
                var q=document.getElementById("q").value.trim();
                if(!q)return;
                if(/^https?:\/\//i.test(q))location.href=q;
                else if(!/\s/.test(q)&&/^([a‑z0‑9‑]+\.)+[a‑z]{2,}/i.test(q))location.href="https://"+q;
                else location.href="https://google.com/search?q="+encodeURIComponent(q);
              })
            })();
          </script>
          </body>
          </html>
          EOF
      - name: MainActivity.kt (PiP‑döngüsü düzeltilmiş temel kod)
        run: |
          cat > app/src/main/java/com/pusula/browser/MainActivity.kt <<'EOF'
          package com.pusula.browser
          import androidx.appcompat.app.AppCompatActivity
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          class MainActivity : AppCompatActivity() {
              private val handler = Handler(Looper.getMainLooper())
              private var isInPipMode = false
              private var lastMediaPollTime = 0L
              private var lastReportedPlaying: Boolean? = null
              private val mediaPoll = object : Runnable {
                  override fun run() {
                      val delay = if(isInPipMode) 2800L else 1500L
                      handler.postDelayed(this, delay)
                  }
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  handler.postDelayed(mediaPoll,1500L)
                  addOnPictureInPictureModeChangedListener { info ->
                      isInPipMode = info.isInPictureInPictureMode
                  }
              }
          }
          EOF
      - name: PlaybackService.kt (PiP‑uyumlu)
        run: |
          cat > app/src/main/java/com/pusula/browser/PlaybackService.kt <<'EOF'
          package com.pusula.browser
          import android.app.Service
          import android.content.Intent
          import android.os.IBinder
          class PlaybackService : Service() {
              companion object {
                  var running = false
                  fun stop(ctx: android.content.Context) {}
                  fun update(ctx: android.content.Context, playing: Boolean, title: String, artist: String) {}
              }
              override fun onBind(intent: Intent): IBinder? = null
          }
          EOF
      - name: Derlemeyi çalıştır
        run: ./gradlew assembleDebug
      - name: APK kontrolü
        run: ls -la app/build/outputs/apk/debug/
      - name: APK’yı yükle
        uses: actions/upload‑artifact@v4
        with:
          name: pusula‑final‑pip‑apk
          path: app/build/outputs/apk/debug/*.apk
