name: APK derle
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Zip'i ac ve derle
        run: |
          unzip -qo pusula-android.zip
          cd pusula-android
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          echo "=== OZET ==="
          grep -nE "Caused by|Unsupported|What went wrong|error:|^e: |Could not|class file" build.log | cut -c1-300 | head -40
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: pusula-apk
          path: pusula-android/app/build/outputs/apk/debug/app-debug.apk
