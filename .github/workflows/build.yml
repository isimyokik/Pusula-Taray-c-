        val d = Dialog(this); val col = LinearLayout(this); col.orientation = LinearLayout.VERTICAL; col.setPadding(dp(14),dp(12),dp(14),dp(22)); val r = dp(28).toFloat(); val bgd = GradientDrawable(); bgd.setColor(cSurface); bgd.cornerRadii = floatArrayOf(r,r,r,r,0f,0f,0f,0f); col.background = bgd
        val tt = TextView(this); tt.text = "Tema sec"; tt.textSize = 18f; tt.setTypeface(null,Typeface.BOLD); tt.setTextColor(cText); tt.setPadding(dp(6),0,0,dp(10)); col.addView(tt)
        for (p in Themes.all) { val row = LinearLayout(this); row.orientation = LinearLayout.HORIZONTAL; row.gravity = Gravity.CENTER_VERTICAL; row.setPadding(dp(14),dp(10),dp(14),dp(10)); val rb = GradientDrawable(); rb.setColor(p.bg); rb.cornerRadius = dp(18).toFloat(); if(p.id==prefs.theme) rb.setStroke(dp(2),p.accent) else rb.setStroke(dp(1),p.field); row.background = rb; val dot = View(this); val dg = GradientDrawable(GradientDrawable.Orientation.TL_BR,intArrayOf(p.accent,p.accent2)); dg.shape = GradientDrawable.OVAL; dot.background = dg; row.addView(dot,LinearLayout.LayoutParams(dp(30),dp(30))); val nm = TextView(this); nm.text = p.name; nm.textSize = 15.5f; nm.setTextColor(p.text); nm.setTypeface(null,Typeface.BOLD); nm.setPadding(dp(14),0,0,0); row.addView(nm,LinearLayout.LayoutParams(0,ViewGroup.LayoutParams.WRAP_CONTENT,1f)); if(p.id==prefs.theme){ val ck = TextView(this); ck.text = "v"; ck.textSize = 18f; ck.setTextColor(p.accent); ck.setTypeface(null,Typeface.BOLD); row.addView(ck) }; row.setOnClickListener{ d.dismiss(); prefs.theme = p.id; applyTheme(); onDone() }; val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT); lp.bottomMargin = dp(8); col.addView(row,lp) }
        val sc = ScrollView(this); sc.addView(col); sheetWindow(d,sc,false); d.show()
    }
    private fun chooseEngine(onDone: () -> Unit) { val names = Engines.all.map{ it.name }.toTypedArray(); val sel = Engines.all.indexOfFirst{ it.id==prefs.engine }.coerceAtLeast(0); AlertDialog.Builder(this).setTitle("Arama Motoru").setSingleChoiceItems(names,sel){ dlg,which -> prefs.engine = Engines.all[which].id; dlg.dismiss(); onDone() }.show() }
