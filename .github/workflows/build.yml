          cat > app/src/main/java/com/pusula/browser/Prefs.kt <<'EOF'
          package com.pusula.browser
          import android.content.Context
          import android.net.Uri
          object Engines {
              class E(val id: String, val name: String, val search: String, val home: String)
              val all = listOf(E("google", "Google", "https://www.google.com/search?q=%s", "https://www.google.com/"))
              fun get(id: String): E = all[0]
          }
          fun resolveInput(raw: String, engine: Engines.E): String {
              val t = raw.trim()
              if (t.isEmpty()) return engine.home
              if (t.startsWith("http://", true) || t.startsWith("https://", true)) return t
              return engine.search.replace("%s", Uri.encode(t))
          }
          class Prefs(context: Context) {
              class Entry(val title: String, val url: String)
              private val sp = context.getSharedPreferences("pusula", Context.MODE_PRIVATE)
              var engine: String
                  get() = sp.getString("engine", "google") ?: "google"
                  set(v) { sp.edit().putString("engine", v).apply() }
              var bgPlay: Boolean
                  get() = sp.getBoolean("bgPlay", true)
                  set(v) { sp.edit().putBoolean("bgPlay", v).apply() }
              var theme: String
                  get() = sp.getString("theme", "gece") ?: "gece"
                  set(v) { sp.edit().putString("theme", v).apply() }
              var barBottom: Boolean
                  get() = sp.getBoolean("barBottom", false)
                  set(v) { sp.edit().putBoolean("barBottom", v).apply() }
              var pins: String
                  get() = sp.getString("pins", "") ?: ""
                  set(v) { sp.edit().putString("pins", v).apply() }
              var askedNotif: Boolean
                  get() = sp.getBoolean("askedNotif", false)
                  set(v) { sp.edit().putBoolean("askedNotif", v).apply() }
              var adBlock: Boolean
                  get() = sp.getBoolean("adBlock", true)
                  set(v) { sp.edit().putBoolean("adBlock", v).apply() }
              var startMode: String
                  get() = sp.getString("startMode", "resume") ?: "resume"
                  set(v) { sp.edit().putString("startMode", v).apply() }
              var clearOnExit: Boolean
                  get() = sp.getBoolean("clearOnExit", false)
                  set(v) { sp.edit().putBoolean("clearOnExit", v).apply() }
              fun bookmarks(): List<Entry> = emptyList()
              fun isBookmarked(url: String): Boolean = false
              fun toggleBookmark(title: String, url: String): Boolean = false
              fun removeBookmark(url: String) {}
              fun history(): List<Entry> = emptyList()
              fun addHistory(title: String, url: String) {}
              fun removeHistory(url: String) {}
              fun clearHistory() {}
              fun saveTabs(urls: List<String>, current: Int) {}
              fun savedTabs(): List<String> = emptyList()
              fun savedCurrent(): Int = 0
          }
