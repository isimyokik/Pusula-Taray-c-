
name: Pusula APK - PiP Fix
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Projeyi olustur (PiP fixli)
        run: |
          mkdir -p app/src/main/java/com/pusula/browser
          cat > app/src/main/java/com/pusula/browser/MainActivity.kt <<'ENDMAIN'
          package com.pusula.browser
          import android.annotation.SuppressLint
          import android.app.Dialog
          import android.app.PendingIntent
          import android.app.DownloadManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.res.ColorStateList
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.Message
          import android.text.InputType
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.webkit.CookieManager
          import android.webkit.JsResult
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebStorage
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.core.widget.doAfterTextChanged
          import androidx.appcompat.widget.SwitchCompat
          import androidx.webkit.ScriptHandler
          import androidx.webkit.WebViewAssetLoader
          import androidx.webkit.WebViewCompat
          import androidx.webkit.WebViewFeature
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayInputStream

          class MainActivity : AppCompatActivity() {
              private class BTab(val web: WebView, val bridge: PusulaBridge, val incognito: Boolean = false) {
                  var title: String = "Yeni Sekme"; var url: String = ""; var pendingUrl: String? = null; var desktop: Boolean = false; var mobileUa: String = ""; var progress: Int = 100; var preview: Bitmap? = null; var adScript: ScriptHandler? = null; var keepScript: ScriptHandler? = null; var hookScript: ScriptHandler? = null
              }
              private class SheetItem(val icon: String, val label: String, val on: Boolean, val act: () -> Unit)
              private class BgWebView(c: Context) : WebView(c) {
                  var blockPause = false
                  override fun onWindowVisibilityChanged(visibility: Int) { if (visibility != GONE) super.onWindowVisibilityChanged(VISIBLE) }
                  override fun onPause() { if (blockPause) return; super.onPause() }
              }
              private val tabs = ArrayList<BTab>(); private var cur = -1; private var shown: WebView? = null
              private lateinit var prefs: Prefs; private lateinit var loader: WebViewAssetLoader; private val handler = Handler(Looper.getMainLooper())
              private var appInBackground = false; private var hasMedia = false; private var lastPlaying = false; private var lastTitle = ""; private var lastArtist = ""
              private lateinit var dockBar: LinearLayout
              private val roleLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { afterRole() }
              private val notifLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { }
              private val mediaStatePoll = object : Runnable { override fun run() { pollMedia(); handler.postDelayed(this, 1500L) } }
              private fun pollMedia() { val t = tabs.getOrNull(cur) ?: return; try { t.web.evaluateJavascript(MEDIA_STATE_JS) { raw -> onMediaState(raw) } } catch (_: Exception) { } }
              private fun onMediaState(raw: String?) {
                  var has = false; var playing = false; var title = ""; var artist = ""
                  try {
                      if (raw != null && raw != "null" && raw != "\"\"") {
                          val inner = JSONArray("[" + raw + "]").getString(0)
                          if (inner.isNotEmpty()) { val o = JSONObject(inner); has = true; playing = o.optBoolean("p"); title = o.optString("t"); artist = o.optString("a") }
                      }
                  } catch (_: Exception) { return }
                  if (!has) { if (hasMedia) { hasMedia = false; lastPlaying = false; PlaybackService.stop(this) }; return }
                  val changed = !hasMedia || playing != lastPlaying || title != lastTitle || artist != lastArtist
                  hasMedia = true; lastPlaying = playing; lastTitle = title; lastArtist = artist
                  if (changed && (playing || PlaybackService.running)) PlaybackService.update(this, playing, title, artist)
              }
              private fun pipAction(code: Int, icon: Int, label: String, action: String): android.app.RemoteAction {
                  val pi = PendingIntent.getBroadcast(this, code, Intent(action).setPackage(packageName), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  return android.app.RemoteAction(android.graphics.drawable.Icon.createWithResource(this, icon), label, label, pi)
              }
              private val pipMediaPump = object : Runnable {
                  override fun run() {
                      if (!isInPictureInPictureMode) return
                      try { shown?.onResume() } catch (_: Exception) { }
                      try { currentWeb()?.evaluateJavascript(KEEP_MEDIA_PLAYING_JS, null) } catch (_: Exception) { }
                      handler.postDelayed(this, 800L)
                  }
              }
              private fun enterPip() {
                  if (Build.VERSION.SDK_INT < 26) { toast("Bu Android sürümü küçük pencereyi desteklemiyor"); return }
                  try {
                      val t = tabs.getOrNull(cur)
                      (t?.web as? BgWebView)?.blockPause = true
                      try { shown?.onResume() } catch (_: Exception) { }
                      try { currentWeb()?.evaluateJavascript(KEEP_MEDIA_PLAYING_JS, null) } catch (_: Exception) { }
                      val b = android.app.PictureInPictureParams.Builder().setAspectRatio(android.util.Rational(16, 9))
                      val acts = ArrayList<android.app.RemoteAction>()
                      acts.add(pipAction(11, R.drawable.ic_pip_prev, "Önceki", PlaybackService.ACTION_PREVIOUS))
                      acts.add(pipAction(12, R.drawable.ic_pip_play, "Oynat/Duraklat", PlaybackService.ACTION_TOGGLE))
                      acts.add(pipAction(13, R.drawable.ic_pip_next, "Sonraki", PlaybackService.ACTION_NEXT))
                      b.setActions(acts)
                      enterPictureInPictureMode(b.build())
                  } catch (_: Exception) { toast("Küçük pencere açılamadı") }
              }
              private fun onPipChanged(pip: Boolean) {
                  topBar.visibility = if (pip) View.GONE else View.VISIBLE
                  dockBar.visibility = if (pip) View.GONE else View.VISIBLE
                  handler.removeCallbacks(pipMediaPump)
                  val bgView = tabs.getOrNull(cur)?.web as? BgWebView
                  if (pip) {
                      closeFind(); appInBackground = false; bgView?.blockPause = true
                      try { shown?.onResume() } catch (_: Exception) { }
                      try { currentWeb()?.evaluateJavascript(KEEP_MEDIA_PLAYING_JS, null) } catch (_: Exception) { }
                      if (customView == null) { try { currentWeb()?.evaluateJavascript(PIP_ON_JS, null) } catch (_: Exception) { } }
                      if (hasMedia) PlaybackService.update(this, true, lastTitle, lastArtist)
                      handler.post(pipMediaPump)
                      handler.postDelayed({ try { currentWeb()?.evaluateJavascript(KEEP_MEDIA_PLAYING_JS, null) } catch (_: Exception) { }; try { currentWeb()?.evaluateJavascript(PIP_ON_JS, null) } catch (_: Exception) { } }, 300)
                  } else {
                      bgView?.blockPause = false
                      for (tab in tabs) { try { tab.web.evaluateJavascript(PIP_OFF_JS, null) } catch (_: Exception) { } }
                      try { shown?.onResume() } catch (_: Exception) { }
                  }
              }
              override fun onUserLeaveHint() { super.onUserLeaveHint(); if (Build.VERSION.SDK_INT >= 26 && (customView != null || hasMedia)) enterPip() }
              private val mediaControlReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val act = intent?.action ?: return
                      val js = when (act) {
                          PlaybackService.ACTION_PLAY, PlaybackService.ACTION_TOGGLE -> MEDIA_TOGGLE_JS
                          PlaybackService.ACTION_PAUSE -> MEDIA_PAUSE_JS
                          PlaybackService.ACTION_PREVIOUS -> MEDIA_PREVIOUS_JS
                          PlaybackService.ACTION_NEXT -> MEDIA_NEXT_JS
                          else -> return
                      }
                      val targets = if (act == PlaybackService.ACTION_PAUSE) tabs.toList() else listOfNotNull(tabs.getOrNull(cur))
                      targets.forEach { t -> try { t.web.evaluateJavascript(js, null) } catch (_: Exception) { } }
                  }
              }
              private val backgroundMediaPump = object : Runnable { override fun run() { if (!appInBackground || !prefs.bgPlay) return; try { tabs.getOrNull(cur)?.web?.evaluateJavascript(BACKGROUND_MEDIA_JS, null) } catch (_: Exception) { }; handler.postDelayed(this, 1200L) } }
              private lateinit var root: LinearLayout; private lateinit var content: FrameLayout; private lateinit var fullscreen: FrameLayout; private lateinit var urlField: EditText; private lateinit var progress: ProgressBar; private lateinit var backBtn: ImageButton; private lateinit var fwdBtn: ImageButton; private lateinit var tabCount: TextView; private lateinit var privateBadge: TextView; private lateinit var findBar: LinearLayout; private lateinit var findInput: EditText; private lateinit var findCount: TextView
              private var dark = false; private var cBg = 0; private var cSurface = 0; private var cField = 0; private var cText = 0; private var cSub = 0; private var cIcon = 0; private var cAccent = 0; private var cAccent2 = 0; private lateinit var topBar: LinearLayout
              private var customView: View? = null; private var customCb: WebChromeClient.CustomViewCallback? = null; private var fileCb: ValueCallback<Array<Uri>>? = null; private var startUrl: String? = null
              private val fileLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res -> fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res.resultCode, res.data)); fileCb = null }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState); prefs = Prefs(this)
                  loader = WebViewAssetLoader.Builder().addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this)).build()
                  loadPalette(); WindowCompat.setDecorFitsSystemWindows(window, false); buildUi()
                  val bars = WindowInsetsControllerCompat(window, window.decorView); bars.isAppearanceLightStatusBars = !dark; bars.isAppearanceLightNavigationBars = !dark
                  startUrl = intent?.dataString
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) { override fun handleOnBackPressed() { handleBack() } })
                  val mediaFilter = IntentFilter().apply { addAction(PlaybackService.ACTION_PLAY); addAction(PlaybackService.ACTION_TOGGLE); addAction(PlaybackService.ACTION_PAUSE); addAction(PlaybackService.ACTION_PREVIOUS); addAction(PlaybackService.ACTION_NEXT) }
                  ContextCompat.registerReceiver(this, mediaControlReceiver, mediaFilter, ContextCompat.RECEIVER_NOT_EXPORTED)
                  startBrowsing(); addOnPictureInPictureModeChangedListener { info -> onPipChanged(info.isInPictureInPictureMode) }
                  handler.removeCallbacks(mediaStatePoll); handler.postDelayed(mediaStatePoll, 1500L)
                  if (Build.VERSION.SDK_INT >= 33 && !prefs.askedNotif && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) { prefs.askedNotif = true; notifLauncher.launch(android.Manifest.permission.POST_NOTIFICATIONS) }
              }
              override fun onNewIntent(intent: Intent) { super.onNewIntent(intent); val u = intent.dataString ?: return; openTab(u) }
              override fun onPause() {
                  super.onPause(); saveTabs(); CookieManager.getInstance().flush()
                  if (isInPictureInPictureMode) { try { shown?.onResume() } catch (_: Exception) { }; return }
                  if (prefs.bgPlay && hasMedia && lastPlaying) { appInBackground = true; handler.removeCallbacks(backgroundMediaPump); handler.post(backgroundMediaPump); PlaybackService.update(this, true, lastTitle, lastArtist) }
                  else { appInBackground = true; val bgView = tabs.getOrNull(cur)?.web as? BgWebView; if (bgView?.blockPause == true) return; shown?.onPause() }
              }
              override fun onStop() {
                  super.onStop()
                  if (isInPictureInPictureMode) { try { shown?.onResume() } catch (_: Exception) { }; try { currentWeb()?.evaluateJavascript(KEEP_MEDIA_PLAYING_JS, null) } catch (_: Exception) { }; handler.removeCallbacks(pipMediaPump); handler.post(pipMediaPump) }
              }
              override fun onResume() { super.onResume(); appInBackground = false; handler.removeCallbacks(backgroundMediaPump); shown?.onResume() }
              override fun onDestroy() { try { unregisterReceiver(mediaControlReceiver) } catch (_: Exception) { }; handler.removeCallbacks(backgroundMediaPump); handler.removeCallbacks(mediaStatePoll); handler.removeCallbacks(pipMediaPump); PlaybackService.stop(this); for (t in tabs) { try { t.web.destroy() } catch (_: Exception) { } }; super.onDestroy() }
              private fun loadPalette() { val pal = Themes.get(prefs.theme); dark = pal.dark; cBg = pal.bg; cSurface = pal.surface; cField = pal.field; cText = pal.text; cSub = pal.sub; cIcon = pal.icon; cAccent = pal.accent; cAccent2 = pal.accent2; window.setBackgroundDrawable(ColorDrawable(cBg)) }
              private fun applyTheme() { if (customView != null) hideCustom(); val web = shown; if (web != null) content.removeView(web); loadPalette(); buildUi(); if (web != null) { content.addView(web, 0, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)) }; val bars = WindowInsetsControllerCompat(window, window.decorView); bars.isAppearanceLightStatusBars = !dark; bars.isAppearanceLightNavigationBars = !dark; val t = tabs.getOrNull(cur); if (t != null) { privateBadge.visibility = if (t.incognito) View.VISIBLE else View.GONE; topBar.setBackgroundColor(if (t.incognito) 0xFF1B0F38.toInt() else cBg); if (t.url.startsWith(ASSET_PREFIX)) t.web.reload() }; syncUi() }
              private fun dp(v: Int): Int = (v * resources.displayMetrics.density + 0.5f).toInt()
              private fun shape(color: Int, radiusDp: Int): GradientDrawable { val g = GradientDrawable(); g.setColor(color); g.cornerRadius = dp(radiusDp).toFloat(); return g }
              private fun ripple(content: Drawable?): RippleDrawable = RippleDrawable(ColorStateList.valueOf(0x33888888), content, ColorDrawable(Color.WHITE))
              private fun iconBtn(res: Int, desc: String, onClick: (View) -> Unit): ImageButton { val b = ImageButton(this); b.setImageResource(res); b.setColorFilter(cIcon); b.background = ripple(null); b.contentDescription = desc; b.scaleType = ImageView.ScaleType.CENTER; b.setOnClickListener { v -> onClick(v) }; return b }
              private fun textBtn(label: String, onClick: () -> Unit): TextView { val t = TextView(this); t.text = label; t.textSize = 16f; t.setTextColor(cIcon); t.gravity = Gravity.CENTER; t.background = ripple(null); t.setOnClickListener { onClick() }; return t }
              private fun buildUi() {
                  val match = ViewGroup.LayoutParams.MATCH_PARENT; val wrap = ViewGroup.LayoutParams.WRAP_CONTENT
                  root = LinearLayout(this); root.orientation = LinearLayout.VERTICAL; root.setBackgroundColor(cBg); root.isFocusable = true; root.isFocusableInTouchMode = true
                  topBar = LinearLayout(this); topBar.orientation = LinearLayout.HORIZONTAL; topBar.gravity = Gravity.CENTER_VERTICAL; topBar.setPadding(dp(10), dp(8), dp(10), dp(8)); topBar.setBackgroundColor(cBg)
                  privateBadge = TextView(this); privateBadge.text = "🕶 GİZLİ"; privateBadge.textSize = 11f; privateBadge.setTypeface(null, Typeface.BOLD); privateBadge.setTextColor(Color.WHITE); privateBadge.gravity = Gravity.CENTER; privateBadge.setPadding(dp(10), 0, dp(10), 0); privateBadge.background = shape(0xFF8B3DFF.toInt(), 16); privateBadge.visibility = View.GONE
                  val blp = LinearLayout.LayoutParams(wrap, dp(32)); blp.rightMargin = dp(8); topBar.addView(privateBadge, blp)
                  val pill = LinearLayout(this); pill.orientation = LinearLayout.HORIZONTAL; pill.gravity = Gravity.CENTER_VERTICAL; pill.background = shape(cSurface, 24); pill.elevation = dp(3).toFloat()
                  val lead = TextView(this); lead.text = "🔎"; lead.textSize = 15f; lead.gravity = Gravity.CENTER; pill.addView(lead, LinearLayout.LayoutParams(dp(42), dp(46)))
                  urlField = EditText(this); urlField.hint = "Ara veya adres yaz"; urlField.setHintTextColor(cSub); urlField.setTextColor(cText); urlField.textSize = 15f; urlField.isSingleLine = true; urlField.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI; urlField.imeOptions = EditorInfo.IME_ACTION_GO; urlField.setSelectAllOnFocus(true); urlField.background = null; urlField.setPadding(0, 0, 0, 0)
                  urlField.setOnEditorActionListener { _, actionId, event -> if (actionId == EditorInfo.IME_ACTION_GO || (event != null && event.keyCode == KeyEvent.KEYCODE_ENTER)) { submitUrl(); true } else false }
                  urlField.setOnFocusChangeListener { _, hasFocus -> if (!hasFocus) syncUrlText() }
                  pill.addView(urlField, LinearLayout.LayoutParams(0, dp(46), 1f)); pill.addView(iconBtn(R.drawable.ic_reload, "Yenile") { reloadCurrent() }, LinearLayout.LayoutParams(dp(44), dp(46)))
                  topBar.addView(pill, LinearLayout.LayoutParams(0, dp(46), 1f))
                  progress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal); progress.max = 100; progress.progressTintList = ColorStateList.valueOf(cAccent); progress.progressBackgroundTintList = ColorStateList.valueOf(cBg); progress.visibility = View.INVISIBLE
                  content = FrameLayout(this); content.setBackgroundColor(cBg)
                  if (!prefs.barBottom) { root.addView(topBar, LinearLayout.LayoutParams(match, wrap)); root.addView(progress, LinearLayout.LayoutParams(match, dp(3))) }
                  root.addView(content, LinearLayout.LayoutParams(match, 0, 1f))
                  findBar = LinearLayout(this); findBar.orientation = LinearLayout.HORIZONTAL; findBar.gravity = Gravity.CENTER_VERTICAL; findBar.setBackgroundColor(cSurface); findBar.setPadding(dp(8), dp(4), dp(4), dp(4)); findBar.visibility = View.GONE
                  findInput = EditText(this); findInput.hint = "Sayfada bul"; findInput.setHintTextColor(cSub); findInput.setTextColor(cText); findInput.textSize = 15f; findInput.isSingleLine = true; findInput.background = shape(cField, 18); findInput.setPadding(dp(14), 0, dp(14), 0)
                  findInput.doAfterTextChanged { text -> val t = text?.toString() ?: ""; val web = currentWeb(); if (web != null) { if (t.isEmpty()) { web.clearMatches(); findCount.text = "" } else { web.findAllAsync(t) } } }
                  findBar.addView(findInput, LinearLayout.LayoutParams(0, dp(36), 1f))
                  findCount = TextView(this); findCount.setTextColor(cSub); findCount.textSize = 13f; findCount.setPadding(dp(8), 0, dp(8), 0); findBar.addView(findCount, LinearLayout.LayoutParams(wrap, wrap))
                  findBar.addView(textBtn("▲") { currentWeb()?.findNext(false) }, LinearLayout.LayoutParams(dp(40), dp(40))); findBar.addView(textBtn("▼") { currentWeb()?.findNext(true) }, LinearLayout.LayoutParams(dp(40), dp(40))); findBar.addView(textBtn("✕") { closeFind() }, LinearLayout.LayoutParams(dp(40), dp(40)))
                  root.addView(findBar, LinearLayout.LayoutParams(match, wrap))
                  if (prefs.barBottom) { root.addView(progress, LinearLayout.LayoutParams(match, dp(3))); root.addView(topBar, LinearLayout.LayoutParams(match, wrap)) }
                  dockBar = LinearLayout(this); dockBar.orientation = LinearLayout.VERTICAL; dockBar.setBackgroundColor(cBg); dockBar.setPadding(dp(12), dp(6), dp(12), dp(8))
                  val bottom = LinearLayout(this); bottom.orientation = LinearLayout.HORIZONTAL; bottom.gravity = Gravity.CENTER_VERTICAL; bottom.background = shape(cSurface, 30); bottom.elevation = dp(8).toFloat(); bottom.setPadding(dp(6), dp(4), dp(6), dp(4))
                  backBtn = iconBtn(R.drawable.ic_back, "Geri") { goBack() }; fwdBtn = iconBtn(R.drawable.ic_forward, "İleri") { goForward() }
                  val homeBtn = iconBtn(R.drawable.ic_home, "Ana Sayfa") { goHome() }; homeBtn.setColorFilter(Color.WHITE); val hg = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(cAccent, cAccent2)); hg.shape = GradientDrawable.OVAL; homeBtn.background = RippleDrawable(ColorStateList.valueOf(0x55FFFFFF), hg, null)
                  val addBtn = iconBtn(R.drawable.ic_add, "Yeni Sekme") { openTab(null) }; val menuBtn = iconBtn(R.drawable.ic_menu, "Menü") { v -> showMenu(v) }
                  val tabsWrap = FrameLayout(this); tabsWrap.background = ripple(null); tabsWrap.contentDescription = "Sekmeler"; tabsWrap.setOnClickListener { showTabs() }
                  tabCount = TextView(this); tabCount.gravity = Gravity.CENTER; tabCount.textSize = 12f; tabCount.setTypeface(null, Typeface.BOLD); tabCount.setTextColor(cIcon); val tcBg = GradientDrawable(); tcBg.setColor(0); tcBg.cornerRadius = dp(7).toFloat(); tcBg.setStroke(dp(2), cIcon); tabCount.background = tcBg
                  tabsWrap.addView(tabCount, FrameLayout.LayoutParams(dp(24), dp(24), Gravity.CENTER))
                  for (v in listOf<View>(backBtn, fwdBtn)) bottom.addView(v, LinearLayout.LayoutParams(0, dp(48), 1f))
                  val hlp = LinearLayout.LayoutParams(dp(48), dp(48)); hlp.leftMargin = dp(4); hlp.rightMargin = dp(4); bottom.addView(homeBtn, hlp)
                  for (v in listOf<View>(addBtn, tabsWrap, menuBtn)) bottom.addView(v, LinearLayout.LayoutParams(0, dp(48), 1f))
                  dockBar.addView(bottom, LinearLayout.LayoutParams(match, wrap)); root.addView(dockBar, LinearLayout.LayoutParams(match, wrap))
                  fullscreen = FrameLayout(this); fullscreen.setBackgroundColor(Color.BLACK); fullscreen.visibility = View.GONE
                  val frame = FrameLayout(this); frame.addView(root, FrameLayout.LayoutParams(match, match)); frame.addView(fullscreen, FrameLayout.LayoutParams(match, match)); setContentView(frame)
                  ViewCompat.setOnApplyWindowInsetsListener(root) { v, insets -> val b = insets.getInsets(WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.displayCutout() or WindowInsetsCompat.Type.ime()); v.setPadding(b.left, b.top, b.right, b.bottom); insets }
                  root.requestFocus(); updateTabCount()
              }
              private fun startBrowsing() {
                  if (tabs.isEmpty()) {
                      when (prefs.startMode) {
                          "home" -> openTab(Engines.get(prefs.engine).home)
                          "blank" -> openTab(null)
                          else -> {
                              val saved = prefs.savedTabs()
                              if (saved.isEmpty()) openTab(null)
                              else { for (u in saved.take(12)) { val t = createTab(); if (u.startsWith("http")) { t.pendingUrl = u; t.url = u; t.title = shownUrl(u) } else { t.pendingUrl = NEWTAB_URL } }; switchTo(if (prefs.savedCurrent() in tabs.indices) prefs.savedCurrent() else 0) }
                          }
                      }
                  }
                  val s = startUrl; startUrl = null; if (s != null) openTab(s)
              }
              private fun currentWeb(): WebView? = if (cur in tabs.indices) tabs[cur].web else null
              @SuppressLint("SetJavaScriptEnabled", "AddJavascriptInterface")
              private fun createTab(incognito: Boolean = false): BTab {
                  val web = BgWebView(this); val bridge = PusulaBridge(prefs); val tab = BTab(web, bridge, incognito); val s = web.settings
                  s.javaScriptEnabled = true; s.domStorageEnabled = true; s.mediaPlaybackRequiresUserGesture = false; s.setSupportMultipleWindows(true); s.javaScriptCanOpenWindowsAutomatically = false; s.setSupportZoom(true); s.builtInZoomControls = true; s.displayZoomControls = false; s.loadWithOverviewMode = true; s.useWideViewPort = true; s.allowFileAccess = false; s.allowContentAccess = false; s.setGeolocationEnabled(false); s.mixedContentMode = android.webkit.WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  val ua = s.userAgentString.replace("; wv", "").replace(Regex("Version/\\d+\\.\\d+ "), ""); s.userAgentString = ua; tab.mobileUa = ua
                  web.addJavascriptInterface(bridge, "Pusula"); syncScripts(tab)
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) { try { WebViewCompat.addDocumentStartJavaScript(web, MEDIA_HOOK_JS, setOf("*")) } catch (_: Exception) { } }
                  web.setFindListener { active, total, _ -> if (tabs.getOrNull(cur) === tab) { findCount.text = if (total == 0) "0" else "${active + 1}/$total" } }
                  web.setDownloadListener { url, userAgent, contentDisposition, mimeType, _ -> startDownload(url, userAgent, contentDisposition, mimeType) }
                  web.webViewClient = makeClient(tab); web.webChromeClient = makeChrome(tab); tabs.add(tab); updateTabCount(); return tab
              }
              private fun syncScripts(t: BTab) {
                  if (!WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) return
                  try {
                      if (t.hookScript == null) t.hookScript = WebViewCompat.addDocumentStartJavaScript(t.web, MEDIA_HOOK_JS, setOf("*"))
                      if (prefs.adBlock && t.adScript == null) t.adScript = WebViewCompat.addDocumentStartJavaScript(t.web, STABLE_AD_BLOCKER_JS, setOf("*")) else if (!prefs.adBlock && t.adScript != null) { t.adScript?.remove(); t.adScript = null }
                      if (prefs.bgPlay && t.keepScript == null) t.keepScript = WebViewCompat.addDocumentStartJavaScript(t.web, KEEP_PLAYING_JS, setOf("*")) else if (!prefs.bgPlay && t.keepScript != null) { t.keepScript?.remove(); t.keepScript = null }
                  } catch (_: Exception) { }
              }
              private fun settingsChanged() { for (t in tabs) syncScripts(t); val c = tabs.getOrNull(cur) ?: return; if (c.url.startsWith("http")) c.web.reload() }
              private fun openTab(url: String?, load: Boolean = true, incognito: Boolean = false): BTab? { if (tabs.size >= MAX_TABS) { toast("En fazla $MAX_TABS sekme"); return null }; val t = createTab(incognito); switchTo(tabs.size - 1); if (load) t.web.loadUrl(url ?: (if (incognito) NEWTAB_URL + "?private=1" else NEWTAB_URL)); return t }
              private fun switchTo(i: Int) {
                  if (i !in tabs.indices) return
                  shown?.let { tabs.getOrNull(cur)?.let { oldTab -> capturePreview(oldTab) }; content.removeView(it) }
                  for (idx in tabs.indices) { if (idx != i) { try { tabs[idx].web.evaluateJavascript(MEDIA_PAUSE_JS, null) } catch (_: Exception) {} } }
                  cur = i; val t = tabs[i]; shown = t.web; content.addView(t.web, 0, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)); t.web.onResume()
                  try { t.web.evaluateJavascript(BACKGROUND_MEDIA_JS, null) } catch (_: Exception) {}
                  val p = t.pendingUrl; if (p != null) { t.pendingUrl = null; t.web.loadUrl(p) }
                  closeFind(); privateBadge.visibility = if (t.incognito) View.VISIBLE else View.GONE; topBar.setBackgroundColor(if (t.incognito) 0xFF1B0F38.toInt() else cBg); syncUi()
              }
              private fun closeTab(index: Int) {
                  if (index !in tabs.indices) return; val t = tabs[index]; val wasCurrent = index == cur
                  if (wasCurrent) { content.removeView(t.web); shown = null }; t.web.stopLoading(); t.web.clearHistory(); t.web.clearCache(true); t.web.destroy(); tabs.removeAt(index)
                  if (tabs.isEmpty()) { cur = -1; openTab(null); return }
                  if (wasCurrent) switchTo(minOf(index, tabs.size - 1)) else if (index < cur) cur--; updateTabCount()
              }
              private fun updateTabCount() { tabCount.text = tabs.size.toString() }
              private fun saveTabs() { if (tabs.isEmpty()) return; val urls = ArrayList<String>(); for (t in tabs) { if (t.incognito) continue; val u = t.pendingUrl ?: t.url; urls.add(if (u.startsWith("http")) u else NEWTAB_URL) }; prefs.saveTabs(urls, 0) }
              private fun shownUrl(u: String): String = if (u.isEmpty() || u.startsWith(ASSET_PREFIX)) "" else u.removePrefix("https://").removePrefix("http://").removePrefix("www.").trimEnd('/')
              private fun syncUrlText() { val t = tabs.getOrNull(cur); urlField.setText(if (t == null) "" else shownUrl(t.pendingUrl ?: t.url)) }
              private fun syncUi() { val t = tabs.getOrNull(cur) ?: return; if (!urlField.hasFocus()) syncUrlText(); setLoadProgress(t.progress); refreshNav(); updateTabCount() }
              private fun setLoadProgress(p: Int) { progress.progress = p; progress.visibility = if (p in 1..99) View.VISIBLE else View.INVISIBLE }
              private fun refreshNav() { val web = currentWeb(); backBtn.alpha = if (web != null && (web.canGoBack() || tabs.size > 1)) 1f else 0.35f; fwdBtn.alpha = if (web != null && web.canGoForward()) 1f else 0.35f }
              private fun loadInCurrent(url: String) { val t = tabs.getOrNull(cur) ?: return; t.pendingUrl = null; t.web.loadUrl(url) }
              private fun submitUrl() { val text = urlField.text.toString(); loadInCurrent(resolveInput(text, Engines.get(prefs.engine))); hideKeyboard(); urlField.clearFocus(); root.requestFocus() }
              private fun goBack() { val web = currentWeb() ?: return; if (web.canGoBack()) web.goBack() else if (tabs.size > 1) closeTab(cur) }
              private fun goForward() { val web = currentWeb() ?: return; if (web.canGoForward()) web.goForward() }
              private fun goHome() { loadInCurrent(Engines.get(prefs.engine).home) }
              private fun reloadCurrent() { val t = tabs.getOrNull(cur) ?: return; if (t.progress in 1..99) t.web.stopLoading() else t.web.reload() }
              private fun handleBack() { val web = currentWeb(); when { customView != null -> hideCustom(); findBar.visibility == View.VISIBLE -> closeFind(); urlField.hasFocus() -> { hideKeyboard(); urlField.clearFocus(); root.requestFocus() }; web != null && web.canGoBack() -> web.goBack(); tabs.size > 1 -> closeTab(cur); else -> finish() } }
              private fun shouldBlockAd(uri: Uri): Boolean { val host = (uri.host ?: "").lowercase(); val path = (uri.encodedPath ?: "").lowercase(); val blockedHosts = listOf("doubleclick.net", "googlesyndication.com"); if (blockedHosts.any { host == it || host.endsWith("." + it) }) return true; return path.contains("/ads/") || path.contains("/pagead/") }
              private fun makeClient(tab: BTab): WebViewClient = object : WebViewClient() {
                  override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? { val uri = request?.url ?: return null; if (prefs.adBlock && shouldBlockAd(uri)) { return WebResourceResponse("text/plain", "utf-8", ByteArrayInputStream(ByteArray(0))) }; return loader.shouldInterceptRequest(uri) }
                  override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean { val u = request?.url ?: return false; val scheme = u.scheme ?: return false; return when (scheme) { "http", "https", "about", "blob", "data" -> false; else -> openExternal(u.toString()) } }
                  override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) { val u = url ?: ""; tab.bridge.trusted = u.startsWith(ASSET_PREFIX); tab.url = u; tab.progress = 5; if (tabs.getOrNull(cur) === tab) syncUi() }
                  override fun onPageFinished(view: WebView?, url: String?) { tab.progress = 100; val u = url ?: return; if (u.startsWith("http") && !tab.incognito) { val title = view?.title; prefs.addHistory(if (title.isNullOrBlank()) u else title, u) }; if (tabs.getOrNull(cur) === tab) syncUi() }
              }
              private fun makeChrome(tab: BTab): WebChromeClient = object : WebChromeClient() {
                  override fun onProgressChanged(view: WebView?, newProgress: Int) { tab.progress = newProgress; if (tabs.getOrNull(cur) === tab) setLoadProgress(newProgress) }
                  override fun onReceivedTitle(view: WebView?, title: String?) { if (!title.isNullOrBlank()) tab.title = title }
                  override fun onShowCustomView(view: View?, callback: CustomViewCallback?) { if (view == null || customView != null) { callback?.onCustomViewHidden(); return }; customView = view; customCb = callback; fullscreen.addView(view, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)); fullscreen.visibility = View.VISIBLE; setBars(false) }
                  override fun onHideCustomView() { hideCustom() }
              }
              private fun hideCustom() { val v = customView ?: return; fullscreen.removeView(v); fullscreen.visibility = View.GONE; customView = null; customCb?.onCustomViewHidden(); customCb = null; setBars(true) }
              private fun setBars(show: Boolean) { val c = WindowInsetsControllerCompat(window, window.decorView); if (show) { c.show(WindowInsetsCompat.Type.systemBars()) } else { c.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE; c.hide(WindowInsetsCompat.Type.systemBars()) } }
              private fun openExternal(url: String): Boolean { try { val i = if (url.startsWith("intent:")) Intent.parseUri(url, Intent.URI_INTENT_SCHEME) else Intent(Intent.ACTION_VIEW, Uri.parse(url)); i.addCategory(Intent.CATEGORY_BROWSABLE); i.component = null; i.selector = null; startActivity(i) } catch (_: Exception) { toast("Açılamadı") }; return true }
              private fun startDownload(url: String, ua: String?, cd: String?, mime: String?) { if (!url.startsWith("http")) return; try { val name = URLUtil.guessFileName(url, cd, mime); val req = DownloadManager.Request(Uri.parse(url)); if (mime != null) req.setMimeType(mime); val cookie = CookieManager.getInstance().getCookie(url); if (cookie != null) req.addRequestHeader("Cookie", cookie); if (ua != null) req.addRequestHeader("User-Agent", ua); req.setTitle(name); req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED); req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name); (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(req); toast("İndiriliyor: $name") } catch (_: Exception) { toast("İndirilemedi") } }
              private fun toast(msg: String) { Toast.makeText(this, msg, Toast.LENGTH_SHORT).show() }
              private fun hideKeyboard() { val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager; imm.hideSoftInputFromWindow(root.windowToken, 0) }
              private fun sheetWindow(d: Dialog, view: View, full: Boolean) { d.requestWindowFeature(android.view.Window.FEATURE_NO_TITLE); d.setContentView(view); d.window?.let { w -> w.setBackgroundDrawable(ColorDrawable(if (full) cBg else Color.TRANSPARENT)); w.setLayout(ViewGroup.LayoutParams.MATCH_PARENT, if (full) ViewGroup.LayoutParams.MATCH_PARENT else ViewGroup.LayoutParams.WRAP_CONTENT); if (!full) w.setGravity(Gravity.BOTTOM) } }
              // Basit stublar - orijinalinde dolu, burada crash engellemek için minimal
              private fun showMenu(anchor: View) { val pm = PopupMenu(this, anchor); pm.menu.add("Yeni sekme").setOnMenuItemClickListener { openTab(null); true }; pm.menu.add("Ayarlar").setOnMenuItemClickListener { showSettings(); true }; pm.menu.add("Küçük pencere").setOnMenuItemClickListener { enterPip(); true }; pm.show() }
              private fun showTabs() { val d = Dialog(this); val col = LinearLayout(this); col.orientation = LinearLayout.VERTICAL; col.setBackgroundColor(cBg); col.setPadding(dp(12), dp(12), dp(12), dp(12)); for (i in tabs.indices) { val b = textBtn(tabs[i].title.ifEmpty { "Sekme ${i+1}" }) { d.dismiss(); switchTo(i) }; col.addView(b) }; val sv = ScrollView(this); sv.addView(col); sheetWindow(d, sv, true); d.show() }
              private fun showSettings() { val d = Dialog(this); val col = LinearLayout(this); col.orientation = LinearLayout.VERTICAL; col.setPadding(dp(20), dp(20), dp(20), dp(20)); col.setBackgroundColor(cBg); col.addView(textBtn("Tema: ${Themes.get(prefs.theme).name}") { d.dismiss(); chooseTheme { showSettings() } }); col.addView(textBtn("Kapat") { d.dismiss() }); sheetWindow(d, col, true); d.show() }
              private fun chooseTheme(onDone: () -> Unit) { val d = Dialog(this); val col = LinearLayout(this); col.orientation = LinearLayout.VERTICAL; col.setBackgroundColor(cSurface); col.setPadding(dp(12), dp(12), dp(12), dp(12)); for (p in Themes.all) { val b = textBtn(p.name) { prefs.theme = p.id; d.dismiss(); applyTheme(); onDone() }; col.addView(b) }; sheetWindow(d, col, false); d.show() }
              private fun isDefaultBrowser(): Boolean = false
              private fun afterRole() {}
              private fun askDefaultBrowser() {}
              private fun resolveInput(text: String, engine: Engine): String { val t = text.trim(); if (t.startsWith("http")) return t; if (t.contains(".") && !t.contains(" ")) return "https://$t"; return engine.search.replace("%s", Uri.encode(t)) }
              private fun capturePreview(tab: BTab) {}
              private fun closeFind() { findBar.visibility = View.GONE; currentWeb()?.clearMatches() }
              private companion object {
                  const val ASSET_PREFIX = "https://appassets.androidplatform.net/"; const val NEWTAB_URL = "https://appassets.androidplatform.net/assets/newtab.html"; const val MAX_TABS = 20
                  const val KEEP_PLAYING_JS = "(function(){try{Object.defineProperty(document,'hidden',{get:function(){return false},configurable:true});}catch(e){}})();"
                  const val STABLE_AD_BLOCKER_JS = "true"
                  const val BACKGROUND_MEDIA_JS = "(function(){try{document.querySelectorAll('video,audio').forEach(function(m){if(m.dataset.pusulaWasPlaying==='1' && m.paused){m.play();}});}catch(e){}})();"
                  const val MEDIA_TOGGLE_JS = "(function(){var v=document.querySelector('video');if(v){if(v.paused)v.play();else v.pause();}})();"
                  const val MEDIA_PAUSE_JS = "(function(){document.querySelectorAll('video').forEach(function(v){v.pause();})})();"
                  const val MEDIA_PREVIOUS_JS = "(function(){})();"
                  const val MEDIA_NEXT_JS = "(function(){})();"
                  const val MEDIA_HOOK_JS = ""
                  const val MEDIA_STATE_JS = "(function(){var v=document.querySelector('video');if(!v)return '';return JSON.stringify({p:!v.paused,t:document.title,a:''});})();"
                  const val KEEP_MEDIA_PLAYING_JS = "(function(){document.querySelectorAll('video').forEach(function(v){if(v.paused)v.play();})})();"
                  const val PIP_ON_JS = "true"
                  const val PIP_OFF_JS = "true"
              }
          }
          ENDMAIN
          echo "MainActivity.kt PiP fix ile yazıldı"

      - name: APK derle
        run: |
          # Geri kalan dosyalar zaten ilk yml'de oluşturuluyordu, burada sadece MainActivity'i overwrite ettik
          gradle :app:assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: Pusula-PiP-Fix-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
