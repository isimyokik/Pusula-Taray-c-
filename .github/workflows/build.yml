              private fun openTab(url: String?, load: Boolean = true, incognito: Boolean = false): BTab? {
                  if(tabs.size>=MAX_TABS){toast("En fazla $MAX_TABS sekme açılabilir");return null}
                  val t=createTab(incognito); switchTo(tabs.size‑1); if(load) t.web.loadUrl(url ?: if(incognito) "$NEWTAB_URL?private=1" else NEWTAB_URL); return t
              }
              private fun switchTo(i: Int) {
                  if(i !in tabs.indices) return; shown?.let{content.removeView(it)}; cur=i; val t=tabs[i]; shown=t.web
                  content.addView(t.web,0,FrameLayout.LayoutParams(-1,-1)); t.web.onResume(); syncUi()
              }
              private fun closeTab(index: Int) {
