                          if (isDestroyed) return@runOnUiThread
                          if (html == null) showMessage("Dosya açılamadı (bozuk veya desteklenmeyen olabilir)")
                          else web.loadDataWithBaseURL("https://doc.local/", html, "text/html", "utf-8", null)
                      }
                  }.start()
