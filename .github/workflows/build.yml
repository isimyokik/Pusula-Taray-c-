                          PlaybackService.ACTION_PLAY -> MEDIA_FORCE_PLAY_JS
                          PlaybackService.ACTION_TOGGLE -> if (isInPictureInPictureMode) MEDIA_TOGGLE_FAST_JS else MEDIA_TOGGLE_JS
