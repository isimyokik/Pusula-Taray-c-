name: Pusula APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Projeyi olustur
        run: |
          rm -rf app build settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/pusula/browser app/src/main/res/drawable app/src/main/res/values
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Pusula"
          include(":app")
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pusula.browser"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.pusula.browser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "2.1"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:icon="@drawable/ic_launcher" android:label="@string/app_name" android:theme="@style/Theme.Pusula" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:supportsPictureInPicture="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/pusula/browser/MainActivity.kt <<'EOF'
          package com.pusula.browser

          import android.app.PictureInPictureParams
          import android.content.Context
          import android.os.Build
          import android.os.Bundle
          import android.util.Rational
          import android.view.ViewGroup
          import android.webkit.WebView
          import android.widget.FrameLayout
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              // PIP FIX: WebView durmasin diye blockPause
              class BgWebView(c: Context) : WebView(c) {
                  var blockPause = false
                  override fun onWindowVisibilityChanged(visibility: Int) {
                      if (visibility != View.GONE) super.onWindowVisibilityChanged(VISIBLE)
                  }
                  override fun onPause() {
                      if (blockPause) return
                      super.onPause()
                  }
              }

              private lateinit var web: BgWebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = BgWebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.loadUrl("https://www.youtube.com")
                  val frame = FrameLayout(this)
                  frame.addView(web, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  setContentView(frame)
                  addOnPictureInPictureModeChangedListener { info ->
                      if (info.isInPictureInPictureMode) {
                          web.blockPause = true
                          web.onResume()
                      } else {
                          web.blockPause = false
                      }
                  }
              }

              override fun onPause() {
                  super.onPause()
                  if (isInPictureInPictureMode) {
                      web.blockPause = true
                      web.onResume()
                      try { web.evaluateJavascript("try{document.querySelectorAll('video').forEach(v=>{if(v.paused)v.play()})}catch(e){}", null) } catch (_: Exception) {}
                      return
                  }
                  web.onPause()
              }

              override fun onStop() {
                  super.onStop()
                  if (isInPictureInPictureMode) {
                      web.blockPause = true
                      web.onResume()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  web.onResume()
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          web.blockPause = true
                          web.onResume()
                          val params = PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build()
                          enterPictureInPictureMode(params)
                      } catch (_: Exception) {}
                  }
              }
          }
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="96dp" android:height="96dp" android:viewportWidth="96" android:viewportHeight="96"><path android:fillColor="#FF4C8DFF" android:pathData="M0,0h96v96h-96z"/></vector>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Pusula</string></resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources><style name="Theme.Pusula" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:statusBarColor">@android:color/transparent</item></style></resources>
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="bg">#0F1115</color></resources>
          EOF
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: APK derle
        run: gradle assembleDebug --no-daemon
      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: Pusula-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
