name: Pusula APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Projeyi olustur
        run: |
          rm -rf app build settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/pusula/browser app/src/main/res/drawable app/src/main/res/values app/src/main/res/values-night
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Pusula"
          include(":app")
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.pusula.browser"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.pusula.browser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "2.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.media:media:1.7.0")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Pusula"
                  android:usesCleartextTraffic="true">

                  <service
                      android:name=".PlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize|stateHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/assets/newtab.html <<'EOF'
          <!doctype html>
          <html lang="tr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Yeni Sekme</title>
          <style>
            :root{--bg:#0b1020;--surface:#131b33;--field:#1d2848;--text:#eaf0ff;--sub:#8fa0c8;--acc:#4c8dff;--acc2:#8a5cff}
            *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
            html,body{margin:0}
            body{background:var(--bg);color:var(--text);font-family:Roboto,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
            .glow{position:fixed;inset:0;pointer-events:none;
              background:radial-gradient(420px 300px at 85% -40px,color-mix(in srgb,var(--acc) 38%,transparent),transparent 70%),
                         radial-gradient(380px 280px at -10% 18%,color-mix(in srgb,var(--acc2) 30%,transparent),transparent 70%)}
            main{position:relative;max-width:560px;margin:0 auto;padding:34px 18px 40px}
            .hello{color:var(--sub);font-size:14px;margin:0 0 2px}
            h1{font-size:40px;line-height:1.1;margin:0 0 22px;font-weight:800;letter-spacing:-.5px;
               background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
            form{display:flex;gap:8px;margin-bottom:26px}
            .sbox{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:54px;border-radius:27px;padding:0 18px;
                  background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid color-mix(in srgb,var(--text) 12%,transparent);
                  box-shadow:0 8px 24px rgba(0,0,0,.18)}
            .sbox:focus-within{border-color:var(--acc)}
            .sbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:16px;outline:none;height:100%}
            .sbox input::placeholder{color:var(--sub)}
            button.go{width:54px;height:54px;border-radius:50%;border:0;color:#fff;font-size:22px;
                      background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 45%,transparent)}
            h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--sub);margin:26px 4px 12px;font-weight:700}
            .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
            a.t{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-size:12px;min-width:0}
            a.t i{width:58px;height:58px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:27px;
                  box-shadow:0 8px 18px rgba(0,0,0,.25);color:#fff;font-weight:700}
            a.t span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
            .list{display:flex;flex-direction:column;gap:8px}
            a.row{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);padding:11px 14px;border-radius:16px;
                  background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid color-mix(in srgb,var(--text) 8%,transparent);min-width:0}
            a.row b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
            a.row small{display:block;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
            a.row .d{width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
            .priv{text-align:center;padding-top:60px}
            .priv .big{font-size:64px;margin-bottom:6px}
            .priv h1{margin-bottom:8px}
            .priv p{color:var(--sub);line-height:1.6;margin:0 auto 10px;max-width:30ch}
            [hidden]{display:none!important}
          </style>
          </head>
          <body>
          <div class="glow"></div>
          <main id="main">
            <div id="home">
              <p class="hello" id="hello"></p>
              <h1>Rota</h1>
              <form id="f"><div class="sbox"><span>🔎</span><input id="q" type="search" placeholder="Ara veya adres yaz" autocomplete="off" autocapitalize="off" enterkeyhint="go"></div><button class="go" type="submit" aria-label="Git">→</button></form>
              <h2>Hızlı erişim</h2>
              <div class="grid" id="pins"></div>
              <div id="bmWrap" hidden><h2>Yer imleri</h2><div class="grid" id="bms"></div></div>
              <div id="hsWrap" hidden><h2>Son ziyaretler</h2><div class="list" id="hs"></div></div>
            </div>
            <div class="priv" id="priv" hidden>
              <div class="big">🕶️</div>
              <h1>Gizli sekme</h1>
              <p>Bu sekmede gezdiğin sayfalar geçmişe kaydedilmez ve sekmeyi kapatınca silinir.</p>
              <p>İstersen aşağıdaki kutudan arama yapabilirsin.</p>
              <form id="pf" style="margin-top:18px"><div class="sbox"><span>🔎</span><input id="pq" type="search" placeholder="Gizlice ara" autocomplete="off"></div><button class="go" type="submit" aria-label="Git">→</button></form>
            </div>
          </main>
          <script>
          (function(){
            var cfg = {engine:"Google",search:"https://www.google.com/search?q=%s",bookmarks:[],history:[]};
            try { if (window.Pusula) { var c = JSON.parse(window.Pusula.config()); if (c && c.search) cfg = c; } } catch (e) {}
            var r = document.documentElement.style;
            if (cfg.bg) {
              r.setProperty("--bg",cfg.bg); r.setProperty("--surface",cfg.surface); r.setProperty("--field",cfg.field);
              r.setProperty("--text",cfg.text); r.setProperty("--sub",cfg.sub); r.setProperty("--acc",cfg.accent); r.setProperty("--acc2",cfg.accent2);
            }
            var isPrivate = /[?&]private=1/.test(location.search);
            if (isPrivate) {
              r.setProperty("--bg","#150d2b"); r.setProperty("--surface","#241447"); r.setProperty("--field","#34205f");
              r.setProperty("--text","#f3ecff"); r.setProperty("--sub","#b7a4e6"); r.setProperty("--acc","#a46bff"); r.setProperty("--acc2","#ff5cc8");
              document.getElementById("home").hidden = true; document.getElementById("priv").hidden = false;
            }
            var h = new Date().getHours();
            var greet = h < 5 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar";
            var day = ""; try { day = new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"}); } catch (e) {}
            document.getElementById("hello").textContent = greet + (day ? " · " + day : "");
            document.getElementById("q").placeholder = cfg.engine + " ile ara veya adres yaz";

            function go(text){
              text = (text || "").trim();
              if (!text) return;
              if (/^https?:\/\//i.test(text)) { location.href = text; return; }
              if (!/\s/.test(text) && /^([a-z0-9-]+\.)+[a-z]{2,}([:\/?#].*)?$/i.test(text)) { location.href = "https://" + text; return; }
              location.href = cfg.search.replace("%s", encodeURIComponent(text));
            }
            document.getElementById("f").addEventListener("submit", function(e){ e.preventDefault(); go(document.getElementById("q").value); });
            document.getElementById("pf").addEventListener("submit", function(e){ e.preventDefault(); go(document.getElementById("pq").value); });

            var pins = [
              ["YouTube","https://m.youtube.com/","▶","linear-gradient(135deg,#ff4b4b,#c4001d)"],
              ["Ara","https://www.google.com/","🔎","linear-gradient(135deg,#4c8dff,#2457d6)"],
              ["Müzik","https://music.youtube.com/","🎵","linear-gradient(135deg,#ff7a45,#ff2d6f)"],
              ["Haberler","https://news.google.com/?hl=tr","📰","linear-gradient(135deg,#34c3ff,#2477ff)"],
              ["Harita","https://maps.google.com/","🗺️","linear-gradient(135deg,#34d37a,#0f9d58)"],
              ["Çeviri","https://translate.google.com/","🌐","linear-gradient(135deg,#8a5cff,#4a35d9)"],
              ["Hava","https://www.google.com/search?q=hava+durumu","⛅","linear-gradient(135deg,#ffc84a,#ff8a1f)"],
              ["GitHub","https://github.com/","🐙","linear-gradient(135deg,#59616e,#1b1f24)"]
            ];
            function tile(label, url, icon, bg){
              var a = document.createElement("a"); a.className = "t"; a.href = url;
              var i = document.createElement("i"); i.style.background = bg; i.textContent = icon;
              var s = document.createElement("span"); s.textContent = label;
              a.appendChild(i); a.appendChild(s); return a;
            }
            var g = document.getElementById("pins");
            pins.forEach(function(p){ g.appendChild(tile(p[0],p[1],p[2],p[3])); });

            var grads = ["linear-gradient(135deg,#00b894,#00796b)","linear-gradient(135deg,#a55eea,#6c3fc8)","linear-gradient(135deg,#fd79a8,#d63384)","linear-gradient(135deg,#5f7cff,#3949ab)","linear-gradient(135deg,#ff9f43,#e17055)"];
            function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch (e) { return u; } }
            var bms = cfg.bookmarks || [];
            if (bms.length) {
              document.getElementById("bmWrap").hidden = false;
              var bg = document.getElementById("bms");
              bms.forEach(function(b,n){ var host = hostOf(b.u); bg.appendChild(tile((b.t && b.t.length < 14) ? b.t : host, b.u, host.charAt(0).toUpperCase(), grads[n % grads.length])); });
            }
            var hs = cfg.history || [];
            if (hs.length) {
              document.getElementById("hsWrap").hidden = false;
              var hl = document.getElementById("hs");
              hs.forEach(function(x,n){
                var a = document.createElement("a"); a.className = "row"; a.href = x.u;
                var d = document.createElement("span"); d.className = "d"; d.style.background = grads[n % grads.length]; d.textContent = hostOf(x.u).charAt(0).toUpperCase();
                var w = document.createElement("div"); w.style.minWidth = "0";
                var b = document.createElement("b"); b.textContent = x.t || hostOf(x.u);
                var s = document.createElement("small"); s.textContent = hostOf(x.u);
                w.appendChild(b); w.appendChild(s); a.appendChild(d); a.appendChild(w); hl.appendChild(a);
              });
            }
          })();
          </script>
          </body>
          </html>
          EOF
          cat > app/src/main/java/com/pusula/browser/MainActivity.kt <<'EOF'
          package com.pusula.browser

          import android.annotation.SuppressLint
          import android.app.Dialog
          import android.app.DownloadManager
          import android.graphics.Matrix
          import android.view.Window
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.res.ColorStateList
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.Message
          import android.text.Html
          import android.text.InputType
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.webkit.CookieManager
          import android.webkit.JsResult
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebStorage
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.ArrayAdapter
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageButton
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.PopupMenu
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.core.widget.doAfterTextChanged
          import androidx.appcompat.widget.SwitchCompat
          import androidx.webkit.ScriptHandler
          import androidx.webkit.WebViewAssetLoader
          import androidx.webkit.WebViewCompat
          import androidx.webkit.WebViewFeature
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayInputStream

          class MainActivity : AppCompatActivity() {

              private class BTab(val web: WebView, val bridge: PusulaBridge, val incognito: Boolean = false) {
                  var title: String = "Yeni Sekme"
                  var url: String = ""
                  var pendingUrl: String? = null
                  var desktop: Boolean = false
                  var mobileUa: String = ""
                  var progress: Int = 100
                  var preview: Bitmap? = null
                  var adScript: ScriptHandler? = null
                  var keepScript: ScriptHandler? = null
              }

              private class SheetItem(val icon: String, val label: String, val on: Boolean, val act: () -> Unit)

              /** Arka plana atılınca WebView'a "hâlâ görünüyorum" dedirtir; YouTube sesi kesilmez. */
              private class BgWebView(c: Context) : WebView(c) {
                  override fun onWindowVisibilityChanged(visibility: Int) {
                      if (visibility != View.GONE) super.onWindowVisibilityChanged(View.VISIBLE)
                  }
              }

              private val tabs = ArrayList<BTab>()
              private var cur = -1
              private var shown: WebView? = null

              private lateinit var prefs: Prefs
              private lateinit var loader: WebViewAssetLoader
              private val handler = Handler(Looper.getMainLooper())
              private var appInBackground = false

              private val mediaControlReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val act = intent?.action ?: return
                      val js = when (act) {
                          PlaybackService.ACTION_PLAY, PlaybackService.ACTION_TOGGLE -> MEDIA_TOGGLE_JS
                          PlaybackService.ACTION_PAUSE -> MEDIA_PAUSE_JS
                          PlaybackService.ACTION_PREVIOUS -> MEDIA_PREVIOUS_JS
                          PlaybackService.ACTION_NEXT -> MEDIA_NEXT_JS
                          else -> return
                      }
                      val targets = if (act == PlaybackService.ACTION_PAUSE) tabs.toList()
                                    else listOfNotNull(tabs.getOrNull(cur))
                      targets.forEach { t ->
                          try { t.web.evaluateJavascript(js, null) } catch (_: Exception) { }
                      }
                  }
              }

              private val backgroundMediaPump = object : Runnable {
                  override fun run() {
                      if (!appInBackground || !prefs.bgPlay) return
                      val t = tabs.getOrNull(cur)
                      try { t?.web?.evaluateJavascript(BACKGROUND_MEDIA_JS, null) } catch (_: Exception) { }
                      handler.postDelayed(this, 1200L)
                  }
              }

              private lateinit var root: LinearLayout
              private lateinit var content: FrameLayout
              private lateinit var fullscreen: FrameLayout
              private lateinit var urlField: EditText
              private lateinit var progress: ProgressBar
              private lateinit var backBtn: ImageButton
              private lateinit var fwdBtn: ImageButton
              private lateinit var tabCount: TextView
              private lateinit var privateBadge: TextView
              private lateinit var findBar: LinearLayout
              private lateinit var findInput: EditText
              private lateinit var findCount: TextView

              private var dark = false
              private var cBg = 0
              private var cSurface = 0
              private var cField = 0
              private var cText = 0
              private var cSub = 0
              private var cIcon = 0
              private var cAccent = 0
              private var cAccent2 = 0
              private lateinit var topBar: LinearLayout

              private var customView: View? = null
              private var customCb: WebChromeClient.CustomViewCallback? = null
              private var fileCb: ValueCallback<Array<Uri>>? = null
              private var startUrl: String? = null

              private val fileLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                      fileCb?.onReceiveValue(
                          WebChromeClient.FileChooserParams.parseResult(res.resultCode, res.data)
                      )
                      fileCb = null
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = Prefs(this)
                  loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  loadPalette()

                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  buildUi()
                  val bars = WindowInsetsControllerCompat(window, window.decorView)
                  bars.isAppearanceLightStatusBars = !dark
                  bars.isAppearanceLightNavigationBars = !dark

                  startUrl = intent?.dataString

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() { handleBack() }
                  })

                  val mediaFilter = IntentFilter().apply {
                      addAction(PlaybackService.ACTION_PLAY)
                      addAction(PlaybackService.ACTION_TOGGLE)
                      addAction(PlaybackService.ACTION_PAUSE)
                      addAction(PlaybackService.ACTION_PREVIOUS)
                      addAction(PlaybackService.ACTION_NEXT)
                  }
                  ContextCompat.registerReceiver(this, mediaControlReceiver, mediaFilter, ContextCompat.RECEIVER_NOT_EXPORTED)
                  startBrowsing()
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  val u = intent.dataString ?: return
                  openTab(u)
              }

              override fun onPause() {
                  super.onPause()
                  saveTabs()
                  CookieManager.getInstance().flush()
                  if (prefs.bgPlay) {
                      appInBackground = true
                      handler.removeCallbacks(backgroundMediaPump)
                      handler.post(backgroundMediaPump)
                      try {
                          ContextCompat.startForegroundService(this, Intent(this, PlaybackService::class.java))
                      } catch (_: Exception) { }
                  } else {
                      appInBackground = true
                      shown?.onPause()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  appInBackground = false
                  handler.removeCallbacks(backgroundMediaPump)
                  stopService(Intent(this, PlaybackService::class.java))
                  shown?.onResume()
              }

              override fun onDestroy() {
                  try { unregisterReceiver(mediaControlReceiver) } catch (_: Exception) { }
                  handler.removeCallbacks(backgroundMediaPump)
                  for (t in tabs) { try { t.web.destroy() } catch (_: Exception) { } }
                  super.onDestroy()
              }

              private fun loadPalette() {
                  val pal = Themes.get(prefs.theme)
                  dark = pal.dark
                  cBg = pal.bg; cSurface = pal.surface; cField = pal.field
                  cText = pal.text; cSub = pal.sub; cIcon = pal.icon
                  cAccent = pal.accent; cAccent2 = pal.accent2
                  window.setBackgroundDrawable(ColorDrawable(cBg))
              }

              /** Temayı uygulamadan çıkmadan, sekmeleri koruyarak uygular. */
              private fun applyTheme() {
                  if (customView != null) hideCustom()
                  val web = shown
                  if (web != null) content.removeView(web)
                  loadPalette()
                  buildUi()
                  if (web != null) {
                      content.addView(web, 0, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  }
                  val bars = WindowInsetsControllerCompat(window, window.decorView)
                  bars.isAppearanceLightStatusBars = !dark
                  bars.isAppearanceLightNavigationBars = !dark
                  val t = tabs.getOrNull(cur)
                  if (t != null) {
                      privateBadge.visibility = if (t.incognito) View.VISIBLE else View.GONE
                      topBar.setBackgroundColor(if (t.incognito) 0xFF1B0F38.toInt() else cBg)
                      if (t.url.startsWith(ASSET_PREFIX)) t.web.reload()
                  }
                  syncUi()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density + 0.5f).toInt()
              private fun shape(color: Int, radiusDp: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(radiusDp).toFloat()
                  return g
              }
              private fun ripple(content: Drawable?): RippleDrawable =
                  RippleDrawable(ColorStateList.valueOf(0x33888888), content, ColorDrawable(Color.WHITE))

              private fun iconBtn(res: Int, desc: String, onClick: (View) -> Unit): ImageButton {
                  val b = ImageButton(this)
                  b.setImageResource(res)
                  b.setColorFilter(cIcon)
                  b.background = ripple(null)
                  b.contentDescription = desc
                  b.scaleType = ImageView.ScaleType.CENTER
                  b.setOnClickListener { v -> onClick(v) }
                  return b
              }

              private fun textBtn(label: String, onClick: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.textSize = 16f
                  t.setTextColor(cIcon)
                  t.gravity = Gravity.CENTER
                  t.background = ripple(null)
                  t.setOnClickListener { onClick() }
                  return t
              }

