                  web.setFindListener { active, total, _ -> if (tabs.getOrNull(cur) === tab) { findCount.text = if (total == 0) "0" else "${active + 1}/$total" } }
                  web.setDownloadListener { url, userAgent, contentDisposition, mimeType, _ -> startDownload(url, userAgent, contentDisposition, mimeType) }
                  web.webViewClient = makeClient(tab); web.webChromeClient = makeChrome(tab); tabs.add(tab); updateTabCount(); return tab
              }
              private fun syncScripts(t: BTab) {
                  if (!WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) return
                  try {
                      if (t.hookScript == null) t.hookScript = WebViewCompat.addDocumentStartJavaScript(t.web, MEDIA_HOOK_JS, setOf("*"))
                      if (prefs.adBlock && t.adScript == null) t.adScript = WebViewCompat.addDocumentStartJavaScript(t.web, STABLE_AD_BLOCKER_JS, setOf("*")) else if (!prefs.adBlock && t.adScript != null) { t.adScript?.remove(); t.adScript = null }
                      if (prefs.bgPlay && t.keepScript == null) t.keepScript = WebViewCompat.addDocumentStartJavaScript(t.web, KEEP_PLAYING_JS, setOf("*")) else if (!prefs.bgPlay && t.keepScript != null) { t.keepScript?.remove(); t.keepScript = null }
                  } catch (_: Exception) { }
              }
              private fun settingsChanged() { for (t in tabs) syncScripts(t); val c = tabs.getOrNull(cur) ?: return; if (c.url.startsWith("http")) c.web.reload() }
              private fun openTab(url: String?, load: Boolean = true, incognito: Boolean = false): BTab? { if (tabs.size >= MAX_TABS) { toast("En fazla $MAX_TABS sekme"); return null }; val t = createTab(incognito); switchTo(tabs.size - 1); if (load) t.web.loadUrl(url ?: (if (incognito) NEWTAB_URL + "?private=1" else NEWTAB_URL)); return t }
              private fun switchTo(i: Int) {
                  if (i !in tabs.indices) return
                  shown?.let { tabs.getOrNull(cur)?.let { oldTab -> capturePreview(oldTab) }; content.removeView(it) }
                  for (idx in tabs.indices) { if (idx != i) { try { tabs[idx].web.evaluateJavascript(MEDIA_PAUSE_JS, null) } catch (_: Exception) {} } }
                  cur = i; val t = tabs[i]; shown = t.web; content.addView(t.web, 0, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)); t.web.onResume()
