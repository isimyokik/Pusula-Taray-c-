              private fun setBarShown(show: Boolean) {
                  // Ana ekran kısayolundan açılan sekmede çubuk hiç görünmez (uygulama gibi tam ekran)
                  val hide = !show || tabs.getOrNull(cur)?.appMode == true
                  if (barHidden == hide) return
                  barHidden = hide
