              private fun shownUrl(u: String): String = if (u.isEmpty() || u.startsWith(ASSET_PREFIX)) "" else u.removePrefix("https://").removePrefix("http://").removePrefix("www.").trimEnd('/')
              private fun syncUrlText() { val t = tabs.getOrNull(cur); urlField.setText(if (t == null) "" else shownUrl(t.pendingUrl ?: t.url)) }
              private fun syncUi() { val t = tabs.getOrNull(cur) ?: return; if (!urlField.hasFocus()) syncUrlText(); setLoadProgress(t.progress); refreshNav(); updateTabCount() }
              private fun setLoadProgress(p: Int) { progress.progress = p; progress.visibility = if (p in 1..99) View.VISIBLE else View.INVISIBLE }
              private fun refreshNav() { val web = currentWeb(); backBtn.alpha = if (web != null && (web.canGoBack() || tabs.size > 1)) 1f else 0.35f; fwdBtn.alpha = if (web != null && web.canGoForward()) 1f else 0.35f }
