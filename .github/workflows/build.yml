          package com.pusula.browser
          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          class Prefs(ctx: Context) {
              private val sp = ctx.getSharedPreferences("pusula_v40", Context.MODE_PRIVATE)
              data class Entry(val title: String, val url: String)
              var theme: String get() = sp.getString("theme","midnight")!!; set(v){ sp.edit().putString("theme",v).apply() }
              var engine: String get() = sp.getString("engine","google")!!; set(v){ sp.edit().putString("engine",v).apply() }
              var adBlock: Boolean get() = sp.getBoolean("adBlock",true); set(v){ sp.edit().putBoolean("adBlock",v).apply() }
              var bgPlay: Boolean get() = sp.getBoolean("bgPlay",true); set(v){ sp.edit().putBoolean("bgPlay",v).apply() }
              var barBottom: Boolean get() = sp.getBoolean("barBottom",false); set(v){ sp.edit().putBoolean("barBottom",v).apply() }
              var askedNotif: Boolean get() = sp.getBoolean("askedNotif",false); set(v){ sp.edit().putBoolean("askedNotif",v).apply() }
              fun bookmarks(): List<Entry> = load("bms")
              fun history(): List<Entry> = load("hist")
              fun addHistory(t: String, u: String){ val l = load("hist").toMutableList(); l.removeAll{ it.url==u }; l.add(0,Entry(t,u)); save("hist",l.take(200)) }
              fun removeHistory(u: String){ val l = load("hist").toMutableList(); l.removeAll{ it.url==u }; save("hist",l) }
              fun clearHistory(){ save("hist",emptyList()) }
              fun isBookmarked(u: String): Boolean = load("bms").any{ it.url==u }
              fun toggleBookmark(t: String, u: String){ val l = load("bms").toMutableList(); val e = l.firstOrNull{ it.url==u }; if(e!=null) l.remove(e) else l.add(0,Entry(t,u)); save("bms",l.take(200)) }
              fun removeBookmark(u: String){ val l = load("bms").toMutableList(); l.removeAll{ it.url==u }; save("bms",l) }
              fun savedTabs(): List<String> = sp.getString("tabs","")!!.split("|").filter{ it.isNotEmpty() }
              fun savedCurrent(): Int = sp.getInt("curTab",0)
              fun saveTabs(urls: List<String>, cur: Int){ sp.edit().putString("tabs",urls.joinToString("|")).putInt("curTab",cur).apply() }
              private fun load(k: String): List<Entry>{ try{ val s = sp.getString(k,"[]")!!; val a = JSONArray(s); return (0 until a.length()).map{ val o = a.getJSONObject(it); Entry(o.getString("t"),o.getString("u")) } }catch(_: Exception){ return emptyList() } }
              private fun save(k: String, list: List<Entry>){ val a = JSONArray(); for(e in list){ val o = JSONObject(); o.put("t",e.title); o.put("u",e.url); a.put(o) }; sp.edit().putString(k,a.toString()).apply() }
          }
