name: Build Pusula APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip project
        run: |
          if [ -f Pusula_Tek_Parca.zip ]; then unzip -o Pusula_Tek_Parca.zip; rm Pusula_Tek_Parca.zip; fi
          if [ -f Pusula_FINAL_DUZGUN.zip ]; then unzip -o Pusula_FINAL_DUZGUN.zip; rm Pusula_FINAL_DUZGUN.zip; fi
          ls -R
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pusula-APK
          path: app/build/outputs/apk/debug/*.apk
