name: Pusula APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Proje Yapisini Olustur
        run: |
          rm -rf app build settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/assets app/src/main/java/com/pusula/browser app/src/main/res/drawable app/src/main/res/values

      - name: Root Gradle Dosyalarini Yaz
        run: |
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Pusula"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

      - name: App Module Gradle ve Manifest Yaz
        run: |
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pusula.browser"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.pusula.browser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "2.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.media:media:1.7.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Pusula"
                  android:usesCleartextTraffic="true">
                  <service
                      android:name=".PlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:windowSoftInputMode="adjustResize|stateHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Kaynak ve Kotlin Kodlarini Olustur
        run: |
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Rota</string></resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources><color name="bg">#0F1115</color></resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Pusula" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="96dp" android:height="96dp" android:viewportWidth="96" android:viewportHeight="96"><path android:fillColor="#FF2F6BFF" android:pathData="M24,0H72A24,24 0 0,1 96,24V72A24,24 0 0,1 72,96H24A24,24 0 0,1 0,72V24A24,24 0 0,1 24,0Z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_back.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_forward.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M12,4l-1.41,1.41L16.17,11H4v2h12.17l-5.58,5.59L12,20l8,-8z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_home.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M10,20v-6h4v6h5v-8h3L12,3 2,12h3v8z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_add.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M19,13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_menu.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,10c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zM12,16c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_reload.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -7.99,8s3.57,8 7.99,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_notif.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_pip_prev.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#FFFFFFFF" android:pathData="M12,12h6v24h-6zM36,12 L18,24 36,36z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_pip_next.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#FFFFFFFF" android:pathData="M30,12h6v24h-6zM12,12 L30,24 12,36z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_pip_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#FFFFFFFF" android:pathData="M14,10 L14,38 L40,24z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_pip_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#FFFFFFFF" android:pathData="M12,10h8v28h-8zM28,10h8v28h-8z"/></vector>
          EOF

      - name: HTML ve Kotlin Kodlarini Olustur
        run: |
          cat << 'EOF' > app/src/main/assets/newtab.html
          <!doctype html>
          <html lang="tr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Yeni Sekme</title>
          <style>
            body{background:#0b1020;color:#eaf0ff;font-family:sans-serif;padding:20px;text-align:center}
            h1{color:#4c8dff}
          </style>
          </head>
          <body>
            <h1>Rota Browser</h1>
            <p>Aramak istediginiz adresi yazin.</p>
          </body>
          </html>
          EOF

          cat << 'EOF' > app/src/main/java/com/pusula/browser/Themes.kt
          package com.pusula.browser

          class Palette(val id: String, val name: String, val dark: Boolean, val bg: Int, val surface: Int, val field: Int, val text: Int, val sub: Int, val icon: Int, val accent: Int, val accent2: Int)

          object Themes {
              private fun c(v: Long): Int = v.toInt()
              val all: List<Palette> = listOf(
                  Palette("gece", "Gece Mavisi", true, c(0xFF0B1020), c(0xFF131B33), c(0xFF1D2848), c(0xFFEAF0FF), c(0xFF8FA0C8), c(0xFFC9D6FF), c(0xFF4C8DFF), c(0xFF8A5CFF))
              )
              fun get(id: String): Palette = all[0]
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/pusula/browser/Prefs.kt
          package com.pusula.browser

          import android.content.Context

          class Prefs(context: Context) {
              class Entry(val title: String, val url: String)
              private val sp = context.getSharedPreferences("pusula", Context.MODE_PRIVATE)
              var engine: String get() = "google"; set(_) {}
              var bgPlay: Boolean get() = true; set(_) {}
              var theme: String get() = "gece"; set(_) {}
              var barBottom: Boolean get() = false; set(_) {}
              var adBlock: Boolean get() = true; set(_) {}
              var startMode: String get() = "resume"; set(_) {}
              var clearOnExit: Boolean get() = false; set(_) {}
              fun savedTabs(): List<String> = emptyList()
              fun savedCurrent(): Int = 0
              fun saveTabs(u: List<String>, c: Int) {}
              fun addHistory(t: String, u: String) {}
              fun clearHistory() {}
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/pusula/browser/PusulaBridge.kt
          package com.pusula.browser

          import android.webkit.JavascriptInterface

          class PusulaBridge(private val prefs: Prefs) {
              @JavascriptInterface
              fun config(): String = "{}"
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/pusula/browser/PlaybackService.kt
          package com.pusula.browser

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.os.IBinder

          class PlaybackService : Service() {
              override fun onBind(intent: Intent?): IBinder? = null
              companion object {
                  fun update(ctx: Context, playing: Boolean, title: String, artist: String) {}
                  fun stop(ctx: Context) {}
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/pusula/browser/MainActivity.kt
          package com.pusula.browser

          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.webViewClient = WebViewClient()
                  setContentView(webView)
                  webView.loadUrl("https://www.google.com")
              }
          }
          EOF

      - name: Gradle 8.9 Kur
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: APK Derle
        run: gradle assembleDebug --no-daemon

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Pusula-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
