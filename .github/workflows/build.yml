              private val mediaStatePoll = object : Runnable {
                  override fun run() {
                      pollMedia()
                      handler.postDelayed(this, 1500L)
                  }
              }

              private fun pollMedia() {
                  val t = tabs.getOrNull(cur) ?: return
                  try { t.web.evaluateJavascript(MEDIA_STATE_JS) { raw -> onMediaState(raw) } } catch (_: Exception) { }
              }

              private fun onMediaState(raw: String?) {
                  var has = false
                  var playing = false
                  var title = ""
                  var artist = ""
                  try {
                      if (raw != null && raw != "null" && raw != "\"\"") {
                          val inner = JSONArray("[" + raw + "]").getString(0)
                          if (inner.isNotEmpty()) {
                              val o = JSONObject(inner)
                              has = true
                              playing = o.optBoolean("p")
                              title = o.optString("t")
                              artist = o.optString("a")
                          }
                      }
                  } catch (_: Exception) { return }
                  if (!has) {
                      if (hasMedia) { hasMedia = false; lastPlaying = false; PlaybackService.stop(this) }
                      return
                  }
                  val changed = !hasMedia || playing != lastPlaying || title != lastTitle || artist != lastArtist
                  hasMedia = true; lastPlaying = playing; lastTitle = title; lastArtist = artist
                  if (changed && (playing || PlaybackService.running)) PlaybackService.update(this, playing, title, artist)
              }

              private fun pipAction(code: Int, icon: Int, label: String, action: String): android.app.RemoteAction {
                  val pi = PendingIntent.getBroadcast(
                      this, code,
                      Intent(action).setPackage(packageName),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return android.app.RemoteAction(android.graphics.drawable.Icon.createWithResource(this, icon), label, label, pi)
              }

              private val pipMediaPump = object : Runnable {
                  override fun run() {
                      if (!isInPictureInPictureMode) return
                      try { shown?.onResume() } catch (_: Exception) { }
                      try { currentWeb()?.evaluateJavascript(KEEP_MEDIA_PLAYING_JS, null) } catch (_: Exception) { }
                      handler.postDelayed(this, 800L)
                  }
              }

              private fun enterPip() {
                  if (Build.VERSION.SDK_INT < 26) { toast("Bu Android sürümü küçük pencereyi desteklemiyor"); return }
                  try {
                      try { shown?.onResume() } catch (_: Exception) { }
                      try { currentWeb()?.evaluateJavascript(KEEP_MEDIA_PLAYING_JS, null) } catch (_: Exception) { }
                      val b = android.app.PictureInPictureParams.Builder()
                          .setAspectRatio(android.util.Rational(16, 9))
                      if (Build.VERSION.SDK_INT >= 26) {
                          val acts = ArrayList<android.app.RemoteAction>()
                          acts.add(pipAction(11, R.drawable.ic_pip_prev, "Önceki", PlaybackService.ACTION_PREVIOUS))
                          acts.add(pipAction(12, R.drawable.ic_pip_play, "Oynat/Duraklat", PlaybackService.ACTION_TOGGLE))
                          acts.add(pipAction(13, R.drawable.ic_pip_next, "Sonraki", PlaybackService.ACTION_NEXT))
                          b.setActions(acts)
                      }
                      enterPictureInPictureMode(b.build())
                  } catch (_: Exception) { toast("Küçük pencere açılamadı") }
              }

              private fun onPipChanged(pip: Boolean) {
                  topBar.visibility = if (pip) View.GONE else View.VISIBLE
                  dockBar.visibility = if (pip) View.GONE else View.VISIBLE
                  handler.removeCallbacks(pipMediaPump)
                  if (pip) {
                      closeFind()
                      appInBackground = false
                      try { shown?.onResume() } catch (_: Exception) { }
                      try { currentWeb()?.evaluateJavascript(KEEP_MEDIA_PLAYING_JS, null) } catch (_: Exception) { }
                      if (customView == null) {
                          try { currentWeb()?.evaluateJavascript(PIP_ON_JS, null) } catch (_: Exception) { }
                      }
                      if (hasMedia) PlaybackService.update(this, true, lastTitle, lastArtist)
                      handler.post(pipMediaPump)
                      handler.postDelayed({
                          try { currentWeb()?.evaluateJavascript(KEEP_MEDIA_PLAYING_JS, null) } catch (_: Exception) { }
                          try { currentWeb()?.evaluateJavascript(PIP_ON_JS, null) } catch (_: Exception) { }
                      }, 300)
                      handler.postDelayed({
                          try { currentWeb()?.evaluateJavascript(KEEP_MEDIA_PLAYING_JS, null) } catch (_: Exception) { }
                      }, 1000)
                  } else {
                      for (t in tabs) { try { t.web.evaluateJavascript(PIP_OFF_JS, null) } catch (_: Exception) { } }
                  }
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= 26 && (customView != null || hasMedia)) enterPip()
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (isInPictureInPictureMode) return
                  val land = newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE
                  try {
                      if (land) currentWeb()?.evaluateJavascript(LANDSCAPE_VIDEO_JS, null)
                      else currentWeb()?.evaluateJavascript(PORTRAIT_VIDEO_JS, null)
                  } catch (_: Exception) { }
              }

              private val mediaControlReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val act = intent?.action ?: return
                      val js = when (act) {
                          PlaybackService.ACTION_PLAY, PlaybackService.ACTION_TOGGLE -> MEDIA_TOGGLE_JS
                          PlaybackService.ACTION_PAUSE -> MEDIA_PAUSE_JS
                          PlaybackService.ACTION_PREVIOUS -> MEDIA_PREVIOUS_JS
                          PlaybackService.ACTION_NEXT -> MEDIA_NEXT_JS
                          else -> return
                      }
                      val targets = if (act == PlaybackService.ACTION_PAUSE) tabs.toList()
                                    else listOfNotNull(tabs.getOrNull(cur))
                      targets.forEach { t ->
                          try { t.web.evaluateJavascript(js, null) } catch (_: Exception) { }
                      }
                  }
              }

              private val backgroundMediaPump = object : Runnable {
                  override fun run() {
                      if (!appInBackground || !prefs.bgPlay) return
                      val t = tabs.getOrNull(cur)
                      try { t?.web?.evaluateJavascript(BACKGROUND_MEDIA_JS, null) } catch (_: Exception) { }
                      handler.postDelayed(this, 1200L)
                  }
              }

