    private fun capturePreview(tab: BTab) { try { val w = tab.web.width; val h = tab.web.height; if (w <= 0 || h <= 0) return; val sc = 360f / w; val bh = (h * sc).toInt().coerceIn(1,700); val bmp = Bitmap.createBitmap(360,bh,Bitmap.Config.RGB_565); val canvas = Canvas(bmp); canvas.scale(sc,sc); tab.web.draw(canvas); tab.preview = bmp } catch (_: Exception) {} }
