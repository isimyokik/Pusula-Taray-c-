    }
    private fun isDefaultBrowser(): Boolean { return try { if (Build.VERSION.SDK_INT >= 29) { val rm = getSystemService(android.app.role.RoleManager::class.java); rm != null && rm.isRoleHeld(android.app.role.RoleManager.ROLE_BROWSER) } else { val i = Intent(Intent.ACTION_VIEW, Uri.parse("http://www.example.com")); val ri = packageManager.resolveActivity(i, android.content.pm.PackageManager.MATCH_DEFAULT_ONLY); ri?.activityInfo?.packageName == packageName } } catch (_: Exception) { false } }
    private fun openDefaultAppsSettings() { try { startActivity(Intent(android.provider.Settings.ACTION_MANAGE_DEFAULT_APPS_SETTINGS)); toast("Tarayici uygulamasini sec, sonra Rota'yi isaretle") } catch (_: Exception) { try { startActivity(Intent(android.provider.Settings.ACTION_SETTINGS)) } catch (_: Exception) { toast("Ayarlar acilamadi") } } }
    private fun afterRole() { if (isDefaultBrowser()) toast("Rota artik varsayilan") else openDefaultAppsSettings() }
    private fun askDefaultBrowser() { if (isDefaultBrowser()) { toast("Rota zaten varsayilan"); return }; if (Build.VERSION.SDK_INT >= 29) { try { val rm = getSystemService(android.app.role.RoleManager::class.java); if (rm != null && rm.isRoleAvailable(android.app.role.RoleManager.ROLE_BROWSER)) { roleLauncher.launch(rm.createRequestRoleIntent(android.app.role.RoleManager.ROLE_BROWSER)); return } } catch (_: Exception) { } }; openDefaultAppsSettings() }
