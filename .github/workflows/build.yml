          # Diğer temel Kotlin sınıfları (Prefs, Themes, PusulaBridge, PlaybackService)
          cat > app/src/main/java/com/pusula/browser/Prefs.kt <<'EOF'
          package com.pusula.browser
          import android.content.Context
          import android.content.SharedPreferences
          class Prefs(ctx: Context) {
              private val sp = ctx.getSharedPreferences("pusula_prefs", Context.MODE_PRIVATE)
              var theme: String
                  get() = sp.getString("theme","default") ?: "default"
                  set(v) = sp.edit().putString("theme",v).apply()
              var bgPlay: Boolean
                  get() = sp.getBoolean("bg_play",true)
                  set(v) = sp.edit().putBoolean("bg_play",v).apply()
              var barBottom: Boolean
                  get() = sp.getBoolean("bar_bottom",false)
                  set(v) = sp.edit().putBoolean("bar_bottom",v).apply()
              var askedNotif: Boolean
                  get() = sp.getBoolean("asked_notif",false)
                  set(v) = sp.edit().putBoolean("asked_notif",v).apply()
              var clearOnExit: Boolean
                  get() = sp.getBoolean("clear_exit",false)
                  set(v) = sp.edit().putBoolean("clear_exit",v).apply()
              var adBlock: Boolean
                  get() = sp.getBoolean("adblock",true)
                  set(v) = sp.edit().putBoolean("adblock",v).apply()
              var startMode: String
                  get() = sp.getString("start_mode","last") ?: "last"
                  set(v) = sp.edit().putString("start_mode",v).apply()
              var engine: String
                  get() = sp.getString("engine","google") ?: "google"
                  set(v) = sp.edit().putString("engine",v).apply()
              fun saveTabs(urls:List<String>,current:Int)=sp.edit().putStringSet("tabs",urls.toSet()).putInt("cur_tab",current).apply()
              fun savedTabs():List<String> = sp.getStringSet("tabs",emptySet())?.toList() ?: emptyList()
              fun savedCurrent():Int = sp.getInt("cur_tab",0)
              fun clearHistory()=sp.edit().remove("history").apply()
              fun addHistory(title:String,url:String){}
          }
