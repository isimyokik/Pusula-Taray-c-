name: Pusula APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Projeyi olustur
        run: |
          rm -rf app build settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/pusula/player app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values
          
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "Pusula"
          include(":app")
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.pusula.player"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.pusula.player"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 30
                  versionName = "3.0-VIP"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              
              // AndroidX Media3 (ExoPlayer) VIP Oynatıcı Paketi
              implementation("androidx.media3:media3-exoplayer:1.5.0")
              implementation("androidx.media3:media3-ui:1.5.0")
              implementation("androidx.media3:media3-session:1.5.0")
              
              // Ağ ve JSON Bağlantı Kütüphaneleri
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.json:json:20240303")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Pusula VIP"
                  android:theme="@style/Theme.Pusula"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|uiMode"
                      android:supportsPictureInPicture="true"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F1115">

              <LinearLayout
                  android:id="@+id/searchContainer"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="12dp">

                  <EditText
                      android:id="@+id/searchEditText"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="@drawable/bg_search_input"
                      android:hint="Video ara veya YouTube linki yapıştır..."
                      android:textColorHint="#8A8D93"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp"
                      android:inputType="textUri"
                      android:imeOptions="actionSearch"/>

                  <ImageButton
                      android:id="@+id/searchBtn"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:layout_marginStart="8dp"
                      android:background="@drawable/bg_button_accent"
                      android:src="@android:drawable/ic_menu_search"
                      app:tint="#FFFFFF" />
              </LinearLayout>

              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="240dp"
                  android:layout_below="@id/searchContainer"
                  android:background="#000000"
                  app:resize_mode="fit"
                  app:use_controller="true"
                  app:show_buffering="always" />

              <ProgressBar
                  android:id="@+id/loadingSpinner"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:visibility="gone" />

              <TextView
                  android:id="@+id/videoTitleTxt"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_below="@id/playerView"
                  android:padding="16dp"
                  android:text="Pusula VIP Oynatıcıya Hoş Geldiniz"
                  android:textColor="#FFFFFF"
                  android:textSize="16sp"
                  android:textStyle="bold" />

          </RelativeLayout>
          EOF

          cat > app/src/main/res/drawable/bg_search_input.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1A1D24" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="#2E323D" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/bg_button_accent.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#2F6BFF" />
              <corners android:radius="24dp" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path android:fillColor="#1457E8" android:pathData="M20,0 H76 A20,20 0 0 1 96,20 V76 A20,20 0 0 1 76,96 H20 A20,20 0 0 1 0,76 V20 A20,20 0 0 1 20,0 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M38,28 L68,48 L38,68 Z"/>
          </vector>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Pusula" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0F1115</item>
                  <item name="android:navigationBarColor">#0F1115</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/pusula/player/MainActivity.kt <<'EOF'
          package com.pusula.player

          import android.app.PictureInPictureParams
          import android.content.res.Configuration
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Rational
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import com.pusula.player.databinding.ActivityMainBinding
          import okhttp3.Call
          import okhttp3.Callback
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.Response
          import org.json.JSONObject
          import java.io.IOException
          import java.util.regex.Pattern

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private var player: ExoPlayer? = null
              private val httpClient = OkHttpClient()
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  initPlayer()

                  binding.searchBtn.setOnClickListener {
                      val query = binding.searchEditText.text.toString().trim()
                      if (query.isNotEmpty()) processQuery(query)
                  }

                  binding.searchEditText.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEARCH) {
                          val query = binding.searchEditText.text.toString().trim()
                          if (query.isNotEmpty()) processQuery(query)
                          true
                      } else false
                  }
              }

              private fun initPlayer() {
                  player = ExoPlayer.Builder(this).build().apply {
                      addListener(object : Player.Listener {
                          override fun onPlayerError(error: PlaybackException) {
                              showToast("Oynatma hatası: Akış yüklenemedi.")
                              binding.loadingSpinner.visibility = View.GONE
                          }

                          override fun onPlaybackStateChanged(playbackState: Int) {
                              if (playbackState == Player.STATE_READY) {
                                  binding.loadingSpinner.visibility = View.GONE
                              }
                          }
                      })
                  }
                  binding.playerView.player = player
              }

              private fun processQuery(input: String) {
                  binding.loadingSpinner.visibility = View.VISIBLE
                  val videoId = extractVideoId(input)
                  if (videoId != null) {
                      fetchDirectStreamUrl(videoId)
                  } else {
                      searchVideoOnInvidious(input)
                  }
              }

              private fun extractVideoId(url: String): String? {
                  val pattern = "(?<=watch\\?v=|/videos/|embed/|youtu.be/|/v/|/e/|watch\\?v%3D|watch\\?feature=player_embedded&v=|%2Fvideos%2F|embed%2F|youtu.be%2F|%2Fv%2F)[^#&?]*"
                  val compiledPattern = Pattern.compile(pattern)
                  val matcher = compiledPattern.matcher(url)
                  return if (matcher.find()) matcher.group() else if (url.length == 11 && !url.contains(" ")) url else null
              }

              private fun fetchDirectStreamUrl(videoId: String) {
                  // Reklamsız açık kaynak API resolver (Invidious Instance)
                  val apiUrl = "https://invidious.nerdvpn.de/api/v1/videos/$videoId"
                  val request = Request.Builder().url(apiUrl).build()

                  httpClient.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          mainHandler.post {
                              binding.loadingSpinner.visibility = View.GONE
                              showToast("Sunucuya bağlanılamadı. Tekrar deneyin.")
                          }
                      }

                      override fun onResponse(call: Call, response: Response) {
                          val jsonStr = response.body?.string()
                          if (response.isSuccessful && !jsonStr.isNullOrEmpty()) {
                              try {
                                  val json = JSONObject(jsonStr)
                                  val title = json.optString("title", "Video")
                                  val formatArray = json.optJSONArray("formatStreams")
                                  
                                  var directUrl: String? = null
                                  if (formatArray != null && formatArray.length() > 0) {
                                      directUrl = formatArray.getJSONObject(formatArray.length() - 1).optString("url")
                                  }

                                  mainHandler.post {
                                      if (!directUrl.isNullOrEmpty()) {
                                          binding.videoTitleTxt.text = title
                                          playMedia(directUrl)
                                      } else {
                                          binding.loadingSpinner.visibility = View.GONE
                                          showToast("Video akış adresi çözülemedi.")
                                      }
                                  }
                              } catch (e: Exception) {
                                  mainHandler.post {
                                      binding.loadingSpinner.visibility = View.GONE
                                      showToast("Veri işleme hatası.")
                                  }
                              }
                          } else {
                              mainHandler.post {
                                  binding.loadingSpinner.visibility = View.GONE
                                  showToast("Video verisi çekilemedi.")
                              }
                          }
                      }
                  })
              }

              private fun searchVideoOnInvidious(query: String) {
                  val searchUrl = "https://invidious.nerdvpn.de/api/v1/search?q=${Uri.encode(query)}&type=video"
                  val request = Request.Builder().url(searchUrl).build()

                  httpClient.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          mainHandler.post {
                              binding.loadingSpinner.visibility = View.GONE
                              showToast("Arama başarısız oldu.")
                          }
                      }

                      override fun onResponse(call: Call, response: Response) {
                          val jsonStr = response.body?.string()
                          if (response.isSuccessful && !jsonStr.isNullOrEmpty()) {
                              try {
                                  val array = org.json.JSONArray(jsonStr)
                                  if (array.length() > 0) {
                                      val firstVideo = array.getJSONObject(0)
                                      val videoId = firstVideo.optString("videoId")
                                      mainHandler.post { fetchDirectStreamUrl(videoId) }
                                  } else {
                                      mainHandler.post {
                                          binding.loadingSpinner.visibility = View.GONE
                                          showToast("Sonuç bulunamadı.")
                                      }
                                  }
                              } catch (e: Exception) {
                                  mainHandler.post {
                                      binding.loadingSpinner.visibility = View.GONE
                                      showToast("Arama yanıtı işlenemedi.")
                                  }
                              }
                          }
                      }
                  })
              }

              private fun playMedia(streamUrl: String) {
                  val mediaItem = MediaItem.fromUri(Uri.parse(streamUrl))
                  player?.setMediaItem(mediaItem)
                  player?.prepare()
                  player?.play()
              }

              private fun showToast(msg: String) {
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && player?.isPlaying == true) {
                      val params = PictureInPictureParams.Builder()
                          .setAspectRatio(Rational(16, 9))
                          .build()
                      enterPictureInPictureMode(params)
                  }
              }

              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  if (isInPictureInPictureMode) {
                      binding.searchContainer.visibility = View.GONE
                      binding.videoTitleTxt.visibility = View.GONE
                  } else {
                      binding.searchContainer.visibility = View.VISIBLE
                      binding.videoTitleTxt.visibility = View.VISIBLE
                  }
              }

              override fun onStart() {
                  super.onStart()
                  if (player == null) initPlayer()
              }

              override fun onStop() {
                  super.onStop()
                  if (!isInPictureInPictureMode) {
                      player?.pause()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  player = null
              }
          }
          EOF

      - name: Gradle 8.9 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: VIP APK Derle
        run: gradle assembleDebug --no-daemon

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Pusula-VIP-ExoPlayer
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
