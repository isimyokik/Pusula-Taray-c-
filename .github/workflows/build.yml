name: Pusula APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Projeyi olustur
        run: |
          rm -rf app build settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/pusula/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Pusula"
          include(":app")
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.pusula.browser"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.pusula.browser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "2.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.media:media:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Pusula"
                  android:usesCleartextTraffic="true">

                  <service
                      android:name=".PlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:windowSoftInputMode="adjustResize|stateHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.APP_BROWSER" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Pusula</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.Pusula" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values-night/themes.xml <<'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.Pusula" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#4C8DFF"/>
              <size android:width="108dp" android:height="108dp"/>
          </shape>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </FrameLayout>
          EOF

          cat > app/src/main/assets/newtab.html <<'EOF'
          <!doctype html>
          <html lang="tr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Yeni Sekme</title>
            <style>
              :root{--bg:#0b1020;--surface:#131b33;--field:#1d2848;--text:#eaf0ff;--sub:#8fa0c8;--acc:#4c8dff;--acc2:#8a5cff}
              *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
              html,body{margin:0}
              body{background:var(--bg);color:var(--text);font-family:Roboto,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
              .glow{position:fixed;inset:0;pointer-events:none;background:
                radial-gradient(420px 300px at 85% -40px,rgba(76,141,255,.25),transparent 70%),
                radial-gradient(380px 280px at -10% 18%,rgba(138,92,255,.20),transparent 70%)}
              main{position:relative;max-width:560px;margin:0 auto;padding:34px 18px 40px}
              .hello{color:var(--sub);font-size:14px;margin:0 0 2px}
              h1{font-size:40px;line-height:1.1;margin:0 0 22px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
              form{display:flex;gap:8px;margin-bottom:26px}
              .sbox{flex:1;display:flex;align-items:center;gap:10px;height:54px;border-radius:27px;padding:0 18px;background:#1a2442;border:1px solid rgba(255,255,255,.08)}
              .sbox input{flex:1;border:0;background:transparent;color:var(--text);font-size:16px;outline:none}
              .sbox input::placeholder{color:var(--sub)}
              button.go{width:54px;height:54px;border-radius:50%;border:0;color:#fff;font-size:22px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
            </style>
          </head>
          <body>
            <div class="glow"></div>
            <main>
              <p class="hello" id="hello"></p>
              <h1>Rota</h1>
              <form id="f">
                <div class="sbox">
                  <span>🔎</span>
                  <input id="q" type="search" placeholder="Ara veya adres yaz" autocomplete="off" autocapitalize="off" enterkeyhint="go">
                </div>
                <button class="go" type="submit" aria-label="Git">→</button>
              </form>
            </main>

            <script>
              (function(){
                var cfg = {engine:"Google",search:"https://www.google.com/search?q=%s"};
                try {
                  if (window.Pusula) {
                    var c = JSON.parse(window.Pusula.config());
                    if (c && c.search) cfg = c;
                  }
                } catch (e) {}

                var h = new Date().getHours();
                var greet = h < 5 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar";
                var day = "";
                try { day = new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"}); } catch (e) {}
                document.getElementById("hello").textContent = greet + (day ? " · " + day : "");

                function go(text){
                  text = (text || "").trim();
                  if (!text) return;
                  if (/^https?:\/\//i.test(text)) { location.href = text; return; }
                  if (!/\s/.test(text) && /^([a-z0-9-]+\.)+[a-z]{2,}([:\/?#].*)?$/i.test(text)) {
                    location.href = "https://" + text;
                    return;
                  }
                  location.href = cfg.search.replace("%s", encodeURIComponent(text));
                }

                document.getElementById("f").addEventListener("submit", function(e){
                  e.preventDefault();
                  go(document.getElementById("q").value);
                });
              })();
            </script>
          </body>
          </html>
          EOF

          cat > app/src/main/java/com/pusula/browser/MainActivity.kt <<'EOF'
          package com.pusula.browser

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.mediaPlayback
