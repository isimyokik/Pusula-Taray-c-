                      prefs.adBlock = v; settingsChanged()
                  })
                  add(switchRow("🎧", "Arka planda çalma", "Uygulamadan çıkınca müzik sürer", prefs.bgPlay) { v ->
                      prefs.bgPlay = v; settingsChanged()
                  })
