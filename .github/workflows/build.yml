          cat > app/src/main/java/com/pusula/browser/PlaybackService.kt <<'KOT'
          package com.pusula.browser
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat
          class PlaybackService: Service(){
              companion object{
                  const val ACTION_PLAY="com.pusula.browser.PLAY"; const val ACTION_TOGGLE="com.pusula.browser.TOGGLE"; const val ACTION_PAUSE="com.pusula.browser.PAUSE"; const val ACTION_PREVIOUS="com.pusula.browser.PREV"; const val ACTION_NEXT="com.pusula.browser.NEXT"
                  var running=false
                  fun update(ctx: Context, playing:Boolean, title:String, artist:String){ val i=Intent(ctx,PlaybackService::class.java).putExtra("playing",playing).putExtra("title",title).putExtra("artist",artist); if(Build.VERSION.SDK_INT>=26) ctx.startForegroundService(i) else ctx.startService(i) }
                  fun stop(ctx: Context){ ctx.stopService(Intent(ctx,PlaybackService::class.java)) }
              }
              override fun onBind(intent: Intent?)=null
              override fun onStartCommand(intent: Intent?, flags:Int, startId:Int):Int{
                  val title=intent?.getStringExtra("title")?:"Pusula"; val artist=intent?.getStringExtra("artist")?:""; val playing=intent?.getBooleanExtra("playing",false)?:false
                  if(title.isBlank()&&artist.isBlank()&&!playing){ stopForeground(STOP_FOREGROUND_REMOVE); stopSelf(); return START_NOT_STICKY }
                  val chId="pusula_play"; if(Build.VERSION.SDK_INT>=26){ val nm=getSystemService(NotificationManager::class.java); val ch=NotificationChannel(chId,"Caliyor",NotificationManager.IMPORTANCE_LOW); nm.createNotificationChannel(ch) }
                  val pi=PendingIntent.getActivity(this,0,Intent(this,MainActivity::class.java),PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val prev=PendingIntent.getBroadcast(this,1,Intent(ACTION_PREVIOUS).setPackage(packageName),PendingIntent.FLAG_IMMUTABLE)
                  val toggle=PendingIntent.getBroadcast(this,2,Intent(if(playing) ACTION_PAUSE else ACTION_PLAY).setPackage(packageName),PendingIntent.FLAG_IMMUTABLE)
                  val next=PendingIntent.getBroadcast(this,3,Intent(ACTION_NEXT).setPackage(packageName),PendingIntent.FLAG_IMMUTABLE)
                  val notif=NotificationCompat.Builder(this,chId).setSmallIcon(R.drawable.ic_music).setContentTitle(title.ifBlank{"Pusula"}).setContentText(artist).setContentIntent(pi).setOngoing(playing).addAction(R.drawable.ic_back,"Prev",prev).addAction(if(playing) R.drawable.ic_pause else R.drawable.ic_play,if(playing)"Pause" else "Play",toggle).addAction(R.drawable.ic_forward,"Next",next).setStyle(androidx.media.app.NotificationCompat.MediaStyle().setShowActionsInCompactView(0,1,2)).build()
                  startForeground(1,notif); running=true; return START_STICKY
              }
              override fun onDestroy(){ running=false; super.onDestroy() }
          }
