    private fun openFind() { findBar.visibility = View.VISIBLE; findInput.setText(""); findCount.text = ""; findInput.requestFocus(); (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showSoftInput(findInput,0) }
    private fun closeFind() { if (findBar.visibility != View.VISIBLE) return; findBar.visibility = View.GONE; currentWeb()?.clearMatches(); hideKeyboard(); root.requestFocus() }
    private fun toggleDesktop() { val t = tabs.getOrNull(cur) ?: return; t.desktop = !t.desktop; val s = t.web.settings; if(t.desktop){ val chrome = Regex("Chrome/[\\d.]+").find(t.mobileUa)?.value ?: "Chrome/120.0.0.0"; s.userAgentString = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) $chrome Safari/537.36" } else { s.userAgentString = t.mobileUa }; t.web.reload() }
