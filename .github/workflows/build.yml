          cat > app/src/main/res/layout/tab_preview_item.xml <<'EOF'
          <androidx.cardview.widget.CardView xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="200dp" android:layout_margin="8dp" app:cardCornerRadius="24dp" app:cardElevation="8dp"><LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#2A2A3A"><FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"><ImageView android:id="@+id/tabPreviewImage" android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="centerCrop"/><LinearLayout android:id="@+id/privateBadge" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="#E67C4DFF" android:padding="8dp" android:layout_margin="12dp" android:visibility="gone"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="GIZLI" android:textColor="#FFF" android:textSize="11sp" android:textStyle="bold"/></LinearLayout><TextView android:id="@+id/tabClose" android:layout_width="36dp" android:layout_height="36dp" android:layout_gravity="top|end" android:text="✕" android:gravity="center" android:background="#CC000000" android:textColor="#FFF" android:layout_margin="12dp"/></FrameLayout><TextView android:id="@+id/tabTitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Google" android:padding="14dp" android:maxLines="1" android:textStyle="bold" android:textColor="#FFF"/></LinearLayout></androidx.cardview.widget.CardView>
