                      override fun onBindViewHolder(h: RecyclerView.ViewHolder, pos: Int){ val tv = h.itemView as TextView; tv.text = suggestions[pos]; tv.setOnClickListener{ urlBar.setText(suggestions[pos]); suggestionsRecycler.visibility=View.GONE; var url=suggestions[pos]; if (!url.startsWith("http")) url="https://www.google.com/search?q=${URLEncoder.encode(url,"UTF-8")}"; webView.loadUrl(url) } }
