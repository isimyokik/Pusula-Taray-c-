    private var lastPlaying = false
    private var lastTitle = ""
    private var lastArtist = ""
    private lateinit var dockBar: LinearLayout
    private val roleLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { afterRole() }
    private val notifLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { }
    private val mediaStatePoll = object : Runnable { override fun run() { pollMedia(); handler.postDelayed(this, 1500L) } }
    private fun pollMedia() { val t = tabs.getOrNull(cur) ?: return; try { t.web.evaluateJavascript(MEDIA_STATE_JS) { raw -> onMediaState(raw) } } catch (_: Exception) { } }
    private fun onMediaState(raw: String?) {
        var has = false; var playing = false; var title = ""; var artist = ""
        try {
            if (raw != null && raw != "null" && raw != "\"\"") {
                val inner = JSONArray("[" + raw + "]").getString(0)
                if (inner.isNotEmpty()) { val o = JSONObject(inner); has = true; playing = o.optBoolean("p"); title = o.optString("t"); artist = o.optString("a") }
            }
        } catch (_: Exception) { return }
        if (!has) { if (hasMedia) { hasMedia = false; lastPlaying = false; PlaybackService.stop(this) }; return }
        val changed = !hasMedia || playing != lastPlaying || title != lastTitle || artist != lastArtist
        hasMedia = true; lastPlaying = playing; lastTitle = title; lastArtist = artist
        if (changed && (playing || PlaybackService.running)) PlaybackService.update(this, playing, title, artist)
    }
    private fun enterPip() { if (Build.VERSION.SDK_INT < 26) { toast("Bu Android surumu kucuk pencereyi desteklemiyor"); return }; try { val p = android.app.PictureInPictureParams.Builder().setAspectRatio(android.util.Rational(16, 9)).build(); enterPictureInPictureMode(p) } catch (_: Exception) { toast("Kucuk pencere acilamadi") } }
    private fun onPipChanged(pip: Boolean) { topBar.visibility = if (pip) View.GONE else View.VISIBLE; dockBar.visibility = if (pip) View.GONE else View.VISIBLE; if (pip) { closeFind(); shown?.onResume(); if (customView == null) { try { currentWeb()?.evaluateJavascript(PIP_ON_JS, null) } catch (_: Exception) { } } } else { for (t in tabs) { try { t.web.evaluateJavascript(PIP_OFF_JS, null) } catch (_: Exception) { } } } }
    override fun onUserLeaveHint() { super.onUserLeaveHint(); if (customView != null && Build.VERSION.SDK_INT >= 26) enterPip() }
    private val mediaControlReceiver = object : BroadcastReceiver() {
        override fun onReceive(context: Context?, intent: Intent?) {
            val act = intent?.action ?: return
            val js = when (act) { PlaybackService.ACTION_PLAY, PlaybackService.ACTION_TOGGLE -> MEDIA_TOGGLE_JS; PlaybackService.ACTION_PAUSE -> MEDIA_PAUSE_JS; PlaybackService.ACTION_PREVIOUS -> MEDIA_PREVIOUS_JS; PlaybackService.ACTION_NEXT -> MEDIA_NEXT_JS; else -> return }
            val targets = if (act == PlaybackService.ACTION_PAUSE) tabs.toList() else listOfNotNull(tabs.getOrNull(cur))
            targets.forEach { t -> try { t.web.evaluateJavascript(js, null) } catch (_: Exception) { } }
        }
    }
    private val backgroundMediaPump = object : Runnable { override fun run() { if (!appInBackground || !prefs.bgPlay) return; val t = tabs.getOrNull(cur); try { t.web.evaluateJavascript(BACKGROUND_MEDIA_JS, null) } catch (_: Exception) { }; handler.postDelayed(this, 1200L) } }
