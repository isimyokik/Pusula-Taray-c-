name: APK derle
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Zip'i ac ve derle
        run: |
          unzip -q pusula-android.zip
          cd pusula-android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pusula-apk
          path: pusula-android/app/build/outputs/apk/debug/app-debug.apk
