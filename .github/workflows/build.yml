        label("Gorunum ve arama"); add(settingsRow("TEMA","Tema",Themes.get(prefs.theme).name,chevron()){ chooseTheme{ d.dismiss(); showSettings() } }); add(settingsRow("ARA","Arama motoru",Engines.get(prefs.engine).name,chevron()){ chooseEngine{ d.dismiss(); showSettings() } })
