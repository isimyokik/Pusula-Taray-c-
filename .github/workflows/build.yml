name: Pusula APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Projeyi olustur
        run: |
          rm -rf app build gradle .gradle *.kts gradle.properties gradlew*
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/pusula/browser app/src/main/res/drawable app/src/main/res/values app/src/main/res/values-night gradle/wrapper
          # Önce yapı dosyaları
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Pusula"
          include(":app")
          EOF
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          # Modül yapısı
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pusula.browser"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.pusula.browser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.1‑full‑fix‑output‑ok"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core‑ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.media:media:1.7.0")
          }
          EOF
          # Eksik Kotlin dosyaları eklendi: Prefs, Themes, PlaybackService, PusulaBridge
          cat > app/src/main/java/com/pusula/browser/Prefs.kt <<'EOF'
          package com.pusula.browser
          import android.content.Context
          import android.content.SharedPreferences
          class Prefs(ctx: Context) {
              private val sp: SharedPreferences = ctx.getSharedPreferences("pusula_prefs", Context.MODE_PRIVATE)
              var theme: String
                  get() = sp.getString("theme","default") ?: "default"
                  set(v) = sp.edit().putString("theme",v).apply()
              var bgPlay: Boolean
                  get() = sp.getBoolean("bg_play",true)
                  set(v) = sp.edit().putBoolean("bg_play",v).apply()
              var barBottom: Boolean
                  get() = sp.getBoolean("bar_bottom",false)
                  set(v) = sp.edit().putBoolean("bar_bottom",v).apply()
              var askedNotif: Boolean
                  get() = sp.getBoolean("asked_notif",false)
                  set(v) = sp.edit().putBoolean("asked_notif",v).apply()
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/Themes.kt <<'EOF'
          package com.pusula.browser
          data class Palette(
              val dark:Boolean,
              val bg:Int,val surface:Int,val field:Int,
              val text:Int,val sub:Int,val icon:Int,
              val accent:Int,val accent2:Int
          )
          object Themes {
              fun get(id:String):Palette {
                  return Palette(
                      dark=true,
                      bg=0xFF0b1020.toInt(),
                      surface=0xFF131b33.toInt(),
                      field=0xFF1d2848.toInt(),
                      text=0xFFeaf0ff.toInt(),
                      sub=0xFF8fa0c8.toInt(),
                      icon=0xFFc5cde2.toInt(),
                      accent=0xFF4c8dff.toInt(),
                      accent2=0xFF8a5cff.toInt()
                  )
              }
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/PlaybackService.kt <<'EOF'
          package com.pusula.browser
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.lifecycle.LifecycleService
          class PlaybackService : LifecycleService() {
              companion object {
                  const val CH_ID = "pusula_media"
                  const val ACTION_PLAY = "com.pusula.action.PLAY"
                  const val ACTION_PAUSE = "com.pusula.action.PAUSE"
                  const val ACTION_TOGGLE = "com.pusula.action.TOGGLE"
                  const val ACTION_PREVIOUS = "com.pusula.action.PREV"
                  const val ACTION_NEXT = "com.pusula.action.NEXT"
                  var running = false
                  fun stop(ctx:Context) { ctx.stopService(Intent(ctx,PlaybackService::class.java)) }
                  fun update(ctx:Context,playing:Boolean,title:String,artist:String) {
                      val i = Intent(ctx,PlaybackService::class.java)
                      i.putExtra("play",playing)
                      i.putExtra("title",title)
                      i.putExtra("artist",artist)
                      ctx.startService(i)
                  }
              }
              private var currPlaying = false
              private var currTitle = ""
              private var currArtist = ""
              override fun onCreate() {
                  super.onCreate()
                  running=true
                  if(Build.VERSION.SDK_INT>=26) {
                      val ch = NotificationChannel(CH_ID,"Medya",NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }
              }
              override fun onStartCommand(intent:Intent?,flags:Int,startId:Int):Int {
                  super.onStartCommand(intent,flags,startId)
                  intent?.let {
                      currPlaying = it.getBooleanExtra("play",false)
                      currTitle = it.getStringExtra("title") ?: ""
                      currArtist = it.getStringExtra("artist") ?: ""
                  }
                  val pi = PendingIntent.getActivity(this,0,Intent(this,MainActivity::class.java),PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val n = NotificationCompat.Builder(this,CH_ID)
                      .setContentIntent(pi)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentText(currArtist)
                      .setContentTitle(currTitle.ifBlank { "Pusula Tarayıcı" })
                      .setOngoing(currPlaying)
                      .build()
                  startForeground(1001,n)
                  return START_STICKY
              }
              override fun onDestroy() {
                  running=false
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/PusulaBridge.kt <<'EOF'
          package com.pusula.browser
          import android.webkit.JavascriptInterface
          class PusulaBridge {
              @JavascriptInterface fun config():String = "{}"
              @JavascriptInterface fun savePins(json:String) {}
          }
          EOF
          # Basit ikon‑çizilebilir ve dizgi kaynakları
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf‑8"?>
          <resources>
              <string name="app_name">Pusula</string>
          </resources>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf‑8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#4c8dff"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/ic_reload.xml <<'EOF'
          <?xml version="1.0" encoding="utf‑8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:pathData="M17.65,6.35A7.958,7.958 0,0,0 12,4c‑4.42,0 ‑7.99,3.58 ‑7.99,8s3.57,8 7.99,8c3.73,0 6.84‑2.55 7.73‑6h‑2.08A5.99,5.99 0,0,1 12,18c‑3.31,0 ‑6‑2.69 ‑6‑6s2.69‑6 6‑6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l‑2.35,2.35z" android:fillColor="#c5cde2"/>
          </vector>
          EOF
          # HTML yeni‑sekme dosyası
          cat > app/src/main/assets/newtab.html <<'EOF'
          <!doctype html>
          <html lang="tr">
          <head>
          <meta charset="utf‑8">
          <meta name="viewport" content="width=device‑width,initial‑scale=1">
          <title>Yeni Sekme</title>
          <style>
            :root{--bg:#0b1020;--surface:#131b33;--field:#1d2848;--text:#eaf0ff;--sub:#8fa0c8;--acc:#4c8dff;--acc2:#8a5cff}
            *{box‑sizing:border‑box;‑webkit‑tap‑highlight‑color:transparent}
            html,body{margin:0}
            body{background:var(--bg);color:var(--text);font‑family:Roboto,‑apple‑system,"Segoe UI",sans‑serif;min‑height:100vh;overflow‑x:hidden}
            .glow{position:fixed;inset:0;pointer‑events:none;background:radial‑gradient(420px 300px at 85% ‑40px,color‑mix(in srgb,var(--acc)38%,transparent),transparent 70%),radial‑gradient(380px 280px at ‑10% 18%,color‑mix(in srgb,var(--acc2)30%,transparent),transparent 70%)}
            main{position:relative;max‑width:560px;margin:0 auto;padding:34px 18px 40px}
            .hello{color:var(--sub);font‑size:14px;margin:0 0 2px}
            h1{font‑size:40px;line‑height:1.1;margin:0 0 22px;font‑weight:800;letter‑spacing:‑.5px;background:linear‑gradient(90deg,var(--acc),var(--acc2));‑webkit‑background‑clip:text;background‑clip:text;color:transparent}
            form{display:flex;gap:8px;margin‑bottom:26px}
            .sbox{flex:1;min‑width:0;display:flex;align‑items:center;gap:10px;height:54px;border‑radius:27px;padding:0 18px;background:color‑mix(in srgb,var(--surface)88%,transparent);border:1px solid color‑mix(in srgb,var(--text)12%,transparent);box‑shadow:0 8px 24px rgba(0,0,0,.18)}
            .sbox:focus‑within{border‑color:var(--acc)}
            .sbox input{flex:1;min‑width:0;border:0;background:transparent;color:var(--text);font‑size:16px;outline:none;height:100%}
            .sbox input::placeholder{color:var(--sub)}
            button.go{width:54px;height:54px;border‑radius:50%;border:0;color:#fff;font‑size:22px;background:linear‑gradient(135deg,var(--acc),var(--acc2));box‑shadow:0 8px 20px color‑mix(in srgb,var(--acc)45%,transparent)}
            h2{font‑size:12px;text‑transform:uppercase;letter‑spacing:.12em;color:var(--sub);margin:26px 4px 12px;font‑weight:700}
            .grid{display:grid;grid‑template‑columns:repeat(4,1fr);gap:12px 8px}
            a.t{display:flex;flex‑direction:column;align‑items:center;gap:8px;text‑decoration:none;color:var(--text);font‑size:12px;min‑width:0}
            a.t i{width:58px;height:58px;border‑radius:19px;display:flex;align‑items:center;justify‑content:center;font‑style:normal;font‑size:27px;box‑shadow:0 8px 18px rgba(0,0,0,.25);color:#fff;font‑weight:700}
            a.t span{max‑width:100%;overflow:hidden;text‑overflow:ellipsis;white‑space:nowrap;color:var(--sub)}
            .list{display:flex;flex‑direction:column;gap:8px}
            a.row{display:flex;align‑items:center;gap:12px;text‑decoration:none;color:var(--text);padding:11px 14px;border‑radius:16px;background:color‑mix(in srgb,var(--surface)90%,transparent);border:1px solid color‑mix(in srgb,var(--text)8%,transparent);min‑width:0}
            a.row b{display:block;font‑weight:500;font‑size:14px;overflow:hidden;text‑overflow:ellipsis;white‑space:nowrap}
            a.row small{display:block;color:var(--sub);font‑size:12px;overflow:hidden;text‑overflow:ellipsis;white‑space:nowrap}
            a.row .d{width:34px;height:34px;border‑radius:11px;flex:none;display:flex;align‑items:center;justify‑content:center;color:#fff;font‑weight:700;font‑size:14px}
            .priv{text‑align:center;padding‑top:60px}
            .priv .big{font‑size:64px;margin‑bottom:6px}
            .priv h1{margin‑bottom:8px}
            .priv p{color:var(--sub);line‑height:1.6;margin:0 auto 10px;max‑width:30ch}
            a.t{‑webkit‑touch‑callout:none;‑webkit‑user‑select:none;user‑select:none;transition:transform .15s}
            a.t.drag{transform:scale(1.14);opacity:.85;z‑index:5}
            a.t.add i{background:transparent!important;border:2px dashed color‑mix(in srgb,var(--sub)70%,transparent);box‑shadow:none;color:var(--sub);font‑size:30px;font‑weight:400}
            .sheet‑bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align‑items:flex‑end;justify‑content:center;z‑index:20}
            .sheet{width:100%;max‑width:560px;background:var(--surface);border‑radius:26px 26px 0 0;padding:20px 18px 26px;box‑shadow:0 ‑10px 40px rgba(0,0,0,.4)}
            .sheet h3{margin:0 0 14px;font‑size:18px}
            .sheet label{display:block;font‑size:12px;color:var(--sub);margin:10px 4px 5px}
            .sheet input{width:100%;height:46px;border‑radius:14px;border:1px solid color‑mix(in srgb,var(--text)14%,transparent);background:var(--field);color:var(--text);font‑size:16px;padding:0 14px;outline:none}
            .sheet input:focus{border‑color:var(--acc)}
            .btns{display:flex;gap:10px;margin‑top:18px}
            .btns button{flex:1;height:48px;border‑radius:24px;border:0;font‑size:15px;font‑weight:700;color:var(--text);background:var(--field)}
            .btns button.pri{color:#fff;background:linear‑gradient(135deg,var(--acc),var(--acc2))}
            .btns button.dng{color:#fff;background:linear‑gradient(135deg,#ff5a5f,#d6245a)}
            [hidden]{display:none!important}
          </style>
          </head>
          <body>
          <div class="glow"></div>
          <main id="main">
            <div id="home">
              <p class="hello" id="hello"></p>
              <h1>Rota</h1>
              <form id="f"><div class="sbox"><span>🔎</span><input id="q" type="search" placeholder="Ara veya adres yaz" autocomplete="off" autocapitalize="off" enterkeyhint="go"></div><button class="go" type="submit" aria‑label="Git">→</button></form>
              <h2>Hızlı erişim</h2>
              <div class="grid" id="pins"></div>
              <div id="bmWrap" hidden><h2>Yer imleri</h2><div class="grid" id="bms"></div></div>
              <div id="hsWrap" hidden><h2>Son ziyaretler</h2><div class="list" id="hs"></div></div>
            </div>
            <div class="priv" id="priv" hidden>
              <div class="big">🕶️</div>
              <h1>Gizli sekme</h1>
              <p>Bu sekmede gezdiğin sayfalar geçmişe kaydedilmez ve sekmeyi kapatınca silinir.</p>
              <p>İstersen aşağıdaki kutudan arama yapabilirsin.</p>
              <form id="pf" style="margin‑top:18px"><div class="sbox"><span>🔎</span><input id="pq" type="search" placeholder="Gizlice ara" autocomplete="off"></div><button class="go" type="submit" aria‑label="Git">→</button></form>
            </div>
          </main>
          <script>
          (function(){
            var cfg={engine:"Google",search:"https://www.google.com/search?q=%s",bookmarks:[],history:[]};
            try{if(window.Pusula){var c=JSON.parse(window.Pusula.config());if(c&&c.search)cfg=c;}}catch(e){}
            var r=document.documentElement.style;
            if(cfg.bg){r.setProperty("--bg",cfg.bg);r.setProperty("--surface",cfg.surface);r.setProperty("--field",cfg.field);r.setProperty("--text",cfg.text);r.setProperty("--sub",cfg.sub);r.setProperty("--acc",cfg.accent);r.setProperty("--acc2",cfg.accent2);}
            var isPrivate=/[?&]private=1/.test(location.search);
            if(isPrivate){r.setProperty("--bg","#150d2b");r.setProperty("--surface","#241447");r.setProperty("--field","#34205f");r.setProperty("--text","#f3ecff");r.setProperty("--sub","#b7a4e6");r.setProperty("--acc","#a46bff");r.setProperty("--acc2","#ff5cc8");document.getElementById("home").hidden=true;document.getElementById("priv").hidden=false;}
            var h=new Date().getHours();
            var greet=h<5?"İyi geceler":h<12?"Günaydın":h<18?"İyi günler":"İyi akşamlar";
            var day="";try{day=new Date().toLocaleDateString("tr‑TR",{weekday:"long",day:"numeric",month:"long"});}catch(e){}
            document.getElementById("hello").textContent=greet+(day?" · "+day:"");
            document.getElementById("q").placeholder=cfg.engine+" ile ara veya adres yaz";
            function go(text){text=(text||"").trim();if(!text)return;if(/^https?:\/\//i.test(text)){location.href=text;return;}if(!/\s/.test(text)&&/^([a‑z0‑9‑]+\.)+[a‑z]{2,}([:\/?#].*)?$/i.test(text)){location.href="https://"+text;return;}location.href=cfg.search.replace("%s",encodeURIComponent(text));}
            document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();go(document.getElementById("q").value);});
            document.getElementById("pf").addEventListener("submit",function(e){e.preventDefault();go(document.getElementById("pq").value);});
            var G=["linear‑gradient(135deg,#ff4b4b,#c4001d)","linear‑gradient(135deg,#4c8dff,#2457d6)","linear‑gradient(135deg,#ff7a45,#ff2d6f)","linear‑gradient(135deg,#34c3ff,#2477ff)","linear‑gradient(135deg,#34d37a,#0f9d58)","linear‑gradient(135deg,#8a5cff,#4a35d9)","linear‑gradient(135deg,#ffc84a,#ff8a1f)","linear‑gradient(135deg,#00b894,#00796b)","linear‑gradient(135deg,#fd79a8,#d63384)"];
            var pins=(cfg.pins&&cfg.pins.length>=0&&Array.isArray(cfg.pins))?cfg.pins:[{t:"YouTube",u:"https://m.youtube.com/",e:"▶",g:0},{t:"Google",u:"https://www.google.com/",e:"🔎",g:1},{t:"Müzik",u:"https://music.youtube.com/",e:"🎵",g:2},{t:"Haberler",u:"https://news.google.com/?hl=tr",e:"📰",g:3},{t:"Harita",u:"https://maps.google.com/",e:"🗺️",g:4},{t:"Wikipedia",u:"https://tr.wikipedia.org/",e:"📚",g:5},{t:"Çeviri",u:"https://translate.google.com/",e:"🌐",g:6}];
            function save(){try{if(window.Pusula&&window.Pusula.savePins)window.Pusula.savePins(JSON.stringify(pins));}catch(e){}}
            function tile(label,url,icon,bg){var a=document.createElement("a");a.className="t";a.href=url;var i=document.createElement("i");i.style.background=bg;i.textContent=icon;var s=document.createElement("span");s.textContent=label;a.appendChild(i);a.appendChild(s);return a;}
            var g=document.getElementById("pins");var suppress=false;
            function render(){g.innerHTML="";pins.forEach(function(p,n){var a=tile(p.t,p.u,p.e||(p.t||"?").charAt(0).toUpperCase(),G[(p.g==null?n:p.g)%G.length]);a.dataset.n=n;attachDrag(a);g.appendChild(a);});var plus=tile("Ekle","#","+","none");plus.classList.add("add");plus.addEventListener("click",function(e){e.preventDefault();openEditor(-1);});g.appendChild(plus);}
            function closeSheet(){var o=document.getElementById("ov");if(o)o.remove();}
            function sheet(html){closeSheet();var o=document.createElement("div");o.className="sheet‑bg";o.id="ov";o.innerHTML='<div class="sheet">'+html+'</div>';var t0=Date.now();o.addEventListener("click",function(e){if(e.target===o&&Date.now()-t0>600)closeSheet();});document.body.appendChild(o);return o;}
            function fixUrl(u){u=(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;return u;}
            function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
            function openEditor(idx){var p=idx>=0?pins[idx]:{t:"",u:"",e:""};var o=sheet('<h3>'+(idx>=0?"Kısayolu düzenle":"Yeni kısayol")+'</h3><label>Ad</label><input id="fe_t" value="'+esc(p.t)+'" placeholder="Örn. Wikipedia"><label>Adres</label><input id="fe_u" value="'+esc(p.u)+'" placeholder="Örn. tr.wikipedia.org" autocapitalize="off"><label>Simge (isteğe bağlı emoji)</label><input id="fe_e" value="'+esc(p.e)+'" maxlength="4" placeholder="📚"><div class="btns"><button id="fe_c">İptal</button><button class="pri" id="fe_s">Kaydet</button></div>');o.querySelector("#fe_c").onclick=closeSheet;o.querySelector("#fe_s").onclick=function(){var t=o.querySelector("#fe_t").value.trim();var u=fixUrl(o.querySelector("#fe_u").value);var e=o.querySelector("#fe_e").value.trim();if(!u){o.querySelector("#fe_u").focus();return;}if(!t)t=u.replace(/^https?:\/\/(www\.)?/,"").split("/")[0];if(idx>=0){pins[idx].t=t;pins[idx].u=u;pins[idx].e=e;}else pins.push({t:t,u:u,e:e,g:Math.floor(Math.random()*G.length)});save();closeSheet();render();};}
            function openActions(idx){var o=sheet('<h3>'+esc(pins[idx].t)+'</h3><div class="btns" style="margin‑top:4px"><button id="ac_e">Düzenle</button><button class="dng" id="ac_d">Sil</button></div><div class="btns" style="margin‑top:10px"><button id="ac_c">Kapat</button></div>');o.querySelector("#ac_c").onclick=closeSheet;o.querySelector("#ac_e").onclick=function(){closeSheet();openEditor(idx);};o.querySelector("#ac_d").onclick=function(){pins.splice(idx,1);save();closeSheet();render();};}
