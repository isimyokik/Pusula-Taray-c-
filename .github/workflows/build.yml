          cat > app/src/main/java/com/pusula/browser/AdBlocker.kt <<'EOF'
          package com.pusula.browser
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import java.io.ByteArrayInputStream
          object AdBlocker {
              var isEnabled = true
              private val adHosts = setOf("doubleclick.net","googlesyndication.com","googleadservices.com","google-analytics.com","【entity-facebook¦canonical_name=Facebook】.net","hotjar.com","taboola.com")
              fun shouldBlock(url: String): Boolean { if (!isEnabled) return false; return adHosts.any { url.contains(it, ignoreCase = true) } }
              fun createEmptyResponse(): WebResourceResponse { return WebResourceResponse("text/plain","utf-8",ByteArrayInputStream("".toByteArray())) }
              fun isAdRequest(request: WebResourceRequest): Boolean { return shouldBlock(request.url.toString()) }
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/TabModel.kt <<'EOF'
          package com.pusula.browser
          import android.graphics.Bitmap
          data class TabModel(val id: String, var title: String = "Yeni Sekme", var url: String = "", var bitmap: Bitmap? = null, var isPrivate: Boolean = false)
          EOF
          cat > app/src/main/java/com/pusula/browser/TabManager.kt <<'EOF'
          package com.pusula.browser
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.webkit.WebView
          import java.util.UUID
          object TabManager { 
              val tabs = mutableListOf<TabModel>()
              var currentTabId: String? = null
              fun createNewTab(isPrivate: Boolean = false): TabModel { 
                  val tab = TabModel(id = UUID.randomUUID().toString(), isPrivate = isPrivate)
                  tabs.add(tab); currentTabId = tab.id; return tab 
              }
              fun getCurrentTab(): TabModel? = tabs.find { it.id == currentTabId }
              fun capturePreview(webView: WebView): Bitmap? { 
                  return try { 
                      if (webView.width==0||webView.height==0) return null
                      val bitmap = Bitmap.createBitmap(webView.width, webView.height, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bitmap); webView.draw(canvas)
                      Bitmap.createScaledBitmap(bitmap, bitmap.width/4, bitmap.height/4, true) 
                  } catch (e: Exception) { null } 
              }
              fun updatePreview(tabId: String, bitmap: Bitmap?) { tabs.find { it.id == tabId }?.bitmap = bitmap }
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/BrowserWebViewClient.kt <<'EOF'
          package com.pusula.browser
          import android.graphics.Bitmap
          import android.webkit.*
          class BrowserWebViewClient(private val onUrlChange: (String)->Unit) : WebViewClient() { 
              override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? { 
                  if (AdBlocker.isAdRequest(request)) return AdBlocker.createEmptyResponse()
                  return super.shouldInterceptRequest(view, request) 
              }
              override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) { 
                  TabManager.getCurrentTab()?.let { it.url = url?:"" }
                  url?.let{onUrlChange(it)} 
              }
              override fun onPageFinished(view: WebView?, url: String?) { 
                  TabManager.getCurrentTab()?.let { it.title=view?.title?:"Pusula" }
                  view?.let { val preview=TabManager.capturePreview(it); TabManager.updatePreview(TabManager.currentTabId?:"", preview) }
              } 
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/TabPreviewAdapter.kt <<'EOF'
          package com.pusula.browser
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          class TabPreviewAdapter(private val tabs: List<TabModel>, private val onTabClick: (TabModel) -> Unit, private val onTabClose: (TabModel) -> Unit) : RecyclerView.Adapter<TabPreviewAdapter.ViewHolder>() { 
              class ViewHolder(v: View) : RecyclerView.ViewHolder(v) { 
                  val preview: ImageView = v.findViewById(R.id.tabPreviewImage)
                  val title: TextView = v.findViewById(R.id.tabTitle)
                  val close: View = v.findViewById(R.id.tabClose)
                  val privateBadge: LinearLayout = v.findViewById(R.id.privateBadge) 
              }
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder { return ViewHolder(LayoutInflater.from(parent.context).inflate(R.layout.tab_preview_item, parent, false)) }
              override fun onBindViewHolder(holder: ViewHolder, position: Int) { 
                  val tab=tabs[position]
                  holder.title.text=tab.title
                  if (tab.bitmap!=null) holder.preview.setImageBitmap(tab.bitmap) else holder.preview.setImageResource(android.R.drawable.sym_def_app_icon)
                  holder.privateBadge.visibility = if (tab.isPrivate) View.VISIBLE else View.GONE
                  holder.itemView.setOnClickListener{onTabClick(tab)}
                  holder.close.setOnClickListener{onTabClose(tab)} 
              }
              override fun getItemCount()=tabs.size 
          }
          EOF
          cat > app/src/main/java/com/pusula/browser/MainActivity.kt <<'EOF'
          package com.pusula.browser
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.preference.PreferenceManager
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private lateinit var tabPreviewOverlay: View
              private lateinit var tabRecycler: RecyclerView
              private lateinit var urlBar: EditText
              private lateinit var backButton: TextView
              private lateinit var forwardButton: TextView
              private lateinit var homeButton: View
              private lateinit var newTabButton: TextView
              private lateinit var tabCountButton: TextView
              private lateinit var refreshButton: TextView
              private lateinit var menuButton: TextView
              private lateinit var menuOverlay: View
              private lateinit var topBar: LinearLayout
              private lateinit var bottomBar: LinearLayout
              private lateinit var topSearchContainer: LinearLayout
              private lateinit var rootLayout: View
              private lateinit var privateBanner: LinearLayout
              private lateinit var tabsTitle: TextView
              private var isDark = true
              private var isDesktop = false
              private var originalUA = ""
              private var backPressedOnce = false
              private val mainHandler = Handler(Looper.getMainLooper())
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = PreferenceManager.getDefaultSharedPreferences(this)
                  isDark = prefs.getBoolean("dark_theme", true)
                  isDesktop = prefs.getBoolean("desktop_mode", false)
                  setContentView(R.layout.activity_main)
                  webView=findViewById(R.id.webView)
                  tabPreviewOverlay=findViewById(R.id.tabPreviewOverlay)
                  tabRecycler=findViewById(R.id.tabRecycler)
                  urlBar=findViewById(R.id.urlBar)
                  backButton=findViewById(R.id.backButton)
                  forwardButton=findViewById(R.id.forwardButton)
                  homeButton=findViewById(R.id.homeButton)
                  newTabButton=findViewById(R.id.newTabButton)
                  tabCountButton=findViewById(R.id.tabCountButton)
                  refreshButton=findViewById(R.id.refreshButton)
                  menuButton=findViewById(R.id.menuButton)
                  menuOverlay=findViewById(R.id.menuOverlay)
                  topBar=findViewById(R.id.topBar)
                  bottomBar=findViewById(R.id.bottomBar)
                  topSearchContainer=findViewById(R.id.topSearchContainer)
                  rootLayout=findViewById(R.id.rootLayout)
                  privateBanner=findViewById(R.id.privateBanner)
                  tabsTitle=findViewById(R.id.tabsTitle)
                  setupWebView(); setupTabs(); setupNav(); setupMenu()
                  if (TabManager.tabs.isEmpty()) TabManager.createNewTab()
                  loadHome(); updateTabCount(); applyTheme(); updatePrivateUI()
              }
              private fun setupWebView() {
                  webView.settings.apply {
                      javaScriptEnabled=true
                      domStorageEnabled=true
                      cacheMode=WebSettings.LOAD_DEFAULT
                      builtInZoomControls=true
                      displayZoomControls=false
                      mediaPlaybackRequiresUserGesture=false
                      mixedContentMode=WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }
                  originalUA = webView.settings.userAgentString
                  if (isDesktop) webView.settings.userAgentString = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                  webView.webViewClient=BrowserWebViewClient(onUrlChange={ url -> urlBar.setText(url); updateNav() })
              }
              override fun onBackPressed() {
                  if (tabPreviewOverlay.visibility==View.VISIBLE){ tabPreviewOverlay.visibility=View.GONE; return }
                  if (menuOverlay.visibility==View.VISIBLE){ menuOverlay.visibility=View.GONE; return }
                  if (webView.canGoBack()){ webView.goBack(); return }
                  if (backPressedOnce){ super.onBackPressed(); return }
                  backPressedOnce=true
                  Toast.makeText(this,"Çıkmak için tekrar basın",Toast.LENGTH_SHORT).show()
                  mainHandler.postDelayed({ backPressedOnce=false },2000)
              }
              private fun setupNav() {
                  backButton.setOnClickListener{ if (webView.canGoBack()) webView.goBack() }
                  forwardButton.setOnClickListener{ if (webView.canGoForward()) webView.goForward() }
                  homeButton.setOnClickListener{ loadHome() }
                  refreshButton.setOnClickListener{ webView.reload() }
                  urlBar.setOnEditorActionListener{ _,_,_ ->
                      var url=urlBar.text.toString().trim()
                      if (url.isNotEmpty()){
                          if (!url.startsWith("http://") && !url.startsWith("https://")){
                              if (url.contains(".") && !url.contains(" ")){ url="https://$url" } else { url="https://www.google.com/search?q=$url" }
                          }
                          webView.loadUrl(url)
                          TabManager.getCurrentTab()?.url=url
                      }
                      true
                  }
              }
              private fun setupTabs() {
                  tabRecycler.layoutManager=GridLayoutManager(this,2)
                  tabRecycler.adapter=TabPreviewAdapter(TabManager.tabs,
                      onTabClick={ tab ->
                          TabManager.currentTabId=tab.id
                          tabPreviewOverlay.visibility=View.GONE
                          webView.loadUrl(tab.url.ifEmpty{"https://www.google.com"})
                          urlBar.setText(tab.url)
                          updateNav(); updatePrivateUI(); applyTheme()
                      },
                      onTabClose={ tab ->
                          TabManager.tabs.remove(tab)
                          tabRecycler.adapter?.notifyDataSetChanged()
                          updateTabCount()
                          if (TabManager.tabs.isEmpty()) { TabManager.createNewTab(); loadHome() }
                          updatePrivateUI()
                      })
                  tabCountButton.setOnClickListener{
                      TabManager.getCurrentTab()?.let{ val bmp=TabManager.capturePreview(webView); TabManager.updatePreview(it.id,bmp) }
                      tabRecycler.adapter?.notifyDataSetChanged()
                      tabPreviewOverlay.visibility=View.VISIBLE
                  }
                  findViewById<View>(R.id.closeTabsButton).setOnClickListener{ tabPreviewOverlay.visibility=View.GONE }
                  newTabButton.setOnClickListener{
                      TabManager.createNewTab()
                      tabRecycler.adapter?.notifyDataSetChanged()
                      updateTabCount(); loadHome(); tabPreviewOverlay.visibility=View.GONE
                      updatePrivateUI(); applyTheme()
                  }
                  findViewById<View>(R.id.newPrivateTabButton).setOnClickListener{
                      TabManager.createNewTab(isPrivate=true)
                      tabRecycler.adapter?.notifyDataSetChanged()
                      updateTabCount()
                      Toast.makeText(this,"Gizli sekme açıldı",Toast.LENGTH_SHORT).show()
                      loadHome(); tabPreviewOverlay.visibility=View.GONE
                      updatePrivateUI(); applyTheme()
                  }
              }
              private fun setupMenu() {
                  menuButton.setOnClickListener{ menuOverlay.visibility=View.VISIBLE }
                  findViewById<View>(R.id.menuClose).setOnClickListener{ menuOverlay.visibility=View.GONE }
                  menuOverlay.setOnClickListener{ menuOverlay.visibility=View.GONE }
                  findViewById<TextView>(R.id.menuAdBlock).setOnClickListener{
                      AdBlocker.isEnabled=!AdBlocker.isEnabled
                      (it as TextView).text="🚫 Reklam Engelleme: ${if(AdBlocker.isEnabled)"Açık" else "Kapalı"}"
                      Toast.makeText(this,if(AdBlocker.isEnabled)"Reklam engelleme açık" else "Kapalı",Toast.LENGTH_SHORT).show()
                  }
                  findViewById<TextView>(R.id.menuTheme).setOnClickListener{
                      isDark=!isDark
                      PreferenceManager.getDefaultSharedPreferences(this).edit().putBoolean("dark_theme",isDark).apply()
                      applyTheme()
                      (it as TextView).text="🌙 Tema: ${if(isDark)"Koyu" else "Açık"}"
                  }
                  findViewById<TextView>(R.id.menuDesktop).setOnClickListener{
                      isDesktop=!isDesktop
                      PreferenceManager.getDefaultSharedPreferences(this).edit().putBoolean("desktop_mode",isDesktop).apply()
                      webView.settings.userAgentString = if (isDesktop) "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" else originalUA
                      webView.reload(); menuOverlay.visibility=View.GONE
                      (it as TextView).text="💻 Masaüstü: ${if(isDesktop)"Açık" else "Kapalı"}"
                  }
                  findViewById<TextView>(R.id.menuClear).setOnClickListener{
                      webView.clearHistory(); webView.clearCache(true)
                      Toast.makeText(this,"Geçmiş temizlendi",Toast.LENGTH_SHORT).show()
                      menuOverlay.visibility=View.GONE
                  }
              }
              private fun updatePrivateUI(){
                  val isPrivate = TabManager.getCurrentTab()?.isPrivate == true
                  privateBanner.visibility = if (isPrivate) View.VISIBLE else View.GONE
                  if (isPrivate){ topSearchContainer.setBackgroundResource(R.drawable.bg_search_private) } else { applyTheme() }
              }
              private fun applyTheme(){
                  val isPrivate = TabManager.getCurrentTab()?.isPrivate == true
                  if (isPrivate){
                      rootLayout.setBackgroundColor(Color.parseColor("#1A122E"))
                      topBar.setBackgroundColor(Color.parseColor("#3A2A60"))
                      bottomBar.setBackgroundColor(Color.parseColor("#2A1E40"))
                      urlBar.setTextColor(Color.WHITE)
                      return
                  }
                  if (isDark){
                      rootLayout.setBackgroundColor(Color.parseColor("#0F0F14"))
                      topBar.setBackgroundColor(Color.parseColor("#0F0F14"))
                      bottomBar.setBackgroundColor(Color.parseColor("#1E1E28"))
                      topSearchContainer.setBackgroundResource(R.drawable.bg_search)
                      urlBar.setTextColor(Color.WHITE)
                      urlBar.setHintTextColor(Color.parseColor("#9AA0B6"))
                      tabsTitle.setTextColor(Color.WHITE)
                      tabPreviewOverlay.setBackgroundColor(Color.parseColor("#0F0F14"))
                  } else {
                      rootLayout.setBackgroundColor(Color.WHITE)
                      topBar.setBackgroundColor(Color.WHITE)
                      bottomBar.setBackgroundColor(Color.parseColor("#F2F2F7"))
                      topSearchContainer.setBackgroundResource(R.drawable.bg_search_light)
                      urlBar.setTextColor(Color.BLACK)
                      urlBar.setHintTextColor(Color.GRAY)
                      tabsTitle.setTextColor(Color.BLACK)
                      tabPreviewOverlay.setBackgroundColor(Color.WHITE)
                  }
              }
              private fun loadHome() {
                  val home="https://www.google.com"
                  webView.loadUrl(home)
                  TabManager.getCurrentTab()?.url=home
                  urlBar.setText(home)
                  updateNav(); updatePrivateUI()
              }
              private fun updateTabCount(){ tabCountButton.text=TabManager.tabs.size.toString() }
              private fun updateNav(){ backButton.alpha=if(webView.canGoBack())1f else 0.3f; forwardButton.alpha=if(webView.canGoForward())1f else 0.3f }
          }
