    private fun settingsRow(icon: String, title: String, sub: String?, trailing: View?, onClick: () -> Unit): View { val row = LinearLayout(this); row.orientation = LinearLayout.HORIZONTAL; row.gravity = Gravity.CENTER_VERTICAL; row.setPadding(dp(12),dp(10),dp(14),dp(10)); row.background = ripple(shape(cSurface,18)); row.setOnClickListener{ onClick() }; val ic = TextView(this); ic.text = icon; ic.textSize = 19f; ic.gravity = Gravity.CENTER; val g = GradientDrawable(GradientDrawable.Orientation.TL_BR,intArrayOf(cAccent,cAccent2)); g.cornerRadius = dp(13).toFloat(); ic.background = g; row.addView(ic,LinearLayout.LayoutParams(dp(42),dp(42))); val col = LinearLayout(this); col.orientation = LinearLayout.VERTICAL; col.setPadding(dp(12),0,dp(8),0); val tt = TextView(this); tt.text = title; tt.textSize = 15.5f; tt.setTextColor(cText); tt.setTypeface(null,Typeface.BOLD); col.addView(tt); if(sub!=null){ val st = TextView(this); st.text = sub; st.textSize = 12.5f; st.setTextColor(cSub); col.addView(st) }; row.addView(col,LinearLayout.LayoutParams(0,ViewGroup.LayoutParams.WRAP_CONTENT,1f)); if(trailing!=null) row.addView(trailing,LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT,ViewGroup.LayoutParams.WRAP_CONTENT)); return row }
    private fun chevron(): TextView { val c = TextView(this); c.text = ">"; c.textSize = 24f; c.setTextColor(cSub); return c }
    private fun switchRow(icon: String, title: String, sub: String, value: Boolean, onChange: (Boolean) -> Unit): View { val sw = SwitchCompat(this); sw.isChecked = value; val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()); sw.thumbTintList = ColorStateList(states,intArrayOf(Color.WHITE,cSub)); sw.trackTintList = ColorStateList(states,intArrayOf(cAccent,cField)); sw.setOnCheckedChangeListener{ _,v -> onChange(v) }; return settingsRow(icon,title,sub,sw){ sw.toggle() } }
    private fun showSettings() {
        val d = Dialog(this); val rootV = LinearLayout(this); rootV.orientation = LinearLayout.VERTICAL; rootV.setBackgroundColor(cBg); rootV.setPadding(dp(14),dp(34),dp(14),dp(14))
