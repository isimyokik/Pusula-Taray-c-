              private fun fetchSuggestions(q: String){
                  Thread{
                      try {
                          val url = URL("https://suggestqueries.google.com/complete/search?client=firefox&q=${URLEncoder.encode(q,"UTF-8")}")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connectTimeout=2000
                          val text = conn.inputStream.bufferedReader().readText()
                          val list = mutableListOf<String>()
                          val regex = "\"([^\"]+)\"".toRegex()
                          val matches = regex.findAll(text)
                          var i=0
                          for (m in matches){ if (i++==0) continue; if (i>8) break; list.add(m.groupValues[1]) }
                          runOnUiThread{ suggestions.clear(); suggestions.addAll(list); suggestionsRecycler.adapter?.notifyDataSetChanged(); suggestionsRecycler.visibility=if(list.isNotEmpty()) View.VISIBLE else View.GONE }
                      } catch (e: Exception){}
