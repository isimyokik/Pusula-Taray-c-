          package com.pusula.browser

          import android.content.Intent
          import android.os.Bundle
          import android.support.v4.media.MediaBrowserCompat
          import android.support.v4.media.MediaDescriptionCompat
          import android.support.v4.media.MediaMetadataCompat
          import android.support.v4.media.session.MediaSessionCompat
          import android.support.v4.media.session.PlaybackStateCompat
          import androidx.media.MediaBrowserServiceCompat

          /**
           * Android Auto medya tarayıcısı.
           * Auto kendi yatay arayüzünü çizer: başlık, oynat/duraklat, sonraki/önceki, arama, listeler.
           * WebView Auto'da açılamaz; çalma telefonda WebView üzerinden sürer.
           */
          class RotaMediaBrowserService : MediaBrowserServiceCompat() {

              override fun onCreate() {
                  super.onCreate()
                  // PlaybackService oturumu yoksa boş bir oturum ile Auto'ya bağlan
                  val token = PlaybackService.sessionToken
                  if (token != null) {
                      try { sessionToken = MediaSessionCompat.Token.fromToken(token) } catch (_: Exception) { }
                  }
                  if (sessionToken == null) {
                      // Servisi uyandır
                      try {
                          PlaybackService.update(this, false, "Rota", "Android Auto")
                          PlaybackService.sessionToken?.let {
                              sessionToken = MediaSessionCompat.Token.fromToken(it)
                          }
                      } catch (_: Exception) { }
                  }
              }

              override fun onGetRoot(clientPackageName: String, clientUid: Int, rootHints: Bundle?): BrowserRoot {
                  return BrowserRoot(ROOT, null)
              }

              override fun onLoadChildren(parentId: String, result: Result<MutableList<MediaBrowserCompat.MediaItem>>) {
                  val prefs = Prefs(this)
                  val out = ArrayList<MediaBrowserCompat.MediaItem>()
                  when (parentId) {
                      ROOT -> {
                          out.add(folder(HOME, "Ana sayfa · Önerilen"))
                          out.add(folder(FAV, "Favoriler"))
                          out.add(folder(RECENT, "Son dinlenenler"))
                      }
                      HOME, RECENT -> {
                          for (e in prefs.history().take(30)) {
                              if (e.url.startsWith("http")) out.add(song(e.url, e.title.ifBlank { e.url }, e.url))
                          }
                      }
                      FAV -> {
                          for (e in prefs.bookmarks().take(40)) {
                              if (e.url.startsWith("http")) out.add(song(e.url, e.title.ifBlank { e.url }, e.url))
                          }
                      }
                  }
                  result.sendResult(out)
              }

              override fun onSearch(query: String, extras: Bundle?, result: Result<MutableList<MediaBrowserCompat.MediaItem>>) {
                  val q = query.trim()
                  val prefs = Prefs(this)
                  val out = ArrayList<MediaBrowserCompat.MediaItem>()
                  if (q.isNotEmpty()) {
                      // Önce yerelden eşleşenler
                      val all = prefs.bookmarks() + prefs.history()
                      for (e in all) {
                          if (e.title.contains(q, true) || e.url.contains(q, true)) {
                              out.add(song(e.url, e.title.ifBlank { e.url }, e.url))
                          }
                      }
                      // YouTube Music araması (telefonda açılır / çalmaya hazırlanır)
                      val searchUrl = "https://music.youtube.com/search?q=" + android.net.Uri.encode(q)
                      out.add(0, song(searchUrl, "\"$q\" ara · YouTube Music", "YouTube Music"))
                  }
                  result.sendResult(out)
              }

              private fun folder(id: String, title: String): MediaBrowserCompat.MediaItem {
                  val d = MediaDescriptionCompat.Builder().setMediaId(id).setTitle(title).build()
                  return MediaBrowserCompat.MediaItem(d, MediaBrowserCompat.MediaItem.FLAG_BROWSABLE)
              }

              private fun song(id: String, title: String, subtitle: String): MediaBrowserCompat.MediaItem {
                  val d = MediaDescriptionCompat.Builder()
                      .setMediaId(id)
                      .setTitle(title.take(80))
                      .setSubtitle(subtitle.take(80))
                      .build()
                  return MediaBrowserCompat.MediaItem(d, MediaBrowserCompat.MediaItem.FLAG_PLAYABLE)
              }

              companion object {
                  const val ROOT = "root"
                  const val HOME = "home"
                  const val FAV = "fav"
                  const val RECENT = "recent"
              }
          }
