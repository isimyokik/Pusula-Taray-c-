                          val dx = e2.x - e1.x
                          if (Math.abs(dx)>200 && Math.abs(vx)>200){
                              if (dx>0 && webView.canGoBack()){ webView.goBack(); return true }
                              if (dx<0 && webView.canGoForward()){ webView.goForward(); return true }
                          }
                          return false
                      }
                  })
                  webView.setOnTouchListener{ _, ev -> detector.onTouchEvent(ev); false }
