name: Pusula APK (Artifact düzeltilmiş)
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java‑17 ayarla
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proje yapısını oluştur
        run: |
          rm -rf app build gradle* build.gradle* settings.gradle*
          mkdir -p app/src/main/{assets,java/com/pusula/browser,res/{drawable,layout,values}}

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Pusula"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pusula.browser"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.pusula.browser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "2.4‑artifact‑fix"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.13.0")
              implementation("androidx.webkit:webkit:1.13.0")
              implementation("androidx.media:media:1.7.0")
          }
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#2962FF"/>
          </shape>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Pusula" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Pusula</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"/>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.pusula.browser">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Pusula"
                  android:usesCleartextTraffic="true">
                  <service android:name=".PlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
                  <activity android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode"
                      android:exported="true" android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:windowSoftInputMode="adjustResize|stateHidden">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.APP_BROWSER"/><category android:name="android.intent.category.DEFAULT"/></intent-filter>
                      <intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/>
                      <data android:scheme="http"/><data android:scheme="https"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/assets/newtab.html <<'EOF'
          <!doctype html>
          <html lang="tr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Yeni Sekme</title>
          <style>
            :root{--bg:#0b1020;--surf:#131b33;--field:#1d2848;--txt:#eaf0ff;--sub:#8fa0c8;--acc:#4c8dff;--acc2:#8a5cff}
            *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
            body{background:var(--bg);color:var(--txt);font-family:Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
            .glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 85% -40%,rgba(76,141,255,.3),transparent 70%),radial-gradient(circle at -10% 18%,rgba(138,92,255,.25),transparent 70%)}
            main{position:relative;max-width:560px;margin:0 auto;padding:34px 18px 40px}
            .hello{color:var(--sub);font-size:14px;margin-bottom:2px}
            h1{font-size:40px;line-height:1.1;margin:0 0 22px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
            form{display:flex;gap:8px;margin-bottom:26px}
            .sbox{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:54px;border-radius:27px;padding:0 18px;background:rgba(19,27,51,.88);border:1px solid rgba(234,240,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.18)}
            .sbox:focus-within{border-color:var(--acc)}
            .sbox input{flex:1;min-width:0;border:0;background:0;color:var(--txt);font-size:16px;outline:none;height:100%}
            .sbox input::placeholder{color:var(--sub)}
            button.go{width:54px;height:54px;border-radius:50%;border:0;color:#fff;font-size:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 20px rgba(76,141,255,.45)}
            h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--sub);margin:26px 4px 12px;font-weight:700}
            .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
            a.t{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--txt);font-size:12px;min-width:0}
            a.t i{width:58px;height:58px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:27px;box-shadow:0 8px 18px rgba(0,0,0,.25);color:#fff;font-weight:700}
            a.t span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
            .list{display:flex;flex-direction:column;gap:8px}
            a.row{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--txt);padding:11px 14px;border-radius:16px;background:rgba(19,27,51,.9);border:1px solid rgba(234,240,255,.08);min-width:0}
            a.row b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
            a.row small{display:block;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
            a.row .d{width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
            .priv{text-align:center;padding-top:60px}
            .priv .big{font-size:64px;margin-bottom:6px}
            .priv h1{margin-bottom:8px}
            .priv p{color:var(--sub);line-height:1.6;margin:0 auto 10px;max-width:30ch}
            a.t{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .15s ease}
            a.t:active{transform:scale(1.14);opacity:.85;z-index:5}
            a.t.add i{background:transparent!important;border:2px dashed rgba(143,160,200,.7);box-shadow:none;color:var(--sub);font-size:30px;font-weight:400}
            .sheet‑bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
            .sheet{width:100%;max-width:560px;background:var(--surf);border-radius:26px 26px 0 0;padding:20px 18px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
            .sheet h3{margin:0 0 14px;font-size:18px}
            .sheet label{display:block;font-size:12px;color:var(--sub);margin:10px 4px 5px}
            .sheet input{width:100%;height:46px;border-radius:14px;border:1px solid rgba(234,240,255,.14);background:var(--field);color:var(--txt);font-size:16px;padding:0 14px;outline:none}
            .sheet input:focus{border-color:var(--acc)}
            .btns{display:flex;gap:10px;margin-top:18px}
            .btns button{flex:1;height:48px;border-radius:24px;border:0;font-size:15px;font-weight:700;color:var(--txt);background:var(--field)}
            .btns button.pri{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2))}
            .btns button.dng{color:#fff;background:linear-gradient(135deg,#ff5a5f,#d6245a)}
            [hidden]{display:none!important}
          </style>
          </head>
          <body>
          <div class="glow"></div>
          <main id="main">
            <div id="home">
              <p class="hello" id="hello"></p>
              <h1>Rota</h1>
              <form id="f">
                <div class="sbox"><span>🔎</span><input id="q" type="search" placeholder="Ara veya adres yaz" autocomplete="off" autocapitalize="off" enterkeyhint="go"></div>
                <button class="go" type="submit" aria‑label="Git">→</button>
              </form>
              <h2>Hızlı erişim</h2>
              <div class="grid" id="pins"></div>
              <div id="bmWrap" hidden><h2>Yer imleri</h2><div class="grid" id="bms"></div></div>
              <div id="hsWrap" hidden><h2>Son ziyaretler</h2><div class="list" id="hs"></div></div>
            </div>
            <div class="priv" id="priv" hidden>
              <div class="big">🕶️</div>
              <h1>Gizli sekme</h1>
              <p>Bu sekmedeki sayfalar geçmişe kaydedilmez ve kapatıldığında silinir.</p>
              <form id="pf" style="margin‑top:18px">
                <div class="sbox"><span>🔎</span><input id="pq" type="search" placeholder="Gizlice ara" autocomplete="off" autocapitalize="off"></div>
                <button class="go" type="submit" aria‑label="Git">→</button>
              </form>
            </div>
          </main>
          <script>
          (function(){
            var cfg={engine:"Google",search:"https://www.google.com/search?q=%s",bookmarks:[],history:[]};
            try{var s=localStorage.getItem("pusulaCfg");if(s)cfg=JSON.parse(s);}catch(e){}
            var r=document.documentElement.style;
            if(cfg.bg)r.setProperty("--bg",cfg.bg);
            if(cfg.surf)r.setProperty("--surf",cfg.surf);
            if(cfg.field)r.setProperty("--field",cfg.field);
            if(cfg.txt)r.setProperty("--txt",cfg.txt);
            if(cfg.sub)r.setProperty("--sub",cfg.sub);
            if(cfg.acc)r.setProperty("--acc",cfg.acc);
            if(cfg.acc2)r.setProperty("--acc2",cfg.acc2);
            var isPriv=/[?&]private=1/.test(location.search);
            if(isPriv){r.setProperty("--bg","#150d2b");r.setProperty("--surf","#241447");r.setProperty("--field","#34205f");r.setProperty("--txt","#f3ecff");r.setProperty("--sub","#b7a4e6");r.setProperty("--acc","#a46bff");r.setProperty("--acc2","#ff5cc8");document.getElementById("home").hidden=true;document.getElementById("priv").hidden=false;}
            var h=new Date().getHours();
            var greet=h<5?"İyi geceler":h<12?"Günaydın":h<18?"İyi günler":"İyi akşamlar";
            var day="";try{day=new Date().toLocaleDateString("tr‑TR",{weekday:"long",day:"numeric",month:"long"});}catch(e){}
            document.getElementById("hello").textContent=greet+(day?" · "+day:"");
            document.getElementById("q").placeholder=cfg.engine+" ile ara veya adres yaz";
            function go(t){t=(t||"").trim();if(!t)return;var u;if(/^https?:\/\//i.test(t))u=t;else if(/\.[a‑z0‑9‑]{2,}$/i.test(t)&&!/\s/.test(t))u="https://"+t;else u=cfg.search.replace("%s",encodeURIComponent(t));console.log("navigate:",u);}
            document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("q").value);});
            document.getElementById("pf").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("pq").value);});
            var G=["linear‑gradient(135deg,#ff4b4b,#c4001d)","linear‑gradient(135deg,#4c8dff,#2457d6)","linear‑gradient(135deg,#ff7a45,#ff2d6f)","linear‑gradient(135deg,#34c3ff,#2477ff)","linear‑gradient(135deg,#34d37a,#0f9d58)","linear‑gradient(135deg,#8a5cff,#4a35d9)","linear‑gradient(135deg,#ffc84a,#ff8a1f)","linear‑gradient(135deg,#00b894,#00796b)","linear‑gradient(135deg,#fd79a8,#d63384)"];
            var pins=(cfg.pins&&Array.isArray(cfg.pins))?cfg.pins:[{t:"YouTube",u:"https://m.youtube.com/",e:"▶",g:0},{t:"Google",u:"https://www.google.com/",e:"🔎",g:1},{t:"Müzik",u:"https://music.youtube.com/",e:"🎵",g:2},{t:"Haberler",u:"https://news.google.com/?hl=tr",e:"📰",g:3},{t:"Harita",u:"https://www.google.com/maps",e:"🗺️",g:4},{t:"Vikipedi",u:"https://tr.wikipedia.org/",e:"📚",g:5},{t:"Çeviri",u:"https://translate.google.com/",e:"🌐",g:6}];
            function save(){try{localStorage.setItem("pusulaCfg",JSON.stringify(cfg));}catch(e){}}
            function tile(l,u,i,b){var a=document.createElement("a");a.className="t";a.href=u;a.innerHTML='<i style="background:'+b+'">'+i+'</i><span>'+l+'</span>';return a;}
            var gEl=document.getElementById("pins");var suppress=false;
            function render(){gEl.innerHTML="";pins.forEach((p,n)=>{var a=tile(p.t,p.u,p.e||(p.t?""+p.t[0].toUpperCase():"?"),G[p.g??n%G.length]);a.dataset.n=n;a.addEventListener("click",e=>{if(suppress){e.preventDefault();openEdit(n);}});gEl.appendChild(a);});var plus=tile("Ekle","#","+","none");plus.classList.add("add");plus.addEventListener("click",e=>{e.preventDefault();openEdit(-1);});gEl.appendChild(plus);}
            function closeSheet(){var o=document.getElementById("ov");if(o)o.remove();}
            function sheet(html){closeSheet();var o=document.createElement("div");o.className="sheet‑bg";o.id="ov";o.innerHTML='<div class="sheet">'+html+"</div>";var t0=performance.now();o.addEventListener("click",e=>{if(e.target===o&&performance.now()-t0>600)closeSheet();});document.body.appendChild(o);return o;}
            function esc(x){return(String(x)||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]||c));}
            function openEdit(idx){var isNew=idx<0;var p=isNew?{t:"",u:"",e:""}:pins[idx];var o=sheet('<h3>'+(isNew?"Yeni kısayol":"Kısayolu düzenle")+'</h3><label>Başlık</label><input id="ft" value="'+esc(p.t)+'" placeholder="Örn: Vikipedi"><label>Adres</label><input id="fu" value="'+esc(p.u)+'" placeholder="örn: tr.wikipedia.org" autocapitalize="off"><label>İkon (emoji)</label><input id="fe" value="'+esc(p.e)+'" maxlength="4" placeholder="📚"><div class="btns"><button id="fc">İptal</button><button class="pri" id="fs">Kaydet</button></div>');o.querySelector("#fc").onclick=e=>{e.preventDefault();closeSheet();};o.querySelector("#fs").onclick=e=>{e.preventDefault();var t=document.getElementById("ft").value.trim();var uRaw=document.getElementById("fu").value.trim();var e=document.getElementById("fe").value.trim();if(!uRaw){document.getElementById("fu").focus();return;}var u=uRaw;if(!/^https?:\/\//i.test(u))u="https://"+u;if(isNew){pins.push({t:t,u:u,e:e,g:Math.floor(Math.random()*G.length)});}else{pins[idx].t=t;pins[idx].u=u;pins[idx].e=e;}cfg.pins=pins;save();closeSheet();render();};}
            render();
          })();
          </script>
          </body>
          </html>
          EOF

          cat > app/src/main/java/com/pusula/browser/MainActivity.kt <<'EOF'
          package com.pusula.browser
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF

          cat > app/src/main/java/com/pusula/browser/PlaybackService.kt <<'EOF'
          package com.pusula.browser
          import android.app.Service
          import android.content.Intent
          import android.os.IBinder
          class PlaybackService : Service() {
              override fun onBind(intent: Intent): IBinder? = null
          }
          EOF

          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Derle
        run: ./gradlew clean assembleRelease

      - name: APK dosyasını bul ve göster
        run: find . -name "*.apk"

      - name: Artifact'a yükle
        uses: actions/upload-artifact@v4
        with:
          name: pusula‑apk
          path: app/build/outputs/apk/release/*.apk
