name: Pusula VIP APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/pusula/player app/src/main/res/values

          cat > build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          GRADLE

          cat > settings.gradle.kts <<'GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PusulaVIP"
          include(":app")
          GRADLE

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          PROPS

          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pusula.player"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.pusula.player"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 41
                  versionName = "4.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="Pusula VIP"
                  android:theme="@style/Theme.Pusula"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|uiMode|keyboardHidden"
                      android:supportsPictureInPicture="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="Theme.Pusula" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#5C8DFF</item>
                  <item name="android:statusBarColor">#0D1016</item>
                  <item name="android:navigationBarColor">#0D1016</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          XML

          cat > app/src/main/java/com/pusula/player/MainActivity.kt <<'KOTLIN'
          package com.pusula.player

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import android.net.Uri

          class MainActivity : Activity() {
              private lateinit var root: LinearLayout
              private lateinit var tabStrip: LinearLayout
              private lateinit var webHost: FrameLayout
              private lateinit var address: EditText
              private val tabs = mutableListOf<WebView>()
              private var active = 0
              private var fullscreenView: View? = null
              private var fullscreenCallback: WebChromeClient.CustomViewCallback? = null
              private var originalWebHost: ViewGroup? = null

              private val bg = Color.rgb(13, 16, 22)
              private val panel = Color.rgb(26, 30, 39)
              private val blue = Color.rgb(47, 107, 255)
              private val white = Color.WHITE

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)

                  root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bg)
                  }
                  val brand = TextView(this).apply {
                      text = "▶  PUSULA VIP"
                      textSize = 18f
                      setTextColor(white)
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), 0, dp(12), 0)
                  }
                  root.addView(brand, LinearLayout.LayoutParams(-1, dp(48)))

                  val addressRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(8), dp(5), dp(8), dp(5))
                  }
                  address = EditText(this).apply {
                      isSingleLine = true
                      textSize = 14f
                      setTextColor(white)
                      setHintTextColor(Color.LTGRAY)
                      hint = "YouTube'da ara veya bağlantı gir"
                      setPadding(dp(12), 0, dp(12), 0)
                      setBackgroundColor(panel)
                      imeOptions = android.view.inputmethod.EditorInfo.IME_ACTION_GO
                      setOnEditorActionListener { _, _, _ -> loadAddress(); true }
                  }
                  addressRow.addView(address, LinearLayout.LayoutParams(0, dp(44), 1f))
                  addressRow.addView(makeButton("Git", blue) { loadAddress() }, LinearLayout.LayoutParams(dp(58), dp(44)))
                  root.addView(addressRow)

                  val tabScroll = HorizontalScrollView(this).apply { isHorizontalScrollBarEnabled = false }
                  tabStrip = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(dp(5), dp(3), dp(5), dp(3)) }
                  tabScroll.addView(tabStrip)
                  root.addView(tabScroll, LinearLayout.LayoutParams(-1, dp(44)))

                  webHost = FrameLayout(this)
                  root.addView(webHost, LinearLayout.LayoutParams(-1, 0, 1f))

                  val controls = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(dp(5), dp(4), dp(5), dp(4))
                  }
                  controls.addView(makeButton("‹", panel) { current()?.let { if (it.canGoBack()) it.goBack() } }, weightedButton())
                  controls.addView(makeButton("›", panel) { current()?.let { if (it.canGoForward()) it.goForward() } }, weightedButton())
                  controls.addView(makeButton("↻", panel) { current()?.reload() }, weightedButton())
                  controls.addView(makeButton("Ana sayfa", panel) { current()?.loadUrl("https://m.youtube.com/") }, weightedButton())
                  controls.addView(makeButton("+ Sekme", blue) { addTab("https://m.youtube.com/") }, weightedButton())
                  root.addView(controls)
                  setContentView(root)
                  addTab("https://m.youtube.com/")
              }

              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()
              private fun weightedButton() = LinearLayout.LayoutParams(0, dp(44), 1f).apply { setMargins(dp(2), 0, dp(2), 0) }

              private fun makeButton(label: String, color: Int, action: () -> Unit): Button = Button(this).apply {
                  text = label
                  textSize = 12f
                  setTextColor(white)
                  setBackgroundColor(color)
                  isAllCaps = false
                  setPadding(dp(4), 0, dp(4), 0)
                  setOnClickListener { action() }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun addTab(url: String) {
                  val web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.loadsImagesAutomatically = true
                  web.settings.mediaPlaybackRequiresUserGesture = true
                  web.settings.javaScriptCanOpenWindowsAutomatically = true
                  web.settings.setSupportMultipleWindows(true)
                  web.settings.userAgentString = web.settings.userAgentString
                  web.setBackgroundColor(Color.BLACK)
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val uri = request.url
                          if (uri.scheme == "http" || uri.scheme == "https") return false
                          return try {
                              startActivity(Intent(Intent.ACTION_VIEW, uri)); true
                          } catch (_: Exception) { true }
                      }
                      override fun onPageStarted(view: WebView, url: String?, favicon: android.graphics.Bitmap?) {
                          if (tabs.getOrNull(active) === view && url != null) address.setText(url)
                      }
                      override fun onPageFinished(view: WebView, url: String?) {
                          if (tabs.getOrNull(active) === view && url != null) address.setText(url)
                          refreshTabs()
                      }
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onReceivedTitle(view: WebView, title: String?) { refreshTabs() }
                      override fun onShowCustomView(view: View, callback: CustomViewCallback) {
                          if (fullscreenView != null) { callback.onCustomViewHidden(); return }
                          fullscreenView = view
                          fullscreenCallback = callback
                          (view.parent as? ViewGroup)?.removeView(view)
                          addContentView(view, ViewGroup.LayoutParams(-1, -1))
                          requestedOrientation = android.content.pm.ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                          window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_LAYOUT_STABLE)
                      }
                      override fun onHideCustomView() { exitFullscreen() }
                  }
                  tabs.add(web)
                  active = tabs.lastIndex
                  webHost.removeAllViews()
                  webHost.addView(web, FrameLayout.LayoutParams(-1, -1))
                  web.loadUrl(url)
                  refreshTabs()
              }

              private fun current(): WebView? = tabs.getOrNull(active)

              private fun loadAddress() {
                  var text = address.text.toString().trim()
                  if (text.isBlank()) return
                  val url = if (text.startsWith("http://") || text.startsWith("https://")) text
                    else if (text.contains('.') && !text.contains(' ')) "https://$text"
                    else "https://m.youtube.com/results?search_query=" + Uri.encode(text)
                  current()?.loadUrl(url)
                  address.clearFocus()
              }

              private fun refreshTabs() {
                  if (!::tabStrip.isInitialized) return
                  tabStrip.removeAllViews()
                  tabs.forEachIndexed { index, web ->
                      val title = web.title?.take(15)?.ifBlank { null } ?: "Sekme ${index + 1}"
                      val tab = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(dp(8), 0, dp(5), 0)
                          setBackgroundColor(if (index == active) blue else panel)
                      }
                      val label = TextView(this).apply { text = title; textSize = 12f; setTextColor(white); maxLines = 1 }
                      label.setOnClickListener { switchTab(index) }
                      tab.addView(label)
                      val close = TextView(this).apply { text = "  ×"; textSize = 16f; setTextColor(white); setPadding(dp(5), 0, 0, 0) }
                      close.setOnClickListener { closeTab(index) }
                      tab.addView(close)
                      val params = LinearLayout.LayoutParams(-2, dp(34)).apply { setMargins(dp(3), 0, dp(3), 0) }
                      tabStrip.addView(tab, params)
                      tab.setOnClickListener { switchTab(index) }
                  }
              }

              private fun switchTab(index: Int) {
                  if (index !in tabs.indices) return
                  active = index
                  webHost.removeAllViews()
                  (tabs[index].parent as? ViewGroup)?.removeView(tabs[index])
                  webHost.addView(tabs[index], FrameLayout.LayoutParams(-1, -1))
                  address.setText(tabs[index].url ?: "")
                  refreshTabs()
              }

              private fun closeTab(index: Int) {
                  if (tabs.size <= 1) {
                      tabs[0].loadUrl("https://m.youtube.com/")
                      return
                  }
                  val removed = tabs.removeAt(index)
                  (removed.parent as? ViewGroup)?.removeView(removed)
                  removed.stopLoading()
                  removed.destroy()
                  if (active >= tabs.size) active = tabs.lastIndex
                  else if (index < active) active--
                  switchTab(active)
              }

              private fun exitFullscreen() {
                  val view = fullscreenView ?: return
                  (view.parent as? ViewGroup)?.removeView(view)
                  fullscreenView = null
                  fullscreenCallback?.onCustomViewHidden()
                  fullscreenCallback = null
                  requestedOrientation = android.content.pm.ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  webHost.removeAllViews()
                  current()?.let { (it.parent as? ViewGroup)?.removeView(it); webHost.addView(it, FrameLayout.LayoutParams(-1, -1)) }
              }

              @Deprecated("Deprecated in Android")
              override fun onBackPressed() {
                  if (fullscreenView != null) { exitFullscreen(); return }
                  val web = current()
                  if (web?.canGoBack() == true) web.goBack() else super.onBackPressed()
              }

              override fun onDestroy() {
                  tabs.forEach { it.stopLoading(); it.destroy() }
                  tabs.clear()
                  super.onDestroy()
              }
          }
          KOTLIN

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pusula-VIP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
