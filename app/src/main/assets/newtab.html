<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yeni Sekme</title>
<style>
  :root{--bg:#0b1020;--surface:#131b33;--field:#1d2848;--text:#eaf0ff;--sub:#8fa0c8;--acc:#4c8dff;--acc2:#8a5cff;--acc3:#36d1ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:Roboto,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
  .glow{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(460px 340px at 88% -60px,color-mix(in srgb,var(--acc) 40%,transparent),transparent 70%),
               radial-gradient(420px 320px at -12% 16%,color-mix(in srgb,var(--acc2) 32%,transparent),transparent 70%),
               radial-gradient(520px 360px at 50% 112%,color-mix(in srgb,var(--acc3) 22%,transparent),transparent 72%)}
  html.light .glow{opacity:.75}
  .wall{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .wall svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .wall .tw{animation:tw 4s ease-in-out infinite alternate}
  .wall .dr{animation:dr 18s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.25}to{opacity:1}}
  @keyframes dr{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
  @media (prefers-reduced-motion:reduce){.wall .tw,.wall .dr{animation:none}}
  main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:34px 18px 40px}
  .hello{color:var(--sub);font-size:14px;margin:0 0 2px}
  h1{font-size:40px;line-height:1.1;margin:0 0 22px;font-weight:800;letter-spacing:-.5px;
     background:linear-gradient(90deg,var(--acc),var(--acc2) 60%,var(--acc3));-webkit-background-clip:text;background-clip:text;color:transparent}
  form{display:flex;gap:8px;margin-bottom:26px}
  .sbox{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:54px;border-radius:27px;padding:0 18px;
        background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid color-mix(in srgb,var(--text) 12%,transparent);
        box-shadow:0 10px 30px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  html.light .sbox{box-shadow:0 8px 24px rgba(40,60,100,.12)}
  .sbox:focus-within{border-color:var(--acc)}
  .sbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:16px;outline:none;height:100%}
  .sbox input::placeholder{color:var(--sub)}
  button.go{width:54px;height:54px;border-radius:50%;border:0;color:#fff;font-size:22px;
            background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 45%,transparent)}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--sub);margin:26px 4px 12px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
  a.t{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-size:12px;min-width:0}
  a.t i{width:58px;height:58px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:27px;
        box-shadow:0 8px 18px rgba(0,0,0,.25);color:#fff;font-weight:700}
  a.t span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
  .list{display:flex;flex-direction:column;gap:8px}
  a.row{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);padding:11px 14px;border-radius:16px;
        background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid color-mix(in srgb,var(--text) 8%,transparent);min-width:0}
  a.row b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a.row small{display:block;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a.row .d{width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
  .priv{text-align:center;padding-top:60px}
  .priv .big{font-size:64px;margin-bottom:6px}
  .priv h1{margin-bottom:8px}
  .priv p{color:var(--sub);line-height:1.6;margin:0 auto 10px;max-width:30ch}
  a.t{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .15s}
  a.t.drag{transform:scale(1.14);opacity:.85;z-index:5}
  a.t.add i{background:transparent!important;border:2px dashed color-mix(in srgb,var(--sub) 70%,transparent);box-shadow:none;color:var(--sub);font-size:30px;font-weight:400}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{width:100%;max-width:560px;background:var(--surface);border-radius:26px 26px 0 0;padding:20px 18px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
  .sheet h3{margin:0 0 14px;font-size:18px}
  .sheet label{display:block;font-size:12px;color:var(--sub);margin:10px 4px 5px}
  .sheet input{width:100%;height:46px;border-radius:14px;border:1px solid color-mix(in srgb,var(--text) 14%,transparent);background:var(--field);color:var(--text);font-size:16px;padding:0 14px;outline:none}
  .sheet input:focus{border-color:var(--acc)}
  .btns{display:flex;gap:10px;margin-top:18px}
  .btns button{flex:1;height:48px;border-radius:24px;border:0;font-size:15px;font-weight:700;color:var(--text);background:var(--field)}
  .btns button.pri{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2))}
  .btns button.dng{color:#fff;background:linear-gradient(135deg,#ff5a5f,#d6245a)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wall" id="wall"></div>
<main id="main">
  <div id="home">
    <p class="hello" id="hello"></p>
    <h1>Rota</h1>
    <form id="f"><div class="sbox"><span>🔎</span><input id="q" type="search" placeholder="Ara veya adres yaz" autocomplete="off" autocapitalize="off" enterkeyhint="go"></div><button class="go" type="submit" aria-label="Git">→</button></form>
    <h2>Hızlı erişim</h2>
    <div class="grid" id="pins"></div>
    <div id="bmWrap" hidden><h2>Yer imleri</h2><div class="grid" id="bms"></div></div>
    <div id="hsWrap" hidden><h2>Son ziyaretler</h2><div class="list" id="hs"></div></div>
  </div>
  <div class="priv" id="priv" hidden>
    <div class="big">🕶️</div>
    <h1>Gizli sekme</h1>
    <p>Bu sekmede gezdiğin sayfalar geçmişe kaydedilmez ve sekmeyi kapatınca silinir.</p>
    <p>İstersen aşağıdaki kutudan arama yapabilirsin.</p>
    <form id="pf" style="margin-top:18px"><div class="sbox"><span>🔎</span><input id="pq" type="search" placeholder="Gizlice ara" autocomplete="off"></div><button class="go" type="submit" aria-label="Git">→</button></form>
  </div>
</main>
<script>
(function(){
  var cfg = {engine:"Google",search:"https://www.google.com/search?q=%s",bookmarks:[],history:[]};
  var r = document.documentElement.style;
  var isPrivate = /[?&]private=1/.test(location.search);
  function readCfg(){
    try { if (window.Pusula) { var c = JSON.parse(window.Pusula.config()); if (c && c.search) return c; } } catch (e) {}
    return null;
  }
  var c0 = readCfg(); if (c0) cfg = c0;

  // ---- Duvar kâğıtları: renkler tema değişkenlerinden (var(--acc...)) gelir ----
  function F(v, o){ return 'style="fill:var(' + v + ');opacity:' + o + '"'; }
  function seeded(n){ var s = n; return function(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
  var WALLS = {
    orbs: function(){ return ''; },
    stars: function(L){
      var rnd = seeded(7), out = '';
      for (var i = 0; i < 70; i++) {
        var x = rnd() * 400, y = rnd() * 560, rr = rnd() * 1.3 + .3, d = (rnd() * 4).toFixed(1);
        out += '<circle class="tw" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + rr.toFixed(2) + '" style="fill:var(--text);animation-delay:-' + d + 's;animation-duration:' + (3 + rnd() * 3).toFixed(1) + 's"/>';
      }
      return '<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">' + out +
        '<circle cx="330" cy="120" r="44" ' + F('--acc3', .14) + '/><circle cx="330" cy="120" r="22" ' + F('--text', .85) + '/><circle cx="341" cy="113" r="20" style="fill:var(--bg)"/></svg>';
    },
    aurora: function(L){
      var o = L ? .35 : .55;
      return '<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"><defs><filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>' +
        '<linearGradient id="ag1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc3)"/></linearGradient>' +
        '<linearGradient id="ag2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--acc2)"/><stop offset="1" style="stop-color:var(--acc)"/></linearGradient></defs>' +
        '<g filter="url(#bl)" class="dr"><path d="M-40 150 C 80 40, 160 230, 260 120 S 400 60, 460 150 L 460 260 C 340 190, 250 330, 150 240 S 20 220, -40 270 Z" fill="url(#ag1)" opacity="' + o + '"/>' +
        '<path d="M-40 300 C 60 220, 170 360, 280 270 S 410 250, 460 320 L 460 400 C 330 350, 240 470, 140 390 S 10 370, -40 410 Z" fill="url(#ag2)" opacity="' + (o * .8) + '"/></g></svg>';
    },
    hills: function(L){
      var k = L ? .55 : 1;
      return '<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice">' +
        '<circle cx="90" cy="130" r="54" ' + F('--acc3', .16 * k) + '/><circle cx="90" cy="130" r="26" ' + F('--acc3', .5 * k) + '/>' +
        '<path d="M0 640 C 90 580, 170 600, 250 560 S 370 540, 400 560 L 400 800 L 0 800 Z" ' + F('--acc2', .22 * k) + '/>' +
        '<path d="M0 690 C 80 640, 190 680, 270 630 S 380 620, 400 640 L 400 800 L 0 800 Z" ' + F('--acc', .3 * k) + '/>' +
        '<path d="M0 740 C 100 700, 180 740, 280 700 S 370 700, 400 710 L 400 800 L 0 800 Z" ' + F('--acc3', .38 * k) + '/></svg>';
    },
    dunes: function(L){
      return '<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice">' +
        '<circle cx="300" cy="150" r="60" ' + F('--acc3', .22) + '/><circle cx="300" cy="150" r="32" ' + F('--acc3', .6) + '/>' +
        '<path d="M0 620 C 70 570, 150 640, 240 600 S 360 560, 400 590 L 400 800 L 0 800 Z" ' + F('--acc3', .22) + '/>' +
        '<path d="M0 680 C 90 630, 170 700, 260 660 S 370 630, 400 650 L 400 800 L 0 800 Z" ' + F('--acc', .26) + '/>' +
        '<path d="M0 735 C 100 700, 190 750, 290 715 S 380 700, 400 710 L 400 800 L 0 800 Z" ' + F('--acc2', .3) + '/></svg>';
    },
    sunset: function(L){
      var k = L ? .6 : 1, st = '';
      for (var i = 0; i < 6; i++) st += '<rect x="0" y="' + (404 + i * 15) + '" width="400" height="' + (2 + i * 1.4) + '" style="fill:var(--bg)"/>';
      return '<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc3)"/><stop offset=".55" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient></defs>' +
        '<circle cx="200" cy="470" r="150" ' + F('--acc', .1 * k) + '/><circle cx="200" cy="470" r="96" style="fill:url(#sg);opacity:' + (.9 * k) + '"/>' + st +
        '<path d="M0 520 L0 800 L400 800 L400 520 C 340 490, 300 540, 240 515 S 120 480, 60 520 S 20 515, 0 520 Z" style="fill:var(--bg)"/>' +
        '<path d="M0 600 C 100 560, 180 620, 280 585 S 370 570, 400 590 L 400 800 L 0 800 Z" ' + F('--acc2', .22 * k) + '/></svg>';
    },
    waves: function(L){
      var k = L ? .8 : 1;
      return '<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice">' +
        '<g class="dr"><path d="M-40 620 C 20 595, 80 645, 140 620 S 260 595, 320 620 S 420 645, 460 620 L 460 800 L -40 800 Z" ' + F('--acc3', .2 * k) + '/></g>' +
        '<path d="M-20 665 C 40 640, 100 690, 160 665 S 280 640, 340 665 S 420 690, 440 665 L 440 800 L -20 800 Z" ' + F('--acc', .25 * k) + '/>' +
        '<g class="dr" style="animation-direction:alternate-reverse"><path d="M-40 715 C 20 690, 80 740, 140 715 S 260 690, 320 715 S 420 740, 460 715 L 460 800 L -40 800 Z" ' + F('--acc2', .3 * k) + '/></g></svg>';
    },
    grid: function(L){
      var g = '', i;
      for (i = 0; i <= 14; i++) g += '<line x1="' + (200 + (i - 7) * 14) + '" y1="520" x2="' + (200 + (i - 7) * 90) + '" y2="800" style="stroke:var(--acc);stroke-width:1;opacity:.5"/>';
      for (i = 0; i < 8; i++) { var y = 520 + Math.pow(i / 7, 1.9) * 280; g += '<line x1="0" y1="' + y.toFixed(1) + '" x2="400" y2="' + y.toFixed(1) + '" style="stroke:var(--acc);stroke-width:1;opacity:.45"/>'; }
      return '<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>' +
        '<mask id="gm"><rect x="0" y="500" width="400" height="300" fill="url(#gf)"/></mask></defs>' +
        '<g mask="url(#gm)" opacity="' + (L ? .5 : .8) + '">' + g + '</g>' +
        '<circle cx="200" cy="520" r="70" ' + F('--acc3', .12) + '/></svg>';
    }
  };

  function applyTheme(c){
    var wall = c.wall || "orbs", light = (c.dark === false);
    if (c.bg) {
      r.setProperty("--bg",c.bg); r.setProperty("--surface",c.surface); r.setProperty("--field",c.field);
      r.setProperty("--text",c.text); r.setProperty("--sub",c.sub); r.setProperty("--acc",c.accent); r.setProperty("--acc2",c.accent2);
      r.setProperty("--acc3", c.accent3 || c.accent2);
    }
    if (isPrivate) {
      r.setProperty("--bg","#150d2b"); r.setProperty("--surface","#241447"); r.setProperty("--field","#34205f");
      r.setProperty("--text","#f3ecff"); r.setProperty("--sub","#b7a4e6"); r.setProperty("--acc","#a46bff"); r.setProperty("--acc2","#ff5cc8"); r.setProperty("--acc3","#5c7cff");
      wall = "stars"; light = false;
    }
    document.documentElement.classList.toggle("light", light);
    var w = document.getElementById("wall");
    if (w) w.innerHTML = (WALLS[wall] || WALLS.orbs)(light);
  }
  window.__rotaTheme = function(){ var c = readCfg(); if (c) { for (var k in c) if (k !== "pins" && k !== "bookmarks" && k !== "history") cfg[k] = c[k]; } applyTheme(cfg); };
  applyTheme(cfg);
  if (isPrivate) {
    document.getElementById("home").hidden = true; document.getElementById("priv").hidden = false;
  }
  var h = new Date().getHours();
  var greet = h < 5 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar";
  var day = ""; try { day = new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"}); } catch (e) {}
  document.getElementById("hello").textContent = greet + (day ? " · " + day : "");
  document.getElementById("q").placeholder = cfg.engine + " ile ara veya adres yaz";

  function go(text){
    text = (text || "").trim();
    if (!text) return;
    if (/^https?:\/\//i.test(text)) { location.href = text; return; }
    if (!/\s/.test(text) && /^([a-z0-9-]+\.)+[a-z]{2,}([:\/?#].*)?$/i.test(text)) { location.href = "https://" + text; return; }
    location.href = cfg.search.replace("%s", encodeURIComponent(text));
  }
  document.getElementById("f").addEventListener("submit", function(e){ e.preventDefault(); go(document.getElementById("q").value); });
  document.getElementById("pf").addEventListener("submit", function(e){ e.preventDefault(); go(document.getElementById("pq").value); });

  var G = ["linear-gradient(135deg,#ff4b4b,#c4001d)","linear-gradient(135deg,#4c8dff,#2457d6)","linear-gradient(135deg,#ff7a45,#ff2d6f)","linear-gradient(135deg,#34c3ff,#2477ff)","linear-gradient(135deg,#34d37a,#0f9d58)","linear-gradient(135deg,#8a5cff,#4a35d9)","linear-gradient(135deg,#ffc84a,#ff8a1f)","linear-gradient(135deg,#00b894,#00796b)","linear-gradient(135deg,#fd79a8,#d63384)"];
  var DEFAULT_PINS = [
    {t:"YouTube",u:"https://m.youtube.com/",e:"▶",g:0},
    {t:"Google",u:"https://www.google.com/",e:"🔎",g:1},
    {t:"Müzik",u:"https://music.youtube.com/",e:"🎵",g:2},
    {t:"Haberler",u:"https://news.google.com/?hl=tr",e:"📰",g:3},
    {t:"Harita",u:"https://maps.google.com/",e:"🗺️",g:4},
    {t:"Wikipedia",u:"https://tr.wikipedia.org/",e:"📚",g:5},
    {t:"Çeviri",u:"https://translate.google.com/",e:"🌐",g:6}
  ];
  function pinsFromCfg(){
    try {
      if (cfg && Array.isArray(cfg.pins)) return cfg.pins;
    } catch (e) {}
    return null;
  }
  var pins = pinsFromCfg();
  if (pins == null) pins = DEFAULT_PINS.slice();
  var saveTimer = null;
  var iconBusy = {};
  function save(){
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try {
        if (window.Pusula && window.Pusula.savePins) window.Pusula.savePins(JSON.stringify(pins));
      } catch (e) {}
    }, 400);
  }
  function tile(label, url, icon, bg){
    var a = document.createElement("a"); a.className = "t"; a.href = url;
    var i = document.createElement("i"); i.style.background = bg; i.textContent = icon;
    var s = document.createElement("span"); s.textContent = label;
    a.appendChild(i); a.appendChild(s); return a;
  }
  var g = document.getElementById("pins");
  var suppress = false;

  function setBoxIcon(box, img, fill){
    if (!box || !img) return;
    box.textContent = "";
    if (fill) box.style.background = fill;
    img.style.cssText = "width:70%;height:70%;object-fit:contain;border-radius:8px";
    box.appendChild(img);
  }
  function showIcon(box, src, fill){
    if (!box || !src || box.querySelector("img")) return;
    var img = new Image();
    img.referrerPolicy = "no-referrer";
    img.onload = function(){
      if (img.naturalWidth < 8) return;
      setBoxIcon(box, img, fill);
    };
    img.src = src;
  }
  function favicon(a, pinIndex, u){
    var box = a.querySelector("i");
    if (!box || box.querySelector("img")) return;
    var fill = box.style.background || "";
    var key = (pinIndex >= 0 ? "p" + pinIndex : "u:" + u) + "|" + u;
    if (iconBusy[key]) return;
    var saved = (pinIndex >= 0 && pins[pinIndex] && pins[pinIndex].i) ? String(pins[pinIndex].i) : "";
    if (saved) {
      showIcon(box, saved, fill);
      return;
    }
    iconBusy[key] = 1;
    var host = "";
    try { host = new URL(u).hostname; } catch (e) {}
    if (!host) { delete iconBusy[key]; return; }
    var list = [
      "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=128",
      "https://" + host + "/favicon.ico"
    ];
    var k = 0;
    function tryNext(){
      if (k >= list.length) { delete iconBusy[key]; return; }
      var src = list[k++];
      var img = new Image();
      img.referrerPolicy = "no-referrer";
      img.onload = function(){
        if (img.naturalWidth < 8) { tryNext(); return; }
        setBoxIcon(box, img, fill);
        if (pinIndex >= 0 && pins[pinIndex]) {
          pins[pinIndex].i = src;
          save();
        }
        delete iconBusy[key];
      };
      img.onerror = tryNext;
      img.src = src;
    }
    tryNext();
  }
  function rowIcon(el, u){
    if (!el || el.querySelector("img")) return;
    var host = "";
    try { host = new URL(u).hostname; } catch (e) {}
    if (!host) return;
    var key = "r:" + host;
    if (iconBusy[key]) return;
    iconBusy[key] = 1;
    var list = [
      "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=64",
      "https://" + host + "/favicon.ico"
    ];
    var k = 0;
    function tryNext(){
      if (k >= list.length) { delete iconBusy[key]; return; }
      var src = list[k++];
      var img = new Image();
      img.referrerPolicy = "no-referrer";
      img.onload = function(){
        if (img.naturalWidth < 8) { tryNext(); return; }
        el.textContent = "";
        img.style.cssText = "width:20px;height:20px;object-fit:contain";
        el.appendChild(img);
        delete iconBusy[key];
      };
      img.onerror = tryNext;
      img.src = src;
    }
    tryNext();
  }

  // Yerel HTML (file/content): uygulama ikonu — harf yok, isim tahmini yok
  function isLocalUrl(u){
    u = String(u || "");
    var low = u.toLowerCase();
    if (low.indexOf("http://") === 0 || low.indexOf("https://") === 0) return false;
    if (low.indexOf("file:") === 0 || low.indexOf("content:") === 0 || low.indexOf("about:") === 0) return true;
    if (/\.html?(?:\?|#|$)/i.test(u)) return true;
    try {
      var x = new URL(u, location.href);
      if (x.protocol === "file:" || x.protocol === "content:" || x.protocol === "about:") return true;
    } catch (e) {}
    return false;
  }
  function applyAppIcon(a){
    var box = a.querySelector("i");
    if (!box || box.querySelector("img")) return;
    function paintCanvas(){
      try {
        var c = document.createElement("canvas");
        c.width = 128; c.height = 128;
        var ctx = c.getContext("2d");
        var g = ctx.createLinearGradient(0, 0, 128, 128);
        g.addColorStop(0, "#4c8dff"); g.addColorStop(1, "#8a5cff");
        ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 64px system-ui,sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("R", 64, 70);
        var img = new Image();
        img.onload = function(){
          box.textContent = "";
          box.style.background = "transparent";
          img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:19px";
          box.appendChild(img);
        };
        img.src = c.toDataURL("image/png");
      } catch (e) {
        box.textContent = "R";
        box.style.fontSize = "28px";
      }
    }
    // Önce assets logosu; yoksa Rota "R" ikonu (harf/başlık değil)
    var img = new Image();
    img.onload = function(){
      if (img.naturalWidth < 8) { paintCanvas(); return; }
      box.textContent = "";
      box.style.background = "#fff";
      img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:19px";
      box.appendChild(img);
    };
    img.onerror = paintCanvas;
    img.src = "https://appassets.androidplatform.net/assets/ic_launcher.png";
  }

  function render(){
    g.innerHTML = "";
    pins.forEach(function(p, n){
      var rawE = (p.e && String(p.e).trim()) ? String(p.e).trim() : "";
      var useApp = rawE === "__app__" || isLocalUrl(p.u);
      var hasE = !!(rawE && rawE !== "__app__");
      var a = tile(p.t, p.u, hasE ? rawE : (useApp ? "" : (p.t||"?").charAt(0).toUpperCase()), G[(p.g == null ? n : p.g) % G.length]);
      if (useApp) applyAppIcon(a);
      else if (!hasE) favicon(a, n, p.u);
      a.dataset.n = n;
      attachDrag(a);
      g.appendChild(a);
    });
    var plus = tile("Ekle", "#", "+", "none");
    plus.classList.add("add");
    plus.addEventListener("click", function(e){ e.preventDefault(); openEditor(-1); });
    g.appendChild(plus);
  }

  function closeSheet(){ var o = document.getElementById("ov"); if (o) o.remove(); }
  function sheet(html){
    closeSheet();
    var o = document.createElement("div"); o.className = "sheet-bg"; o.id = "ov";
    o.innerHTML = '<div class="sheet">' + html + '</div>';
    var t0 = Date.now();
    o.addEventListener("click", function(e){ if (e.target === o && Date.now() - t0 > 600) closeSheet(); });
    document.body.appendChild(o);
    return o;
  }
  function fixUrl(u){
    u = (u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }
  function esc(x){ return String(x == null ? "" : x).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function openEditor(idx){
    var p = idx >= 0 ? pins[idx] : {t:"",u:"",e:""};
    var o = sheet('<h3>' + (idx >= 0 ? "Kısayolu düzenle" : "Yeni kısayol") + '</h3>' +
      '<label>Ad</label><input id="fe_t" value="' + esc(p.t) + '" placeholder="Örn. Wikipedia">' +
      '<label>Adres</label><input id="fe_u" value="' + esc(p.u) + '" placeholder="Örn. tr.wikipedia.org" autocapitalize="off">' +
      '<label>Simge (boş bırakırsan sitenin kendi logosu kullanılır)</label><input id="fe_e" value="' + esc(p.e === "__app__" ? "" : p.e) + '" maxlength="4" placeholder="📚">' +
      '<div class="btns"><button id="fe_c">İptal</button><button class="pri" id="fe_s">Kaydet</button></div>');
    o.querySelector("#fe_c").onclick = closeSheet;
    o.querySelector("#fe_s").onclick = function(){
      var t = o.querySelector("#fe_t").value.trim();
      var uRaw = o.querySelector("#fe_u").value.trim();
      var e = o.querySelector("#fe_e").value.trim();
      var u = uRaw;
      // Yerel dosya yolunu https'e çevirme
      if (/^(file:|content:)/i.test(uRaw)) u = uRaw;
      else u = fixUrl(uRaw);
      if (!u) { o.querySelector("#fe_u").focus(); return; }
      if (!t) t = u.replace(/^https?:\/\/(www\.)?/, "").split("/")[0];
      if (isLocalUrl(u) && !e) e = "__app__";
      if (idx >= 0) { pins[idx].t = t; pins[idx].u = u; pins[idx].e = e; delete pins[idx].i; }
      else pins.push({t:t,u:u,e:e,g:Math.floor(Math.random()*G.length)});
      save(); closeSheet(); render();
    };
  }

  function openActions(idx){
    var o = sheet('<h3>' + esc(pins[idx].t) + '</h3><div class="btns" style="margin-top:4px"><button id="ac_e">Düzenle</button><button class="dng" id="ac_d">Sil</button></div>' +
      '<div class="btns" style="margin-top:10px"><button id="ac_c">Kapat</button></div>');
    o.querySelector("#ac_c").onclick = closeSheet;
    o.querySelector("#ac_e").onclick = function(){ closeSheet(); openEditor(idx); };
    o.querySelector("#ac_d").onclick = function(){ pins.splice(idx, 1); save(); closeSheet(); render(); };
  }

  function attachDrag(a){
    var timer = null, dragging = false, sx = 0, sy = 0, moved = false;
    a.addEventListener("contextmenu", function(e){ e.preventDefault(); });
    a.addEventListener("click", function(e){ if (suppress) { e.preventDefault(); e.stopPropagation(); } });
    a.addEventListener("touchstart", function(e){
      var t = e.touches[0]; sx = t.clientX; sy = t.clientY; moved = false; dragging = false;
      clearTimeout(timer);
      timer = setTimeout(function(){ dragging = true; suppress = true; a.classList.add("drag"); try { navigator.vibrate && navigator.vibrate(15); } catch (x) {} }, 420);
    }, {passive:true});
    a.addEventListener("touchmove", function(e){
      var t = e.touches[0];
      if (!dragging) {
        if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clearTimeout(timer);
        return;
      }
      e.preventDefault();
      if (Math.abs(t.clientX - sx) > 6 || Math.abs(t.clientY - sy) > 6) moved = true;
      a.style.pointerEvents = "none";
      var el = document.elementFromPoint(t.clientX, t.clientY);
      a.style.pointerEvents = "";
      var tgt = el && el.closest ? el.closest("a.t") : null;
      if (tgt && tgt !== a && !tgt.classList.contains("add") && tgt.parentNode === g) {
        var kids = Array.prototype.slice.call(g.children);
        if (kids.indexOf(a) < kids.indexOf(tgt)) g.insertBefore(a, tgt.nextSibling); else g.insertBefore(a, tgt);
      }
    }, {passive:false});
    function end(e){
      clearTimeout(timer);
      if (!dragging) return;
      try { if (e && e.cancelable) e.preventDefault(); } catch (x) {}
      dragging = false; a.classList.remove("drag");
      if (moved) {
        var order = [];
        Array.prototype.forEach.call(g.children, function(c){ if (c.dataset.n != null && c.dataset.n !== "") order.push(pins[+c.dataset.n]); });
        pins = order; save(); render();
      } else {
        openActions(+a.dataset.n);
      }
      setTimeout(function(){ suppress = false; }, 350);
    }
    a.addEventListener("touchend", end);
    a.addEventListener("touchcancel", end);
  }
  render();

  var grads = ["linear-gradient(135deg,#00b894,#00796b)","linear-gradient(135deg,#a55eea,#6c3fc8)","linear-gradient(135deg,#fd79a8,#d63384)","linear-gradient(135deg,#5f7cff,#3949ab)","linear-gradient(135deg,#ff9f43,#e17055)"];
  function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch (e) { return u; } }
  var bms = cfg.bookmarks || [];
  if (bms.length) {
    document.getElementById("bmWrap").hidden = false;
    var bg = document.getElementById("bms");
    bms.forEach(function(b,n){
      var host = hostOf(b.u);
      var a = tile((b.t && b.t.length < 14) ? b.t : host, b.u, host.charAt(0).toUpperCase(), grads[n % grads.length]);
      bg.appendChild(a);
      favicon(a, -1, b.u);
    });
  }
  var hs = cfg.history || [];
  if (hs.length) {
    document.getElementById("hsWrap").hidden = false;
    var hl = document.getElementById("hs");
    hs.forEach(function(x,n){
      var a = document.createElement("a"); a.className = "row"; a.href = x.u;
      var d = document.createElement("span"); d.className = "d"; d.style.background = grads[n % grads.length]; d.textContent = hostOf(x.u).charAt(0).toUpperCase();
      var w = document.createElement("div"); w.style.minWidth = "0";
      var b = document.createElement("b"); b.textContent = x.t || hostOf(x.u);
      var s = document.createElement("small"); s.textContent = hostOf(x.u);
      w.appendChild(b); w.appendChild(s); a.appendChild(d); a.appendChild(w); hl.appendChild(a);
      rowIcon(d, x.u);
    });
  }
})();

</script>
</body>
</html>
